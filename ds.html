<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DS — Federico Monroy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080b;--border:rgba(255,255,255,.08);--text:#f0eee9;--muted:#8a8580;--bar:rgba(8,8,11,.92)}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif}
.top{position:sticky;top:0;z-index:20;height:48px;display:flex;align-items:center;gap:16px;padding:0 28px;background:var(--bar);border-bottom:1px solid var(--border)}
.top a{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);text-decoration:none}
.top .logo{margin-right:auto;color:var(--text);opacity:.65}
.wrap{max-width:1080px;margin:0 auto;padding:28px 28px 80px}
h1{font-family:'Space Grotesk',system-ui;font-size:2rem;letter-spacing:-.03em}
.lede{color:var(--muted);max-width:58ch;margin:8px 0 22px;line-height:1.55}
.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab,.chip,.dev{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:100px;padding:7px 14px;font-family:'Share Tech Mono',monospace;font-size:11px;cursor:pointer}
.tab.on,.chip.on,.dev.on{color:var(--text);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.06)}
.refs{display:flex;flex-wrap:wrap;gap:10px 16px;margin:8px 0 18px;font-size:12px}
.refs a{color:#c9a227}
.stage{width:100%;max-width:920px;aspect-ratio:16/10;position:relative;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="index.html">FM.OS</a>
  <a href="beats.html">Beats</a>
  <a href="gallery.html">Gallery</a>
</div>
<div class="wrap">
  <h1>Design system</h1>
  <p class="lede">Tokens de las páginas reales. Light y dark. Web, tablet y iPhone 17. Customs usa el kit ARIVU (·1071E5 + Inter).</p>
  <div class="tabs">
    <button class="tab on" data-view="web" type="button">Web</button>
    <button class="tab" data-view="mobile" type="button">Mobile</button>
  </div>
  <div class="row" id="skins">
    <button class="chip on" data-skin="ey" type="button">EY</button>
    <button class="chip" data-skin="dc" type="button">DollarCity</button>
    <button class="chip" data-skin="chek" type="button">Ripley / Chek</button>
    <button class="chip" data-skin="cus" type="button">Aduanas SV</button>
    <button class="chip" data-skin="bc" type="button">Blockchain</button>
  </div>
  <div class="row" id="modes">
    <button class="dev on" data-mode="light" type="button">Light</button>
    <button class="dev" data-mode="dark" type="button">Dark</button>
  </div>
  <div class="row" id="devs">
    <button class="dev on" data-dev="desktop" type="button">Desktop</button>
    <button class="dev" data-dev="tablet" type="button">Tablet</button>
    <button class="dev" data-dev="phone" type="button">Phone</button>
  </div>
  <div class="refs">
    <a href="https://www.ey.com/en_gl" target="_blank" rel="noreferrer">ey.com</a>
    <a href="https://dollarcity.com/?pais=gt" target="_blank" rel="noreferrer">dollarcity.com</a>
    <a href="https://www.bancoripley.cl/" target="_blank" rel="noreferrer">bancoripley.cl</a>
    <a href="https://sitio.aduana.gob.sv/" target="_blank" rel="noreferrer">aduana.gob.sv</a>
  </div>
  <div class="stage"><iframe id="frame" title="DS preview"></iframe></div>
</div>
<script>
var view='web', skin='ey', dev='desktop', mode='light';
var frame=document.getElementById('frame');
function src(){
  var q='skin='+skin+'&mode='+mode+'&device='+dev;
  return (view==='mobile' ? 'projects/fm-ds-mobile.html?' : 'projects/fm-ds-web.html?')+q+'&r='+Date.now();
}
function load(){ frame.src=src(); }
function sync(){ document.getElementById('devs').style.display = view==='web' ? 'flex' : 'none'; }
document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){ view=b.dataset.view; document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b)}); sync(); load(); };
});
document.querySelectorAll('#skins .chip').forEach(function(b){
  b.onclick=function(){ skin=b.dataset.skin; document.querySelectorAll('#skins .chip').forEach(function(x){x.classList.toggle('on',x===b)}); load(); };
});
document.querySelectorAll('#modes .dev').forEach(function(b){
  b.onclick=function(){ mode=b.dataset.mode; document.querySelectorAll('#modes .dev').forEach(function(x){x.classList.toggle('on',x===b)}); load(); };
});
document.querySelectorAll('#devs .dev').forEach(function(b){
  b.onclick=function(){ dev=b.dataset.dev; document.querySelectorAll('#devs .dev').forEach(function(x){x.classList.toggle('on',x===b)}); load(); };
});
sync(); load();
</script>
</body>
</html>
