<!DOCTYPE html>
<html lang="en" data-theme="dark" data-skin="ey" data-mode="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Projects DS — Federico Monroy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=Inter:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="projects/fm-ds.css"/>
<style>
html,body{height:auto!important;overflow:auto!important;min-height:100vh;background:var(--bg,#08080b)}
*{box-sizing:border-box}
:root{--bg:#08080b;--border:rgba(255,255,255,.1);--ink:#f0eee9;--dim:#8a8580;--bar:#0c0c10}
html[data-theme="light"]{--bg:#f4f4f1;--border:#d4d0c8;--ink:#1c1b18;--dim:#5c5c66;--bar:#fff}
.topbar{position:sticky;top:0;z-index:20;height:48px;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--bar);border-bottom:1px solid var(--border)}
.topbar a{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);text-decoration:none}
.topbar a.logo{margin-right:auto;color:var(--ink)}
.pg{padding:28px 24px 8px;max-width:920px;margin:0 auto;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}
.pg h1{font-family:'Space Grotesk',system-ui;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em;margin:0}
.pg .lede{margin:8px 0 0;color:var(--dim);max-width:62ch;line-height:1.55}
.ptabs{display:flex;gap:6px;padding:16px 24px 0;max-width:920px;margin:0 auto;flex-wrap:wrap}
.ptab{padding:6px 14px;border-radius:100px;border:1px solid var(--border);background:transparent;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);cursor:pointer}
.ptab:hover,.ptab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{max-width:920px;margin:0 auto;padding:12px 24px 96px;font-family:'DM Sans',system-ui,sans-serif}
.item{padding:22px 0;border-top:1px solid var(--border)}
.item h2{margin:0 0 4px;font-family:'Space Grotesk',system-ui;font-size:1.05rem;color:var(--ink)}
.item .desc{margin:0 0 12px;color:var(--dim);font-size:13px;line-height:1.5}
.row-btns{display:flex;flex-direction:row;gap:8px;align-items:center;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.order{border:1px solid var(--fm-line);border-radius:10px;padding:12px;background:var(--fm-card);max-width:280px}
.order h4{margin:0 0 8px;font-size:12px;color:var(--fm-text)}
.order .ln{display:flex;justify-content:space-between;font-size:12px;color:var(--fm-muted);padding:4px 0;border-bottom:1px solid var(--fm-line)}
.order .tot{display:flex;justify-content:space-between;padding-top:8px;font-size:13px;font-weight:700;color:var(--fm-text)}
.rail a{display:flex;justify-content:space-between;padding:7px 8px;border-radius:6px;font-size:12px;color:var(--fm-muted);text-decoration:none}
.rail a:hover,.rail a.on{background:var(--fm-text);color:var(--fm-bg)}
.modal{border:1px solid var(--fm-line);border-radius:10px;padding:14px;background:var(--fm-card);max-width:360px}
.fm-btn:hover{background:var(--fm-text)!important;color:var(--fm-bg)!important;transform:scale(1.05)}
.fm-chip:hover,.fm-chip.on{background:var(--fm-text)!important;color:var(--fm-bg)!important;border-color:transparent!important}
.fm-photo:hover,.fm-offer:hover{transform:scale(1.04) translateY(-6px);box-shadow:0 18px 36px rgba(0,0,0,.35);outline:2px solid var(--fm-text);outline-offset:2px}
.fm-photo,.fm-offer{cursor:pointer;transition:transform .2s,box-shadow .2s}
.navchip{border:1px solid var(--border);background:transparent;color:var(--dim);border-radius:100px;padding:6px 12px;font-size:12px;cursor:pointer}
.navchip:hover,.navchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{width:100%;aspect-ratio:840/560;position:relative;overflow:visible}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="index.html">FM.OS</a>
  <a href="gallery.html">Gallery</a>
  <a href="#beats">Beats</a>
  <a href="ds.html">Projects DS</a>
  <a href="show.html">Showcase</a>
  <a href="#" id="themeBtn">Light</a>
</div>
<div class="pg">
  <h1>Projects DS</h1>
  <p class="lede">Components first. Beats at the bottom of each project. Quiet plate = ink. Photo plate = white type. Hover inverts.</p>
</div>
<div class="ptabs" id="projects"></div>
<div class="list" id="list"></div>
<script src="projects/fm-engine.js"></script>
<script>
var SKINS=[{id:'ey',name:'EY Fabric'},{id:'dc',name:'DollarCity'},{id:'chek',name:'Chek'},{id:'cus',name:'Customs'},{id:'bc',name:'Blockchain'}];
var BEATS={ey:[['Measure','ey-01-measure.html'],['Analyze','ey-02-analyze.html'],['Funnel','ey-funnel.html'],['Research','ey-research.html'],['Understand','ey-understand.html'],['Design','ey-design.html'],['Hub','ey-hub.html'],['Requester','ey-req.html'],['Publisher','ey-pub.html']],dc:[['POS','dollarcity-player.html']],chek:[['Card','chek-player.html']],cus:[['ARIVU','customs.html']],bc:[['Map','blockchain-player.html']]};
var skin='ey', beat='ey-02-analyze.html';
function theme(){ return document.documentElement.getAttribute('data-theme')||'dark'; }
function applyTheme(th){
  document.documentElement.setAttribute('data-theme', th);
  document.documentElement.setAttribute('data-mode', th);
  try{ localStorage.setItem('fm-theme', th); }catch(e){}
  document.getElementById('themeBtn').textContent = th==='light' ? 'Dark' : 'Light';
}
(function(){
  var saved=null; try{ saved=localStorage.getItem('fm-theme'); }catch(e){}
  applyTheme(saved==='light'?'light':'dark');
  document.getElementById('themeBtn').onclick=function(e){ e.preventDefault(); applyTheme(theme()==='light'?'dark':'light'); draw(); };
})();
function item(title, cls, desc, body){
  return '<article class="item"><h2>'+title+'</h2><p class="desc"><code>'+cls+'</code> — '+desc+'</p>'+body+'</article>';
}
function draw(){
  document.documentElement.setAttribute('data-skin', skin);
  document.documentElement.setAttribute('data-mode', theme());
  if(window.FM){ FM.skin(skin); FM.mode(theme()); }
  var box=document.getElementById('projects'); box.innerHTML='';
  SKINS.forEach(function(s){
    var b=document.createElement('button');
    b.className='ptab'+(s.id===skin?' on':'');
    b.textContent=s.name;
    b.onclick=function(){ skin=s.id; beat=(BEATS[skin][0]||[])[1]; draw(); };
    box.appendChild(b);
  });
  var list=BEATS[skin]||[];
  if(!list.some(function(p){ return p[1]===beat; })) beat=(list[0]||[])[1];
  var chips='<div class="row-btns" style="margin-bottom:12px">';
  list.forEach(function(p){ chips+='<button class="navchip'+(beat===p[1]?' on':'')+'" data-b="'+p[1]+'">'+p[0]+'</button>'; });
  chips+='</div>';
  document.getElementById('list').innerHTML=
    item('Buttons','.fm-btn', 'Hover inverts.', '<div class="row-btns"><button class="fm-btn" type="button">Get started</button><button class="fm-btn ghost" type="button">View</button></div>')+
    item('Offer card','.fm-offer', 'View + Get started in a row.', '<div class="fm-offer" style="max-width:320px"><div class="kind">Services</div><b>Workbench workspace</b><div class="row-btns" style="margin-top:10px"><button class="fm-btn ghost" type="button">View</button><button class="fm-btn" type="button">Get started</button></div></div>')+
    item('Category tiles','.fm-photo', 'Large hover.', '<div class="grid3"><div class="fm-photo"><b>Services</b><span>Compute</span></div><div class="fm-photo"><b>Licenses</b><span>Rights</span></div><div class="fm-photo"><b>Kits</b><span>Start</span></div></div>')+
    item('Your order','.order', 'Lines + total.', '<div class="order"><h4>Your order</h4><div class="ln"><span>Workbench</span><span>$0</span></div><div class="tot"><span>Total</span><span>$0 / mo</span></div></div>')+
    item('Chips','.fm-chip', 'Selected inverts.', '<div class="row-btns"><span class="fm-chip on" data-chip>All</span><span class="fm-chip" data-chip>Services</span></div>')+
    item('Tags','.fm-tag', 'Bad = drop-off.', '<div class="row-btns"><span class="fm-tag ok">AI pass</span><span class="fm-tag bad">Drop-off</span></div>')+
    item('Beats','#beats', 'Per project. Same 840×560 unit.', chips+'<div class="stage" id="beats"><iframe title="Beat" src="projects/'+beat+'?mode='+theme()+'&r='+Date.now()+'"></iframe></div>');
  document.querySelectorAll('[data-chip]').forEach(function(c){
    c.onclick=function(){ document.querySelectorAll('[data-chip]').forEach(function(x){ x.classList.remove('on'); }); c.classList.add('on'); };
  });
  document.querySelectorAll('[data-b]').forEach(function(c){
    c.onclick=function(){ beat=c.dataset.b; draw(); location.hash='beats'; };
  });
  if(location.hash==='#beats') document.getElementById('beats').scrollIntoView({block:'start'});
}
draw();
</script>
</body>
</html>
