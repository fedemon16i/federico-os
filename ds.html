<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Design system — Federico Monroy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080b;--border:rgba(255,255,255,.1);--text:#f0eee9;--muted:#8a8580;--bar:#0c0c10;--row:#101014}
html[data-theme="light"]{--bg:#f4f4f1;--border:#d4d0c8;--text:#1c1b18;--muted:#5c5c66;--bar:#fff;--row:#fff}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif}
.topbar{position:sticky;top:0;z-index:20;height:48px;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--bar);border-bottom:1px solid var(--border)}
.topbar a{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);text-decoration:none}
.topbar a.logo{margin-right:auto;color:var(--text)}
.pg{padding:28px 24px 12px;max-width:1180px;margin:0 auto}
.pg h1{font-family:'Space Grotesk',system-ui;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em}
.pg p{margin-top:8px;color:var(--muted);max-width:62ch;line-height:1.55}
.ptabs{display:flex;gap:6px;padding:16px 24px 0;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.ptab{padding:6px 14px;border-radius:100px;border:1px solid var(--border);background:transparent;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer}
.ptab.on{color:var(--text);border-color:var(--text)}
.shell{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding:20px 24px 80px}
.side a{display:block;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:13px}
.side a.on{background:var(--row);color:var(--text);border:1px solid var(--border)}
.main h2{font-family:'Space Grotesk',system-ui;font-size:1.2rem;margin:0 0 8px}
.main .lede{color:var(--muted);font-size:13px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
code{font-family:'Share Tech Mono',monospace;font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:100px;padding:6px 12px;font-size:12px;cursor:pointer}
.chip.on{color:var(--text);border-color:var(--text)}
.stage{width:100%;aspect-ratio:840/560;position:relative;overflow:visible;background:transparent}
.stage iframe,.live{border:0;background:transparent}
.stage iframe{position:absolute;inset:0;width:100%;height:100%}
.live{width:100%;min-height:720px}
@media(max-width:800px){.shell{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="index.html">FM.OS</a>
  <a href="gallery.html">Gallery</a>
  <a href="beats.html">Beats</a>
  <a href="ds.html">DS</a>
  <a href="#" id="themeBtn">Light</a>
  <a href="index.html">Back</a>
</div>
<div class="pg">
  <h1>Design system</h1>
  <p>Same categories as the sheet. Project, then library. Beats are the last item.</p>
</div>
<div class="ptabs" id="projects"></div>
<div class="shell">
  <nav class="side" id="side"></nav>
  <div class="main" id="main"></div>
</div>
<script>
var SKINS=[{id:'ey',name:'EY Fabric'},{id:'dc',name:'DollarCity'},{id:'chek',name:'Chek'},{id:'cus',name:'Customs'},{id:'bc',name:'Blockchain'}];
var BEATS={ey:[['Measure','ey-01-measure.html'],['Analyze','ey-02-analyze.html'],['Funnel','ey-funnel.html'],['Research','ey-research.html'],['Understand','ey-understand.html'],['Design','ey-design.html'],['Hub','ey-hub.html'],['Requester','ey-req.html'],['Publisher','ey-pub.html']],dc:[['POS','dollarcity-player.html']],chek:[['Card','chek-player.html']],cus:[['ARIVU','customs.html']],bc:[['Map','blockchain-player.html']]};
var NAV=[
  ['index','Index'],
  ['tokens','Tokens'],
  ['type','Type'],
  ['buttons','Buttons'],
  ['bars','Bars'],
  ['banners','Banners'],
  ['chips','Chips'],
  ['cards','Cards'],
  ['forms','Forms'],
  ['tables','Tables'],
  ['kpis','KPIs'],
  ['alerts','Alerts'],
  ['icons','Icons'],
  ['extras','Extras'],
  ['beats','Beats']
];
var skin='ey', beat='ey-02-analyze.html', section='index';
function theme(){ return document.documentElement.getAttribute('data-theme')||'dark'; }
function applyTheme(th){
  document.documentElement.setAttribute('data-theme', th);
  try{ localStorage.setItem('fm-theme', th); }catch(e){}
  var btn=document.getElementById('themeBtn');
  if(btn) btn.textContent = th==='light' ? 'Dark' : 'Light';
}
(function(){
  var saved=null; try{ saved=localStorage.getItem('fm-theme'); }catch(e){}
  applyTheme(saved==='light'?'light':'dark');
  document.getElementById('themeBtn').onclick=function(e){ e.preventDefault(); applyTheme(theme()==='light'?'dark':'light'); draw(); };
})();
function modeQ(){ return '?mode='+theme()+'&skin='+skin+'&r='+Date.now(); }
function draw(){
  var box=document.getElementById('projects'); box.innerHTML='';
  SKINS.forEach(function(s){
    var b=document.createElement('button');
    b.className='ptab'+(s.id===skin?' on':'');
    b.textContent=s.name;
    b.onclick=function(){ skin=s.id; beat=(BEATS[skin][0]||[])[1]; draw(); };
    box.appendChild(b);
  });
  var side=document.getElementById('side'); side.innerHTML='';
  NAV.forEach(function(pair){
    var a=document.createElement('a'); a.href='#'; a.className=section===pair[0]?'on':''; a.textContent=pair[1];
    a.onclick=function(e){ e.preventDefault(); section=pair[0]; draw(); };
    side.appendChild(a);
  });
  var main=document.getElementById('main');
  if(section==='index'){
    main.innerHTML='<h2>Index</h2><p class="lede">'+SKINS.filter(function(s){return s.id===skin})[0].name+'</p><table><thead><tr><th>Category</th><th>Class</th></tr></thead><tbody>'+
      '<tr><td>Buttons</td><td><code>.fm-btn .fm-btn.ghost</code></td></tr>'+
      '<tr><td>Bars</td><td><code>.ey-bbar .nav .search</code></td></tr>'+
      '<tr><td>Banners</td><td><code>.hero .fm-hero</code></td></tr>'+
      '<tr><td>Chips</td><td><code>.ey-chip .tabs i</code></td></tr>'+
      '<tr><td>Cards</td><td><code>.svc .fm-offer</code></td></tr>'+
      '<tr><td>Forms</td><td><code>.box .fm-field</code></td></tr>'+
      '<tr><td>Tags</td><td><code>.fm-tag.ok .warn .bad</code></td></tr>'+
      '</tbody></table>';
    return;
  }
  if(section==='beats'){
    var chips='<div class="chips">';
    (BEATS[skin]||[]).forEach(function(p){ chips+='<button class="chip'+(beat===p[1]?' on':'')+'" data-b="'+p[1]+'">'+p[0]+'</button>'; });
    chips+='</div>';
    main.innerHTML='<h2>Beats</h2><p class="lede">840×560. Theme follows the site switch.</p>'+chips+'<div class="stage"><iframe title="Beat" src="projects/'+beat+modeQ()+'"></iframe></div>';
    main.querySelectorAll('[data-b]').forEach(function(b){ b.onclick=function(){ beat=b.dataset.b; draw(); }; });
    return;
  }
  main.innerHTML='<h2>'+(NAV.filter(function(x){return x[0]===section})[0]||['',section])[1]+'</h2><iframe class="live" title="Specimen" src="projects/fm-ds-sheet.html'+modeQ()+'#'+section+'"></iframe>';
}
draw();
</script>
</body>
</html>
