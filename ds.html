<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DS projects — Federico Monroy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080b;--border:rgba(255,255,255,.12);--text:#f0eee9;--muted:#9a958c;--bar:#0c0c10;--chip-on:#e8e4dc}
html[data-theme="light"]{--bg:#f4f4f1;--border:#d4d0c8;--text:#1f2430;--muted:#5c5c66;--bar:#ffffff;--chip-on:#1f2430}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif}
.top{position:sticky;top:0;z-index:20;height:48px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--bar);border-bottom:1px solid var(--border)}
.top a{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);text-decoration:none}
.top .logo{margin-right:auto;color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:24px 20px 12px}
h1{font-family:'Space Grotesk',system-ui;font-size:clamp(1.6rem,5vw,2rem);letter-spacing:-.03em}
.lede{color:var(--muted);max-width:64ch;margin:8px 0 20px;line-height:1.55;font-size:14px}
.lbl{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip,.dev{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:100px;padding:8px 14px;font-family:'Share Tech Mono',monospace;font-size:12px;cursor:pointer}
.chip.on,.dev.on{color:var(--bg);background:var(--chip-on);border-color:var(--chip-on)}
html[data-theme="light"] .chip.on,html[data-theme="light"] .dev.on{color:#fff}
.meta{font-size:12px;color:var(--muted);margin:0 0 10px}
.stage{width:100%;aspect-ratio:840/560;position:relative;overflow:visible;margin:0;background:transparent}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.catalog{border-top:1px solid var(--border);margin-top:28px;padding:20px 20px 80px;max-width:980px;margin-left:auto;margin-right:auto}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.jump button{border:0;background:transparent;color:var(--muted);font:12px 'DM Sans',sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sheet-host{width:100%;min-height:1100px;border:0;background:transparent}
.sheet-host iframe{width:100%;height:1100px;border:0;background:transparent}
@media (max-width:720px){
  .wrap,.catalog{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="index.html">FM.OS</a>
  <a href="beats.html">Beats page</a>
  <a href="docs/DS-LIBRARY.md">Spec</a>
</div>
<div class="wrap">
  <h1>Design system</h1>
  <p class="lede">One primary button. One ghost. Beat sits loose on this page — the window outline belongs to the beat.</p>

  <p class="lbl">Project</p>
  <div class="row" id="skins">
    <button class="chip on" data-skin="ey" type="button">EY Fabric</button>
    <button class="chip" data-skin="dc" type="button">DollarCity</button>
    <button class="chip" data-skin="chek" type="button">Chek</button>
    <button class="chip" data-skin="cus" type="button">Customs</button>
    <button class="chip" data-skin="bc" type="button">Blockchain</button>
  </div>

  <p class="lbl">Mode</p>
  <div class="row">
    <button class="dev on" data-mode="light" type="button">Light</button>
    <button class="dev" data-mode="dark" type="button">Dark</button>
  </div>

  <p class="lbl">Beats</p>
  <div class="row" id="beats"></div>
  <p class="meta">840 × 560 · uniform scale</p>
  <div class="stage"><iframe id="preview" title="Preview"></iframe></div>
</div>

<div class="catalog">
  <p class="lbl">Catalog</p>
  <div class="row">
    <button class="dev on" data-cat="lib" type="button">Library</button>
    <button class="dev" data-cat="diag" type="button">Diagrams</button>
  </div>
  <div class="jump" id="jumps"></div>
  <div class="sheet-host"><iframe id="sheet" title="Library"></iframe></div>
</div>
<script>
var skin='ey', mode='light', cat='lib', beat='ey-02-analyze.html';
var preview=document.getElementById('preview');
var sheet=document.getElementById('sheet');
var PHONE=['chek','bc'];
var BEATS={
  ey:[
    ['Measure','ey-01-measure.html'],['Analyze','ey-02-analyze.html'],['Funnel','ey-funnel.html'],
    ['Research','ey-research.html'],['Understand','ey-understand.html'],['Design','ey-design.html'],
    ['Hub','ey-hub.html'],['Requester','ey-req.html'],['Publisher','ey-pub.html']
  ],
  dc:[['POS','dollarcity-player.html']],
  chek:[['Card','chek-player.html']],
  cus:[['ARIVU','customs.html']],
  bc:[['Map','blockchain-player.html']]
};
var JUMP=['tokens','type','buttons','bars','banners','chips','cards','forms','tables','kpis','alerts','icons','logos','extras'];
function isPhone(){ return PHONE.indexOf(skin)>=0; }
function theme(){ document.documentElement.setAttribute('data-theme', mode); }
function sheetUrl(hash){
  if(cat==='diag') return 'projects/fm-ds-diagrams.html?skin='+skin+'&mode='+mode;
  return 'projects/fm-ds-sheet.html?skin='+skin+'&mode='+mode+(hash?('#'+hash):'');
}
function previewUrl(){
  if(isPhone()) return 'projects/fm-ds-preview.html?skin='+skin+'&mode='+mode+'&device=phone&r='+Date.now();
  return 'projects/'+beat+'?mode='+mode+'&r='+Date.now();
}
function beatsRow(){
  var box=document.getElementById('beats'); box.innerHTML='';
  var list=BEATS[skin]||[];
  if(!list.some(function(x){ return x[1]===beat; })) beat=list[0][1];
  list.forEach(function(pair){
    var b=document.createElement('button');
    b.type='button'; b.className='chip'+(beat===pair[1]?' on':'');
    b.textContent=pair[0];
    b.onclick=function(){ beat=pair[1]; beatsRow(); preview.src=previewUrl(); };
    box.appendChild(b);
  });
}
function jumps(){
  var box=document.getElementById('jumps'); box.innerHTML='';
  box.style.display = cat==='lib' ? 'flex' : 'none';
  JUMP.forEach(function(name){
    var b=document.createElement('button'); b.type='button'; b.textContent=name;
    b.onclick=function(){ sheet.src=sheetUrl(name); };
    box.appendChild(b);
  });
}
function load(){ theme(); beatsRow(); preview.src=previewUrl(); sheet.src=sheetUrl(); jumps(); }
function mark(sel, el){ document.querySelectorAll(sel).forEach(function(x){ x.classList.toggle('on', x===el); }); }
document.querySelectorAll('#skins .chip').forEach(function(b){
  b.onclick=function(){ skin=b.dataset.skin; mark('#skins .chip', b); load(); };
});
document.querySelectorAll('[data-mode]').forEach(function(b){
  b.onclick=function(){ mode=b.dataset.mode; mark('[data-mode]', b); load(); };
});
document.querySelectorAll('[data-cat]').forEach(function(b){
  b.onclick=function(){ cat=b.dataset.cat; mark('[data-cat]', b); sheet.src=sheetUrl(); jumps(); };
});
load();
</script>
</body>
</html>
