<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Beats — Federico Monroy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080b;
  --border:rgba(255,255,255,.06);
  --text:#f0eee9;
  --muted:#8a8580;
  --dim:#4a4845;
  --fn:'DM Sans',system-ui,sans-serif;
  --fm:'Share Tech Mono',ui-monospace,monospace;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--fn)}

.skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.skip-link:focus{left:8px;top:8px;width:auto;height:auto;padding:8px 12px;background:#000;color:#fff;z-index:999}

/* ── Topbar ──────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:100;
  height:48px;display:flex;align-items:center;gap:16px;
  padding:0 32px;
  background:rgba(8,8,11,.88);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.topbar-logo{
  font-family:var(--fm);font-size:13px;color:var(--text);
  text-decoration:none;margin-right:auto;opacity:.6;transition:opacity .2s;
}
.topbar-logo:hover{opacity:1}
.topbar-back{
  font-family:var(--fm);font-size:11px;color:var(--muted);
  text-decoration:none;display:flex;align-items:center;gap:5px;
  transition:color .2s;letter-spacing:.04em;
}
.topbar-back:hover{color:var(--text)}
@media(max-width:600px){.topbar{padding:0 16px}}

/* ── Page header ─────────────────────────────────── */
.pg-hd{padding:40px 32px 0;max-width:980px;margin:0 auto}
.pg-hd h1{
  font-family:var(--fd);font-size:clamp(1.6rem,1rem+2.5vw,2.6rem);
  font-weight:700;letter-spacing:-.035em;line-height:1.08;
}
.pg-hd p{margin-top:10px;font-size:.9375rem;color:var(--muted);max-width:46ch;line-height:1.65}
@media(max-width:600px){.pg-hd{padding:28px 16px 0}}

/* ── Project tabs ─────────────────────────────────── */
.proj-tabs{
  display:flex;gap:6px;padding:24px 32px 0;
  max-width:980px;margin:0 auto;
  overflow-x:auto;scrollbar-width:none;
}
.proj-tabs::-webkit-scrollbar{display:none}
@media(max-width:600px){.proj-tabs{padding:20px 16px 0}}
.ptab{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px;border-radius:100px;
  border:1px solid var(--border);background:transparent;
  font-family:var(--fm);font-size:11px;color:var(--muted);
  cursor:pointer;white-space:nowrap;flex:0 0 auto;
  transition:border-color .18s,color .18s,background .18s;
}
.ptab .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--ta,#666);opacity:.38;transition:opacity .18s;flex-shrink:0;
}
.ptab.on{
  color:var(--text);
  border-color:color-mix(in srgb,var(--ta,#fff) 45%,transparent);
  background:color-mix(in srgb,var(--ta,#fff) 7%,transparent);
}
.ptab.on .dot{opacity:1}
.ptab:hover:not(.on){color:var(--text);border-color:rgba(255,255,255,.15)}

/* ── Panels ──────────────────────────────────────── */
#panels{max-width:980px;margin:0 auto}
.proj-panel{display:none;padding:40px 32px 80px}
.proj-panel.on{display:block}
@media(max-width:600px){.proj-panel{padding:28px 16px 60px}}

/* ── Beat list ───────────────────────────────────── */
.beat-list{display:flex;flex-direction:column}

/* ── Beat row ────────────────────────────────────── */
.beat{
  display:grid;
  grid-template-columns:minmax(0,240px) 1fr;
  gap:40px;align-items:start;
  padding:52px 0;
  border-top:1px solid var(--border);
}
.beat:first-child{border-top:none;padding-top:0}
@media(max-width:720px){
  .beat{grid-template-columns:1fr;gap:20px;padding:40px 0}
  .beat:first-child{padding-top:0}
}

/* Info col */
.bi{display:flex;flex-direction:column;gap:12px;position:sticky;top:64px}
@media(max-width:720px){.bi{position:static}}

.bi-n{
  font-family:var(--fm);font-size:10px;
  color:var(--accent,#888);opacity:.65;
  letter-spacing:.1em;text-transform:uppercase;
}
.bi-title{
  font-family:var(--fd);font-size:1.3rem;font-weight:700;
  letter-spacing:-.025em;line-height:1.1;color:var(--text);
}
.bi-desc{font-size:.875rem;line-height:1.72;color:var(--muted)}

/* Controls */
.bi-ctrls{display:flex;gap:7px;flex-wrap:wrap;padding-top:4px}
.ctrl{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:7px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.03);
  font-family:var(--fm);font-size:10px;color:var(--muted);
  cursor:pointer;transition:border-color .18s,color .18s,background .18s;
}
.ctrl svg{flex-shrink:0}
.ctrl:hover{color:var(--text);border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.ctrl.replay{
  border-color:color-mix(in srgb,var(--accent,#fff) 38%,transparent);
  color:var(--accent,#f0eee9);
}
.ctrl.replay:hover{
  background:color-mix(in srgb,var(--accent,#fff) 8%,transparent);
  border-color:color-mix(in srgb,var(--accent,#fff) 60%,transparent);
}

/* ── Animation stage — frameless ─────────────────── */
/*
   No border. No background. No border-radius.
   The animation lives directly on the page.
*/
.beat-stage{
  position:relative;
  /* maintain the unit's native 560×410 ratio */
  aspect-ratio:560/410;
  overflow:hidden;
}
.beat-stage iframe{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:none;
  /* allow transparent background to show through */
  background:transparent;
}
/* tiny fade-in on load */
.beat-stage iframe{opacity:0;transition:opacity .4s}
.beat-stage iframe.loaded{opacity:1}

/* Loader pulse */
.fld{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transition:opacity .5s;pointer-events:none;
}
.fld.gone{opacity:0}
.fld-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent,#888);opacity:.3;
  animation:fldp 1.4s ease-in-out infinite;
}
@keyframes fldp{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.35)}}

/* accent per panel */
.proj-panel{--accent:var(--pa,#888)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="topbar">
  <a href="index.html" class="topbar-logo">FM.OS</a>
  <a href="index.html" class="topbar-back">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
</div>

<div class="pg-hd">
  <h1>Beats</h1>
  <p>Every animation sequence, loose — no player chrome, no container. Replay or stop any beat.</p>
</div>

<div class="proj-tabs" role="tablist" aria-label="Projects" id="projTabs"></div>

<div id="panels" id="main"></div>

<script>
/* ── CSS injected into each player iframe ─────────────
   Goal: strip ALL chrome, make background transparent,
   let the animation canvas render free on the page.
──────────────────────────────────────────────────────── */
var STRIP_CSS = [
  /* ── Transparent backgrounds all the way down ───────── */
  'html,body,.page,.shell,.stage-col,.frame,.unit,.win,.unit-host{background:transparent!important}',
  /* Stage itself — the main culprit: has --stage-bg color + grid image + border */
  '.stage{background:transparent!important;background-image:none!important;border:none!important;box-shadow:none!important;border-radius:0!important}',
  /* Other frame containers */
  '.frame,.unit{background-image:none!important;border:none!important;box-shadow:none!important;border-radius:0!important}',

  /* ── Hide ALL player chrome ─────────────────────────── */
  /* EY PI / Skills */
  '.page>.kicker,.page>h1,.page>.lead{display:none!important}',
  '.tl,#tl,.tl-row,.pill-row{display:none!important}',
  '.controls,.controls-col{display:none!important}',
  /* Stage chrome — all players */
  '.stage-top,.stage-arrows,.stage-chrome,.capbar,.cap,.cap-row,.cap-txt{display:none!important}',
  /* Outer page chrome */
  '.page-chrome,.chrome-bar,.chrome-top,.timeline,.note{display:none!important}',
  '.eyebrow,body>.wrap>h1,.lede{display:none!important}',
  /* Text phase overlay */
  '#textPhase,.text-phase,.text-col,.intro-overlay{display:none!important}',

  /* ── Embed layout fixes ──────────────────────────────── */
  /* Remove body padding — DollarCity/Chek have no embed body rule by default */
  'html.embed body{padding:0!important;margin:0!important;overflow:hidden!important}',
  'html.embed .page{padding:0!important;margin:0!important}',
  /* Outer .wrap (DollarCity/Chek/Blockchain wrapper) */
  'html.embed .wrap{padding:0!important;margin:0!important;height:100%!important;display:flex!important;flex-direction:column!important;max-width:none!important}',
  /* EY / Skills shell */
  'html.embed .shell{gap:0!important}',
  'html.embed .shell>div:first-child{display:none!important}',
  /* Stage fills the full space */
  'html.embed .stage{flex:1!important;min-height:0!important;height:auto!important;width:100%!important}',
  /* Stage window inner padding (Chek has 64px bottom for capbar — remove it) */
  '.stage-window{padding:0!important}',
  /* Unit host (DollarCity centering wrapper) */
  '.unit-host{width:100%!important;height:100%!important;min-height:0!important}',
  /* Make .unit fill the full stage */
  'html.embed .unit,html.embed #unit,.unit{width:100%!important;height:100%!important;position:relative!important;top:auto!important;transform:none!important;max-width:none!important}'
].join('\n');

/* ── Data ─────────────────────────────────────────── */
var PROJECTS = [
  {
    id:'ey', name:'EY Fabric', accent:'#c9a227',
    src:'projects/ey-pi-player.html',
    beats:[
      {n:'01',name:'Measure',   desc:'Analytics snapshot across EY Fabric catalog listings — traffic, engagement, conversion at a glance.'},
      {n:'02',name:'Analyze',   desc:'Funnel analysis revealing where users drop across search, detail, and apply flows.'},
      {n:'03',name:'Research',  desc:'User research synthesis mapped to catalog friction points and unmet needs.'},
      {n:'04',name:'Understand',desc:'Persona map — who uses the catalog, what they need, and what blocks them.'},
      {n:'05',name:'Design',    desc:'Redesigned catalog search and product detail flow — clarity-first information architecture.'},
      {n:'06',name:'Hub',       desc:'Central hub connecting all catalog interactions — a single control surface.'},
      {n:'07',name:'User flow', desc:'Guided onboarding: Pendo tooltip → pre-checklist gate → step-by-step form with live cost.'},
      {n:'08',name:'Publisher', desc:'Publisher dashboard — add onboarding guides, define checklists, review submissions.'},
      {n:'09',name:'Improved',  desc:'Before vs after — same form, guided entry, inline context, cost before commit.'},
    ]
  },
  {
    id:'skills', name:'Skills', accent:'#d97757',
    src:'projects/skills-player.html',
    beats:[
      {n:'01',name:'Mapping',   desc:'Skills taxonomy mapped across roles, seniority, and org units.'},
      {n:'02',name:'Usage',     desc:'Which skills are actually used — frequency and recency data surfaced.'},
      {n:'03',name:'Segment',   desc:'Cohort segmentation — clusters of skill patterns by team and level.'},
      {n:'04',name:'Research',  desc:'Research synthesis: where skills gap is felt most acutely by managers and ICs.'},
      {n:'05',name:'Understand',desc:'Mental models — how people think about skill growth and gap identification.'},
      {n:'06',name:'Design',    desc:'Redesigned skill profile and endorsement flow — mutual recognition built in.'},
      {n:'07',name:'Hub',       desc:'Skill hub: personal profile, team view, and org-wide leaderboard in one surface.'},
      {n:'08',name:'Systems',   desc:'Systems view — skill health across the whole org, filterable by domain.'},
    ]
  },
  {
    id:'dc', name:'DollarCity', accent:'#00a650',
    src:'projects/dollarcity-player.html',
    beats:[
      {n:'01',name:'Why',      desc:'Reviewers juggling tabs to watch footage and search products — everything moves to one screen.'},
      {n:'02',name:'Search',   desc:'Flagged transactions surface first — score, exceptions, and one-click path to footage.'},
      {n:'03',name:'States',   desc:'Every request shows its state up front — queued, downloading, ready — no more wondering.'},
      {n:'04',name:'Review',   desc:'Footage and receipt line up frame-by-frame — classify without leaving the video.'},
      {n:'05',name:'Expand',   desc:'One click expands footage full-frame — the receipt stays one tab away.'},
      {n:'06',name:'Requests', desc:'Every clip a reviewer pulled lives in one place — searchable, filterable, deletable in bulk.'},
      {n:'07',name:'New',      desc:'Requesting footage is one modal — camera, time range, and quality, nothing hidden.'},
      {n:'08',name:'Queue',    desc:'Downloads process in the background — reviewers keep working instead of watching a spinner.'},
      {n:'09',name:'Filters',  desc:'Filters and image-first product search replace memorized SKU lookups.'},
    ]
  },
  {
    id:'bc', name:'Blockchain 3D', accent:'#22d4c8',
    src:'projects/blockchain-player.html',
    beats:[
      {n:'01',name:'Onboard',desc:'Welcome to your 3D map — content lives on places you own in space.'},
      {n:'02',name:'Place',  desc:'Enter the map, long-press the street, confirm the address, style your pin.'},
      {n:'03',name:'Media',  desc:'Empty feed → choose source → device gallery → upload and publish.'},
      {n:'04',name:'Visitor',desc:'Find MY POI on the map — tap the pin, scroll reels, play full-screen.'},
    ]
  },
  {
    id:'chek', name:'Chek', accent:'#7a3be0',
    src:'projects/chek-player.html',
    beats:[
      {n:'01',name:'Hub',     desc:'Credit card hub — balance, limit, quick actions, and recent moves at a glance.'},
      {n:'02',name:'Pay',     desc:'Pay card flow — amount input, date picker, confirmation, all in one modal.'},
      {n:'03',name:'Limit',   desc:'Credit limit and balance breakdown — available, used, cash advance in one view.'},
      {n:'04',name:'Moves',   desc:'Movements and statements — filterable transaction history with statement export.'},
      {n:'05',name:'Security',desc:'Security help — card block and unblock, PIN change, fraud report flow.'},
      {n:'06',name:'Onboard', desc:'Onboarding — step-by-step first-time setup for a new credit card activation.'},
    ]
  },
  {
    id:'customs', name:'Customs ES', accent:'#e05c4a',
    src:'projects/customs-player.html',
    beats:[
      {n:'01',name:'Dashboard', desc:'Home shell — open documents, KPIs, filter and new-document action always visible.'},
      {n:'02',name:'Select',    desc:'Pick the used-vehicle procedure — the legal path for the import opens.'},
      {n:'03',name:'Form',      desc:'Fill operational facts: transport, office, importer, vehicle. Footer actions stay on screen.'},
      {n:'04',name:'Review',    desc:'Review before the document exists — Generate stays in the window footer.'},
      {n:'05',name:'Done',      desc:'Document created, same ID continues — ready for the field hand-off.'},
      {n:'06',name:'Present',   desc:'Driver presents, officer waits to scan — two devices, one operation.'},
      {n:'07',name:'Incident',  desc:'Scan fails — both screens say why. Driver and officer stay in the product.'},
      {n:'08',name:'Release',   desc:'Second scan clears the vehicle — phone and tablet flip to approved.'},
    ]
  }
];

/* ── Icons ────────────────────────────────────────── */
var IC = {
  replay:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>',
  stop:  '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>'
};

/* ── Registries ───────────────────────────────────── */
var iframes = {}; // key projId_bi → iframe
var srcs    = {}; // key projId_bi → original src

/* ── Build DOM ────────────────────────────────────── */
var tabsEl   = document.getElementById('projTabs');
var panelsEl = document.getElementById('panels');

PROJECTS.forEach(function(proj, pi){
  /* Tab */
  var tab = document.createElement('button');
  tab.className = 'ptab'+(pi===0?' on':'');
  tab.setAttribute('role','tab');
  tab.setAttribute('aria-selected', pi===0?'true':'false');
  tab.style.setProperty('--ta', proj.accent);
  tab.innerHTML = '<span class="dot"></span>'+proj.name;
  tab.addEventListener('click', function(){ switchProj(pi); });
  tabsEl.appendChild(tab);

  /* Panel */
  var panel = document.createElement('div');
  panel.className = 'proj-panel'+(pi===0?' on':'');
  panel.id = 'panel-'+proj.id;
  panel.setAttribute('role','tabpanel');
  panel.style.setProperty('--pa', proj.accent);

  var list = document.createElement('div');
  list.className = 'beat-list';

  proj.beats.forEach(function(beat, bi){
    var key = proj.id+'_'+bi;

    var row = document.createElement('div');
    row.className = 'beat';

    /* — Info — */
    var info = document.createElement('div');
    info.className = 'bi';

    var bnum = document.createElement('div');
    bnum.className = 'bi-n';
    bnum.textContent = 'Beat '+beat.n;

    var btitle = document.createElement('h2');
    btitle.className = 'bi-title';
    btitle.textContent = beat.name;

    var bdesc = document.createElement('p');
    bdesc.className = 'bi-desc';
    bdesc.textContent = beat.desc;

    var ctrls = document.createElement('div');
    ctrls.className = 'bi-ctrls';

    var btnR = document.createElement('button');
    btnR.className = 'ctrl replay';
    btnR.innerHTML = IC.replay+' Replay';
    btnR.setAttribute('aria-label','Replay '+beat.name);
    btnR.addEventListener('click', function(){ replay(proj.id, bi); });

    var btnS = document.createElement('button');
    btnS.className = 'ctrl';
    btnS.innerHTML = IC.stop+' Stop';
    btnS.setAttribute('aria-label','Stop '+beat.name);
    btnS.addEventListener('click', function(){ stop(proj.id, bi); });

    ctrls.appendChild(btnR);
    ctrls.appendChild(btnS);
    info.appendChild(bnum);
    info.appendChild(btitle);
    info.appendChild(bdesc);
    info.appendChild(ctrls);

    /* — Stage (frameless) — */
    var stage = document.createElement('div');
    stage.className = 'beat-stage';

    var fld = document.createElement('div');
    fld.className = 'fld';
    fld.style.setProperty('--accent', proj.accent);
    fld.innerHTML = '<div class="fld-dot"></div>';

    var src = proj.src+'?embed=1';
    srcs[key] = src;

    var iframe = document.createElement('iframe');
    iframe.src = src;
    iframe.title = proj.name+' — '+beat.name;
    iframe.setAttribute('loading','lazy');
    iframe.setAttribute('allowtransparency','true');
    iframes[key] = iframe;

    iframe.addEventListener('load', function(){
      fld.classList.add('gone');
      iframe.classList.add('loaded');
      injectStrip(iframe);
      /* Auto-play this beat */
      setTimeout(function(){
        postMsg(iframe, {type:'playBeat', index:bi});
      }, 260);
    });

    stage.appendChild(fld);
    stage.appendChild(iframe);
    row.appendChild(info);
    row.appendChild(stage);
    list.appendChild(row);
  });

  panel.appendChild(list);
  panelsEl.appendChild(panel);
});

/* ── Project switch ───────────────────────────────── */
var curProj = 0;

function switchProj(pi){
  if(pi===curProj) return;
  document.getElementById('panel-'+PROJECTS[curProj].id).classList.remove('on');
  curProj = pi;
  document.getElementById('panel-'+PROJECTS[pi].id).classList.add('on');
  tabsEl.querySelectorAll('.ptab').forEach(function(t,i){
    t.classList.toggle('on',i===pi);
    t.setAttribute('aria-selected',i===pi?'true':'false');
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── Beat controls ────────────────────────────────── */
function replay(projId, bi){
  var iframe = iframes[projId+'_'+bi];
  if(!iframe) return;
  postMsg(iframe, {type:'playBeat', index:bi});
}

function stop(projId, bi){
  var key = projId+'_'+bi;
  var iframe = iframes[key];
  if(!iframe) return;
  /* Reload the iframe — cleanest stop/reset across all player types */
  iframe.classList.remove('loaded');
  iframe.src = srcs[key];
}

function postMsg(iframe, msg){
  try{ iframe.contentWindow.postMessage(msg,'*'); }catch(e){}
}

/* ── Strip player chrome ─────────────────────────── */
function injectStrip(iframe){
  try{
    var doc = iframe.contentDocument;
    if(!doc || !doc.head) return;
    var s = doc.createElement('style');
    s.textContent = STRIP_CSS;
    doc.head.appendChild(s);
  }catch(e){}
}
</script>
</body>
</html>
