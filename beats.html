<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Beats — Federico Monroy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080b;
  --surface:#0f0f12;
  --surface2:#161619;
  --border:rgba(255,255,255,.07);
  --text:#f0eee9;
  --muted:#8a8580;
  --dim:#4a4845;
  --radius:10px;
  --fn:'DM Sans',system-ui,sans-serif;
  --fm:'Share Tech Mono',ui-monospace,monospace;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
  --spring:cubic-bezier(.34,1.32,.64,1);
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--fn);line-height:1.5}

/* skip */
.skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.skip-link:focus{left:8px;top:8px;width:auto;height:auto;padding:8px 12px;background:#000;color:#fff;z-index:999}

/* ── Minimal top bar ─────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:100;
  height:48px;display:flex;align-items:center;gap:16px;
  padding:0 28px;
  background:rgba(8,8,11,.9);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.topbar-logo{
  font-family:var(--fm);font-size:13px;color:var(--text);
  text-decoration:none;margin-right:auto;opacity:.7;
  transition:opacity .2s;
}
.topbar-logo:hover{opacity:1}
.topbar-back{
  font-family:var(--fm);font-size:11px;color:var(--muted);
  text-decoration:none;display:flex;align-items:center;gap:6px;
  transition:color .2s;letter-spacing:.04em;
}
.topbar-back:hover{color:var(--text)}
.topbar-back svg{flex-shrink:0}

/* ── Page header ─────────────────────────────────── */
.page-hd{
  padding:36px 28px 0;max-width:900px;margin:0 auto;
}
.page-hd h1{
  font-family:var(--fd);font-size:clamp(1.5rem,1rem + 2vw,2.4rem);
  font-weight:700;letter-spacing:-.03em;color:var(--text);line-height:1.1;
}
.page-hd p{
  margin-top:8px;font-size:.9375rem;color:var(--muted);max-width:50ch;line-height:1.65;
}

/* ── Project tabs ─────────────────────────────────── */
.proj-tabs{
  display:flex;gap:6px;padding:24px 28px 0;
  overflow-x:auto;scrollbar-width:none;
  max-width:900px;margin:0 auto;
}
.proj-tabs::-webkit-scrollbar{display:none}
.ptab{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px;border-radius:100px;
  border:1px solid var(--border);background:transparent;
  font-family:var(--fm);font-size:11px;color:var(--muted);
  cursor:pointer;white-space:nowrap;flex:0 0 auto;
  transition:border-color .18s,color .18s,background .18s;
}
.ptab .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--tab-accent,#666);opacity:.4;transition:opacity .18s;flex-shrink:0;
}
.ptab.on{
  color:var(--text);
  border-color:color-mix(in srgb,var(--tab-accent,#fff) 45%,transparent);
  background:color-mix(in srgb,var(--tab-accent,#fff) 7%,transparent);
}
.ptab.on .dot{opacity:1}
.ptab:hover:not(.on){color:var(--text);border-color:rgba(255,255,255,.15)}

/* ── Beat panels container ────────────────────────── */
#panels{max-width:900px;margin:0 auto}

/* ── Single project panel ─────────────────────────── */
.proj-panel{display:none;padding:28px 28px 64px}
.proj-panel.on{display:block}

/* Beat list */
.beat-list{display:flex;flex-direction:column;gap:48px}

/* ── Single beat row ──────────────────────────────── */
.beat{
  display:grid;
  grid-template-columns:minmax(0,260px) 1fr;
  gap:32px;align-items:start;
}
@media(max-width:760px){.beat{grid-template-columns:1fr;gap:20px}}

/* Info side */
.beat-info{position:sticky;top:64px}
@media(max-width:760px){.beat-info{position:static}}

.beat-n{
  font-family:var(--fm);font-size:10px;color:var(--accent,#888);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;opacity:.7;
}
.beat-title{
  font-family:var(--fd);font-size:1.35rem;font-weight:700;
  letter-spacing:-.025em;line-height:1.12;color:var(--text);margin-bottom:10px;
}
.beat-desc{
  font-size:.875rem;line-height:1.7;color:var(--muted);margin-bottom:16px;
}

/* Controls */
.beat-controls{display:flex;gap:8px;flex-wrap:wrap}
.ctrl{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface2);
  font-family:var(--fm);font-size:10.5px;color:var(--muted);
  cursor:pointer;transition:border-color .18s,color .18s,background .18s;
}
.ctrl:hover{color:var(--text);border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.ctrl.replay{
  border-color:color-mix(in srgb,var(--accent,#fff) 35%,transparent);
  color:var(--accent,#f0eee9);
}
.ctrl.replay:hover{
  background:color-mix(in srgb,var(--accent,#fff) 8%,transparent);
  border-color:color-mix(in srgb,var(--accent,#fff) 60%,transparent);
}
.ctrl svg{flex-shrink:0}

/* Animation frame */
.beat-frame{
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  aspect-ratio:16/10;
  position:relative;
  min-height:300px;
}
.beat-frame iframe{
  position:absolute;inset:0;width:100%;height:100%;border:none;
}
.beat-frame .floader{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--surface);z-index:4;transition:opacity .5s;
}
.beat-frame .floader.gone{opacity:0;pointer-events:none}
.floader-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent,#888);opacity:.35;
  animation:fldpulse 1.3s ease-in-out infinite;
}
@keyframes fldpulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.3)}}

/* Divider between beats */
.beat + .beat{border-top:1px solid var(--border);padding-top:48px}

/* Project accent override */
.proj-panel{--accent:var(--proj-accent,#888)}

/* prefers-reduced-motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="topbar">
  <a href="index.html" class="topbar-logo">FM.OS</a>
  <a href="index.html" class="topbar-back">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
</div>

<div class="page-hd">
  <h1>Beats</h1>
  <p>Each animation sequence from every project — loose, without the player. Replay or stop any beat individually.</p>
</div>

<div class="proj-tabs" role="tablist" aria-label="Projects" id="projTabs"></div>

<div id="panels" id="main"></div>

<script>
var PROJECTS = [
  {
    id:'ey', name:'EY Fabric', accent:'#c9a227',
    src:'projects/ey-pi-player.html',
    beats:[
      {n:'01',name:'Measure',   desc:'Analytics snapshot across EY Fabric catalog listings — traffic, engagement, conversion at a glance.'},
      {n:'02',name:'Analyze',   desc:'Funnel analysis revealing where users drop across search, detail, and apply flows.'},
      {n:'03',name:'Research',  desc:'User research synthesis mapped to catalog friction points and unmet needs.'},
      {n:'04',name:'Understand',desc:'Persona map — who uses the catalog, what they need, and what blocks them.'},
      {n:'05',name:'Design',    desc:'Redesigned catalog search and product detail flow — clarity-first information architecture.'},
      {n:'06',name:'Hub',       desc:'Central hub connecting all catalog interactions — a single control surface.'},
      {n:'07',name:'User flow', desc:'Guided onboarding: Pendo tooltip → pre-checklist gate → step-by-step form with live cost.'},
      {n:'08',name:'Publisher', desc:'Publisher dashboard — add onboarding guides, define checklists, review submissions.'},
      {n:'09',name:'Improved',  desc:'Before vs after — same form, guided entry, inline context, cost before commit.'},
    ]
  },
  {
    id:'skills', name:'Skills', accent:'#d97757',
    src:'projects/skills-player.html',
    beats:[
      {n:'01',name:'Mapping',   desc:'Skills taxonomy mapped across roles, seniority, and org units.'},
      {n:'02',name:'Usage',     desc:'Which skills are actually used — frequency and recency data surfaced.'},
      {n:'03',name:'Segment',   desc:'Cohort segmentation — clusters of skill patterns by team and level.'},
      {n:'04',name:'Research',  desc:'Research synthesis: where skills gap is felt most acutely by managers and ICs.'},
      {n:'05',name:'Understand',desc:'Mental models — how people think about skill growth and gap identification.'},
      {n:'06',name:'Design',    desc:'Redesigned skill profile and endorsement flow — mutual recognition built in.'},
      {n:'07',name:'Hub',       desc:'Skill hub: personal profile, team view, and org-wide leaderboard in one surface.'},
      {n:'08',name:'Systems',   desc:'Systems view — skill health across the whole org, filterable by domain.'},
    ]
  },
  {
    id:'dc', name:'DollarCity', accent:'#00a650',
    src:'projects/dollarcity-player.html',
    beats:[
      {n:'01',name:'Why',      desc:'Reviewers juggling tabs to watch footage and search products — everything moves to one screen.'},
      {n:'02',name:'Search',   desc:'Flagged transactions surface first — score, exceptions, and a one-click path to footage.'},
      {n:'03',name:'States',   desc:'Every request shows its state up front — queued, downloading, ready — no more wondering.'},
      {n:'04',name:'Review',   desc:'Footage and receipt line up frame-by-frame — classify without leaving the video.'},
      {n:'05',name:'Expand',   desc:'One click expands footage full-frame — the receipt stays one tab away.'},
      {n:'06',name:'Requests', desc:'Every clip a reviewer pulled lives in one place — searchable, filterable, deletable in bulk.'},
      {n:'07',name:'New',      desc:'Requesting footage is one modal — camera, time range, and quality, nothing hidden.'},
      {n:'08',name:'Queue',    desc:'Downloads process in the background — reviewers keep working instead of watching a spinner.'},
      {n:'09',name:'Filters',  desc:'Filters and image-first product search replace memorized SKU lookups.'},
    ]
  },
  {
    id:'bc', name:'Blockchain 3D', accent:'#22d4c8',
    src:'projects/blockchain-player.html',
    beats:[
      {n:'01',name:'Onboard',desc:'Welcome to your 3D map — content lives on places you own in space.'},
      {n:'02',name:'Place',  desc:'Enter the map, long-press the street, confirm the address, style your pin.'},
      {n:'03',name:'Media',  desc:'Empty feed → choose source → device gallery → upload and publish.'},
      {n:'04',name:'Visitor',desc:'Find MY POI on the map — tap the pin, scroll reels, play full-screen.'},
    ]
  },
  {
    id:'chek', name:'Chek', accent:'#7a3be0',
    src:'projects/chek-player.html',
    beats:[
      {n:'01',name:'Hub',     desc:'Credit card hub — balance, limit, quick actions, and recent moves at a glance.'},
      {n:'02',name:'Pay',     desc:'Pay card flow — amount input, date picker, confirmation, all in one modal.'},
      {n:'03',name:'Limit',   desc:'Credit limit and balance breakdown — available, used, cash advance in one view.'},
      {n:'04',name:'Moves',   desc:'Movements and statements — filterable transaction history with statement export.'},
      {n:'05',name:'Security',desc:'Security help — card block and unblock, PIN change, fraud report flow.'},
      {n:'06',name:'Onboard', desc:'Onboarding — step-by-step first-time setup for a new credit card activation.'},
    ]
  }
];

/* ─── Icons ─────────────────────────────────────── */
var IC = {
  replay:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>',
  stop:  '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>'
};

/* ─── Build ─────────────────────────────────────── */
var tabsEl   = document.getElementById('projTabs');
var panelsEl = document.getElementById('panels');

/* Maps for per-beat iframes */
var iframeReg = {}; // key: projId+'_'+beatIndex → iframe el
var loaderReg = {}; // key: projId+'_'+beatIndex → loader el

PROJECTS.forEach(function(proj, pi){
  /* Tab */
  var tab = document.createElement('button');
  tab.className = 'ptab' + (pi===0?' on':'');
  tab.setAttribute('role','tab');
  tab.setAttribute('aria-selected', pi===0?'true':'false');
  tab.setAttribute('aria-controls','panel-'+proj.id);
  tab.style.setProperty('--tab-accent', proj.accent);
  tab.innerHTML = '<span class="dot"></span>' + proj.name;
  tab.addEventListener('click', function(){ switchProj(pi); });
  tabsEl.appendChild(tab);

  /* Panel */
  var panel = document.createElement('div');
  panel.className = 'proj-panel' + (pi===0?' on':'');
  panel.id = 'panel-'+proj.id;
  panel.setAttribute('role','tabpanel');
  panel.style.setProperty('--proj-accent', proj.accent);

  var list = document.createElement('div');
  list.className = 'beat-list';

  proj.beats.forEach(function(beat, bi){
    var key = proj.id + '_' + bi;

    /* Beat row */
    var row = document.createElement('div');
    row.className = 'beat';

    /* — Info side — */
    var info = document.createElement('div');
    info.className = 'beat-info';

    var bnum = document.createElement('div');
    bnum.className = 'beat-n';
    bnum.textContent = 'Beat ' + beat.n;

    var btitle = document.createElement('h2');
    btitle.className = 'beat-title';
    btitle.textContent = beat.name;

    var bdesc = document.createElement('p');
    bdesc.className = 'beat-desc';
    bdesc.textContent = beat.desc;

    var ctrls = document.createElement('div');
    ctrls.className = 'beat-controls';

    var btnReplay = document.createElement('button');
    btnReplay.className = 'ctrl replay';
    btnReplay.innerHTML = IC.replay + ' Replay';
    btnReplay.setAttribute('aria-label', 'Replay beat ' + beat.name);
    btnReplay.addEventListener('click', function(){ sendMsg(proj.id, bi, 'playBeat'); });

    var btnStop = document.createElement('button');
    btnStop.className = 'ctrl';
    btnStop.innerHTML = IC.stop + ' Stop';
    btnStop.setAttribute('aria-label', 'Stop beat ' + beat.name);
    btnStop.addEventListener('click', function(){ sendMsg(proj.id, bi, 'stopBeat'); });

    ctrls.appendChild(btnReplay);
    ctrls.appendChild(btnStop);
    info.appendChild(bnum);
    info.appendChild(btitle);
    info.appendChild(bdesc);
    info.appendChild(ctrls);

    /* — Frame side — */
    var frame = document.createElement('div');
    frame.className = 'beat-frame';

    var loader = document.createElement('div');
    loader.className = 'floader';
    loader.innerHTML = '<div class="floader-dot"></div>';
    loaderReg[key] = loader;

    var iframe = document.createElement('iframe');
    /* Each beat gets its own iframe with the beat index pre-selected via hash */
    iframe.src = proj.src + '?embed=1#beat=' + bi;
    iframe.title = proj.name + ' — ' + beat.name;
    iframe.setAttribute('loading', 'lazy');
    iframeReg[key] = iframe;

    iframe.addEventListener('load', function(){
      loader.classList.add('gone');
      injectStyle(iframe);
      /* Auto-play the beat once loaded */
      setTimeout(function(){
        sendToFrame(iframe, {type:'playBeat', index:bi});
      }, 300);
    });

    frame.appendChild(loader);
    frame.appendChild(iframe);

    row.appendChild(info);
    row.appendChild(frame);
    list.appendChild(row);
  });

  panel.appendChild(list);
  panelsEl.appendChild(panel);
});

/* ─── Active project ─────────────────────────────── */
var currentProj = 0;

function switchProj(pi){
  if(pi === currentProj) return;
  PROJECTS[currentProj] && document.getElementById('panel-'+PROJECTS[currentProj].id).classList.remove('on');
  currentProj = pi;
  document.getElementById('panel-'+PROJECTS[pi].id).classList.add('on');
  tabsEl.querySelectorAll('.ptab').forEach(function(t,i){
    t.classList.toggle('on', i===pi);
    t.setAttribute('aria-selected', i===pi?'true':'false');
  });
  /* Scroll to top of page on project switch */
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ─── Messaging ──────────────────────────────────── */
function sendToFrame(iframe, msg){
  try{ iframe.contentWindow.postMessage(msg, '*'); }catch(e){}
}

function sendMsg(projId, bi, type){
  var key = projId + '_' + bi;
  var iframe = iframeReg[key];
  if(!iframe) return;
  if(type === 'playBeat'){
    sendToFrame(iframe, {type:'playBeat', index:bi});
  } else if(type === 'stopBeat'){
    /* Stop = reload the iframe src (cleanest reset across all players) */
    var proj = PROJECTS.find(function(p){ return p.id===projId; });
    if(proj) iframe.src = proj.src + '?embed=1#beat=' + bi;
  }
}

/* ─── Inject style into iframe to strip player chrome ── */
function injectStyle(iframe){
  try{
    var doc = iframe.contentDocument;
    if(!doc) return;
    var s = doc.createElement('style');
    /* Hide player title bar, controls, pills — keep only the animation stage */
    s.textContent = [
      /* EY-PI / Skills player chrome */
      '.shell > .tl-col',
      '.shell > .controls-col',
      '.page > .kicker',
      '.page > h1',
      '.page > .lead',
      /* Blockchain / Chek player chrome */
      '.eyebrow','body > .wrap > h1','.lede',
      '.timeline',
      '.stage-top',
      '.stage-arrows',
      '.capbar',
      /* DollarCity */
      '.chrome-bar','.chrome-top',
      /* generic */
      '.note','.topbar'
    ].join(',') + '{display:none!important}';
    /* Make background transparent so the iframe blends with the frame */
    var s2 = doc.createElement('style');
    s2.textContent = 'html,body{background:transparent!important}';
    doc.head.appendChild(s);
    doc.head.appendChild(s2);
  }catch(e){}
}
</script>
</body>
</html>
