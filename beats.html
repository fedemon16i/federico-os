<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Beats — Federico Monroy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="beats-stage.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080b;--border:rgba(255,255,255,.06);--text:#f0eee9;--muted:#8a8580;--bar:rgba(8,8,11,.88);
--fn:'DM Sans',system-ui,sans-serif;--fm:'Share Tech Mono',ui-monospace,monospace;--fd:'Space Grotesk',system-ui,sans-serif}
html[data-theme="light"]{--bg:#f5f5f0;--border:rgba(20,18,14,.1);--text:#1c1b18;--muted:#6a6660;--bar:rgba(245,245,240,.92)}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--fn)}
.topbar{position:sticky;top:0;z-index:20;height:48px;display:flex;align-items:center;gap:16px;padding:0 32px;background:var(--bar);border-bottom:1px solid var(--border)}
.topbar a{font-family:var(--fm);font-size:11px;color:var(--muted);text-decoration:none}
.topbar a.logo{margin-right:auto;color:var(--text);opacity:.6;font-size:13px}
.pg-hd{padding:36px 32px 0;max-width:1000px;margin:0 auto}
.pg-hd h1{font-family:var(--fd);font-size:clamp(1.6rem,1rem+2.5vw,2.4rem);letter-spacing:-.035em}
.pg-hd p{margin-top:10px;color:var(--muted);max-width:48ch;line-height:1.65;font-size:.9375rem}
.proj-tabs{display:flex;gap:6px;padding:24px 32px 0;max-width:1000px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.ptab{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:100px;border:1px solid var(--border);background:transparent;font-family:var(--fm);font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.ptab .dot{width:6px;height:6px;border-radius:50%;background:var(--ta,#666);opacity:.38}
.ptab.on{color:var(--text);border-color:color-mix(in srgb,var(--ta,#fff) 45%,transparent);background:color-mix(in srgb,var(--ta,#fff) 7%,transparent)}
.ptab.on .dot{opacity:1}
#panels{max-width:1000px;margin:0 auto}
.proj-panel{display:none;padding:28px 32px 80px;--accent:var(--pa,#888)}
.proj-panel.on{display:block}
.case-hd{margin:0 0 18px;max-width:54ch}
.case-hd h2{font-family:var(--fd);font-size:1.35rem}
.case-hd p{margin-top:8px;color:var(--muted);font-size:.9rem;line-height:1.65}
.beat{display:flex;flex-direction:column;gap:12px;padding:36px 0;border-top:1px solid var(--border)}
.beat:first-child{border-top:none;padding-top:0}
.beat[data-kind="diagram"]{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.bi{display:flex;flex-direction:column;gap:8px}
.bi-n{font-family:var(--fm);font-size:11px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase}
.bi-line{font-family:var(--fd);font-size:1.1rem;line-height:1.35}
.bi-line em{color:var(--accent);font-style:normal}
.bi-cap{font-size:.9rem;line-height:1.5;color:var(--muted)}
.bi-has-lab{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.bi-has{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px 14px}
.bi-has li{font-size:.86rem;padding-left:10px;border-left:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.bi-chips{display:flex;flex-wrap:wrap;gap:6px}
.bi-chip{font-family:var(--fm);font-size:11px;padding:5px 10px;border-radius:100px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.stage-col{display:flex;flex-direction:column;gap:8px;min-width:0;width:100%}
.stage-ctrl{display:flex;gap:8px}
.sc-btn{font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:7px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--text);cursor:pointer}
.beat-stage{position:relative;width:100%;max-width:840px;aspect-ratio:16/10;overflow:hidden}
.beat[data-kind="diagram"] .beat-stage{max-width:none}
.beat-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:transparent;pointer-events:none;opacity:0}
.beat-stage iframe.loaded{opacity:1;transition:opacity .35s}
.fld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.fld.gone{opacity:0}
.fld-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35}
@media(max-width:720px){
.topbar,.pg-hd,.proj-tabs,.proj-panel{padding-left:16px;padding-right:16px}
.beat[data-kind="diagram"]{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="index.html">FM.OS</a>
  <a href="gallery.html">Gallery</a>
  <a href="#" id="themeBtn">Light</a>
  <a href="index.html">Back</a>
</div>
<div class="pg-hd">
  <h1>Beats</h1>
  <p>Ventana tipo notebook 16/10. Diagramas con texto a la izquierda.</p>
</div>
<div class="proj-tabs" id="projTabs" role="tablist"></div>
<div id="panels"></div>
<script src="beats-data.js"></script>
<script src="ey-meta.js"></script>
<script>
var iframes={}, srcs={}, curProj=0;
function currentTheme(){ return document.documentElement.getAttribute('data-theme')||'dark'; }
function applyTheme(th){
  document.documentElement.setAttribute('data-theme', th);
  try{ localStorage.setItem('fm-theme', th); }catch(e){}
  var btn=document.getElementById('themeBtn');
  if(btn) btn.textContent = th==='light' ? 'Dark' : 'Light';
}
(function initTheme(){
  var saved=null; try{ saved=localStorage.getItem('fm-theme'); }catch(e){}
  applyTheme(saved==='light' ? 'light' : 'dark');
  var btn=document.getElementById('themeBtn');
  if(btn) btn.onclick=function(e){ e.preventDefault(); applyTheme(currentTheme()==='light'?'dark':'light'); };
})();
var tabsEl=document.getElementById('projTabs');
var panelsEl=document.getElementById('panels');
PROJECTS.forEach(function(proj,pi){
  var tab=document.createElement('button');
  tab.className='ptab'+(pi===0?' on':'');
  tab.style.setProperty('--ta',proj.accent);
  tab.innerHTML='<span class="dot"></span>'+proj.name;
  tab.onclick=function(){switchProj(pi)};
  tabsEl.appendChild(tab);
  var panel=document.createElement('div');
  panel.className='proj-panel'+(pi===0?' on':'');
  panel.id='panel-'+proj.id;
  panel.style.setProperty('--pa',proj.accent);
  panel.innerHTML='<div class="case-hd"><h2>'+proj.name+'</h2><p>'+(proj.lede||'')+'</p></div>';
  var list=document.createElement('div');
  proj.beats.forEach(function(beat,bi){
    var units=[beat];
    if(proj.id==='ey' && EY_META[bi]){
      var m=EY_META[bi];
      if(m.scenes){
        units=m.scenes.map(function(sc){
          return {n:beat.n,name:beat.name+' · '+sc.name,kind:sc.kind,src:sc.src,line:sc.line,cap:sc.cap,chips:sc.chips,contains:sc.contains};
        });
      } else {
        beat.kind=m.kind; beat.src=m.src; beat.line=m.line; beat.cap=m.cap;
        beat.chips=m.chips; beat.contains=m.contains;
        units=[beat];
      }
    }
    units.forEach(function(beat,ui){
    var key=proj.id+'_'+bi+'_'+ui;
    var row=document.createElement('div');
    row.className='beat';
    if(beat.kind) row.dataset.kind=beat.kind;
    var info=document.createElement('div');
    info.className='bi';
    var chips=beat.chips?'<div class="bi-chips">'+beat.chips.map(function(c){return '<span class="bi-chip">'+c+'</span>'}).join('')+'</div>':'';
    var has=beat.contains?'<div class="bi-has-lab">En este cuadro</div><ul class="bi-has">'+beat.contains.map(function(c){return '<li>'+c+'</li>'}).join('')+'</ul>':'';
    var line=beat.line ? '<p class="bi-line">'+beat.line+'</p>' : '';
    var cap=beat.cap ? '<p class="bi-cap">'+beat.cap+'</p>' : '';
    info.innerHTML='<div class="bi-n">Beat '+beat.n+' · '+beat.name+'</div>'+(line||'')+cap+chips+has;
    var stageWrap=document.createElement('div');
    stageWrap.className='stage-col';
    var stage=document.createElement('div');
    stage.className='beat-stage';
    if(beat.kind==='diagram') stage.dataset.kind='diagram';
    else if(beat.kind==='window') stage.dataset.kind='window';
    var src=beat.src || (proj.src+'?embed=1&beat='+bi+'&once=1');
    srcs[key]=src;
    var iframe=document.createElement('iframe');
    iframe.title=proj.name+' — '+beat.name;
    iframe.dataset.src=src;
    iframe.setAttribute('loading','lazy');
    iframes[key]=iframe;
    iframe.addEventListener('load',function(){
      if(!iframe.getAttribute('src')) return;
      iframe.classList.add('loaded');
      var fld=stage.querySelector('.fld');
      if(fld) fld.classList.add('gone');
      if(proj.id!=='ey' && beat.kind!=='diagram'){
        try{
          var doc=iframe.contentDocument;
          if(doc&&doc.documentElement){
            doc.documentElement.classList.add('embed','window');
            var s=doc.createElement('script'); s.src='../fm-once.js'; doc.head.appendChild(s);
          }
        }catch(e){}
        setTimeout(function(){
          try{iframe.contentWindow.postMessage({type:'playBeat',index:bi,once:true},'*')}catch(err){}
        },280);
      }
    });
    var fld=document.createElement('div');
    fld.className='fld';
    fld.innerHTML='<div class="fld-dot"></div>';
    stage.appendChild(fld);
    stage.appendChild(iframe);
    var ctrl=document.createElement('div');
    ctrl.className='stage-ctrl';
    ctrl.innerHTML='<button type="button" class="sc-btn" data-act="replay">Replay</button><button type="button" class="sc-btn" data-act="stop">Stop</button>';
    ctrl.addEventListener('click', function(ev){
      var act=ev.target && ev.target.getAttribute('data-act');
      if(act==='replay'){ iframe.classList.remove('loaded'); iframe.src=src+(src.indexOf('?')>=0?'&':'?')+'r='+Date.now(); }
      if(act==='stop'){ try{iframe.contentWindow.postMessage({type:'fm-stop'},'*')}catch(err){} }
    });
    stageWrap.appendChild(ctrl);
    stageWrap.appendChild(stage);
    row.appendChild(info);
    row.appendChild(stageWrap);
    list.appendChild(row);
    });
  });
  panel.appendChild(list);
  panelsEl.appendChild(panel);
});
function unloadProj(id){
  var panel=document.getElementById('panel-'+id);
  if(!panel) return;
  panel.querySelectorAll('iframe').forEach(function(iframe){ iframe.classList.remove('loaded'); iframe.removeAttribute('src'); });
}
function mountVisible(){
  var panel=document.getElementById('panel-'+PROJECTS[curProj].id);
  if(!panel) return;
  panel.querySelectorAll('iframe[data-src]').forEach(function(iframe){
    if(iframe.getAttribute('src')) return;
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        iframe.src=iframe.dataset.src; io.disconnect();
      });
    },{rootMargin:'200px'});
    io.observe(iframe);
  });
}
function switchProj(pi){
  if(pi===curProj) return;
  unloadProj(PROJECTS[curProj].id);
  document.getElementById('panel-'+PROJECTS[curProj].id).classList.remove('on');
  curProj=pi;
  document.getElementById('panel-'+PROJECTS[pi].id).classList.add('on');
  tabsEl.querySelectorAll('.ptab').forEach(function(t,i){t.classList.toggle('on',i===pi)});
  mountVisible(); window.scrollTo({top:0,behavior:'smooth'});
}
mountVisible();
</script>
</body>
</html>
