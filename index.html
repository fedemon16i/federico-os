<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>FM.OS · Federico Monroy</title>
<meta name="description" content="Sr. UX / Product Strategist — behavioral analytics. Córdoba, AR. FM.OS portfolio shell."/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="os-home.css"/>
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>
<div class="desktop-bg" aria-hidden="true"></div>

<div id="boot">
  <div class="boot-mark">FM.OS</div>
  <div class="boot-sub">operator shell</div>
</div>

<div id="shell">
  <header class="topbar">
    <button type="button" class="brand" data-route="home" aria-label="Home">
      <span class="dot"></span> FM.OS
    </button>
    <nav class="top-nav" aria-label="Primary">
      <button type="button" class="on" data-route="home">About</button>
      <button type="button" data-route="projects">Projects</button>
      <button type="button" data-route="skills">Skills</button>
      <button type="button" data-route="resume">Resume</button>
      <button type="button" data-route="contact">Contact</button>
      <button type="button" data-route="system">System</button>
    </nav>
    <div class="acts">
      <span class="url-chip" id="urlChip" title="Active path">#/home</span>
      <span class="mid" id="clock">--:--</span>
      <button type="button" class="theme-btn" id="themeBtn" title="Theme" aria-label="Toggle theme">TH</button>
      <button type="button" class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">≡</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="codec-col" aria-label="Codec">
      <div class="codec-head"><span>CODEC</span><span class="ptt">PTT</span></div>
      <div class="codec-frame">
        <div class="codec-media" id="codecMedia">
          <div class="codec-placeholder"><b>FM</b>HOLO · FEED<br/>drop video / gif</div>
        </div>
        <div class="codec-cross" aria-hidden="true"></div>
      </div>
      <div class="codec-status">
        <div class="freq-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="freq-readout"><span class="freq-num" id="freqNum">140.85</span><span class="freq-label">MEMORY</span></div>
      </div>
      <div class="codec-dialogue">
        <div class="who">// FEDERICO</div>
        <div class="line" id="codecLine" aria-live="polite">Linking what people <em>think and do</em> to design that ships.</div>
      </div>
    </aside>

    <div class="stage">
      <div class="desk" id="desk" hidden>
        <p class="desk-hint">Open a folder</p>
        <div class="desk-grid">
          <button type="button" class="desk-icon" data-route="home"><span class="di-ico" style="--pc:#e8c547">A</span><span class="di-label">About me</span></button>
          <button type="button" class="desk-icon" data-route="projects"><span class="di-ico" style="--pc:#22d4c8">P</span><span class="di-label">Projects</span></button>
          <button type="button" class="desk-icon" data-route="skills"><span class="di-ico" style="--pc:#d97757">S</span><span class="di-label">Skills</span></button>
          <button type="button" class="desk-icon" data-route="resume"><span class="di-ico" style="--pc:#a8a090">R</span><span class="di-label">Resume</span></button>
          <button type="button" class="desk-icon" data-route="contact"><span class="di-ico" style="--pc:#4a9eff">C</span><span class="di-label">Contact</span></button>
          <button type="button" class="desk-icon" data-route="system"><span class="di-ico" style="--pc:#7dffb3">Sys</span><span class="di-label">Design system</span></button>
        </div>
      </div>

      <section class="win-main" id="winMain">
        <div class="win-chrome">
          <div class="win-dots">
            <button type="button" class="wd close" id="winClose" title="Close window" aria-label="Close">×</button>
          </div>
          <div class="win-title" id="winTitle">About</div>
          <div class="win-path" id="winPath">#/home</div>
        </div>
        <div class="win-scroll" id="centerBody"></div>
      </section>
    </div>
  </div>
</div>

<div class="m-drawer" id="mDrawer" hidden>
  <button type="button" data-route="home">About me</button>
  <button type="button" data-route="projects">Projects</button>
  <button type="button" data-route="skills">Skills</button>
  <button type="button" data-route="resume">Resume</button>
  <button type="button" data-route="contact">Contact</button>
  <button type="button" data-route="system">Design system</button>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lb-close" id="lbClose" aria-label="Close">×</button>
  <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">←</button>
  <img id="lbImg" alt=""/>
  <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="Next">→</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script src="os-home.js"></script>
</body>
</html>
