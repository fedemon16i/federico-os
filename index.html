<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FM.OS · Federico Monroy</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Share+Tech+Mono&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="os-home.css"/>
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>
<div class="desktop-bg" aria-hidden="true"></div>

<div id="boot">
  <div class="boot-mark">FM.OS</div>
  <div class="boot-sub">codec link · operator shell</div>
</div>

<div id="shell">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> FM.OS</div>
    <div class="mid" id="clock">--:--</div>
    <div class="acts">
      <button type="button" data-open="resume">Resume</button>
      <button type="button" data-open="contact">Contact</button>
      <button type="button" class="theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle light and dark theme">TH</button>
    </div>
  </header>

  <div class="main">
    <aside class="codec-col">
      <div class="codec-head">
        <span>CODEC</span>
        <span class="ptt">PTT</span>
      </div>
      <div class="codec-frame">
        <div class="codec-media" id="codecMedia">
          <div class="codec-placeholder">
            <b>FM</b>
            HOLO · FEED<br/>
            drop video / gif
          </div>
        </div>
        <div class="codec-cross" aria-hidden="true"></div>
      </div>
      <div class="codec-status">
        <div class="freq-bars" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="freq-readout">
          <span class="freq-num" id="freqNum">140.85</span>
          <span class="freq-label">MEMORY</span>
        </div>
      </div>
      <div class="codec-dialogue">
        <div class="who">// FEDERICO</div>
        <div class="line" id="codecLine" aria-live="polite">Linking what people <em>think and do</em> to design that ships.</div>
      </div>
    </aside>

    <section class="desktop" id="desktop">
      <div class="home-panel" id="homePanel">
        <div class="hp-head">
          <h1>HOME</h1>
          <span class="hp-tag">OPERATOR BRIEF</span>
        </div>

        <div class="photo-grid" id="photoGrid" aria-label="About photos"></div>

        <div class="hp-meta">
          <div class="hp-name">Federico Monroy</div>
          <div class="hp-line">Sr. UX · Product · Behavioral analytics · Córdoba, AR</div>
          <div class="hp-bio" id="bioType"></div>
          <div class="hp-dots" id="bioDots"></div>
        </div>

        <div class="hp-actions">
          <button type="button" data-open="projects">Projects</button>
          <button type="button" data-open="abilities">Abilities</button>
          <button type="button" data-open="resume">Resume</button>
          <button type="button" data-open="contact">Contact</button>
        </div>
      </div>
    </section>
  </div>

  <nav class="dock" aria-label="Primary">
    <button type="button" class="on" data-open="home">H<span>Home</span></button>
    <span class="sep"></span>
    <button type="button" data-open="projects">DIR<span>Projects</span></button>
    <button type="button" data-open="abilities">MTX<span>Abilities</span></button>
    <button type="button" data-open="resume">CV<span>Resume</span></button>
    <button type="button" data-open="contact">COM<span>Contact</span></button>
  </nav>
</div>
<script src="os-home.js"></script>
</body>
</html>
