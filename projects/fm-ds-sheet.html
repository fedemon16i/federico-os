<!DOCTYPE html>
<html lang="es" data-skin="ey" data-mode="light" data-sheet="1"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DS sheet</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="fm-ds.css"/>
<style>
html,body{overflow:auto!important;height:auto!important;background:var(--fm-bg)!important;color:var(--fm-text)}
.sheet{padding:28px 24px 80px;max-width:760px}
.sec{margin:0 0 36px}
.sec h2{margin:0 0 6px;font-size:15px}
.sec p{margin:0 0 12px;color:var(--fm-muted);font-size:12px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.svc,.rail,.ov{border:1px solid var(--fm-line);border-radius:var(--fm-r);padding:12px;background:var(--fm-card)}
.meta{font-size:11px;color:var(--fm-muted)}
</style></head>
<body>
<div class="sheet" id="root"></div>
<script src="fm-engine.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var skin=q.get('skin')||'ey';
  var mode=q.get('mode')||'light';
  FM.skin(skin); FM.mode(mode);

  var EY = [
    ['type','Tipografía EY','Interstate Regular/Bold. Amarillo #FFE600. Ink #2E2E38. Nunca blanco sobre amarillo.'],
    ['home','Home · nav','<div class="row"><span style="font-weight:800">EY</span><span class="fm-chip">Catalog</span><span class="fm-chip">Workbench</span><span class="fm-chip">Hub</span><div class="fm-field" style="width:200px">Search products</div><span class="fm-chip on">Search products AI</span></div>'],
    ['marketplace','Marketplace · hero + tiles','<div class="fm-banner" style="margin-bottom:10px"><b>Shared delivery</b><span>Services, licenses and kits on one catalog.</span></div><div class="fm-tiles"><div class="fm-tile"><b>Services</b><span>Compute</span></div><div class="fm-tile"><b>Licenses</b><span>Seats</span></div><div class="fm-tile"><b>Kits</b><span>Start</span></div></div>'],
    ['card','Service card','<div class="svc"><div class="meta">SERVICE</div><b>Platform / Workbench</b><p class="meta">Requirements before launch.</p><div class="row" style="margin-top:10px"><button class="fm-btn" type="button">Get started</button><button class="fm-btn secondary" type="button">See details and requirements</button></div></div>'],
    ['overlay','Requirements overlay','<div class="ov"><div class="row"><span class="fm-chip on">Description</span><span class="fm-chip">Resources</span><span class="fm-chip">Requirements</span></div><p class="meta">Workspace, team and billing account before launch.</p><button class="fm-btn" type="button">Get started</button></div>'],
    ['forms','Forms · 3 steps','<div class="fm-stepper" style="margin-bottom:10px"><b>1</b> Customize &nbsp;<b>2</b> Configure &nbsp;<b>3</b> Workspace</div><div class="fm-field" style="margin-bottom:8px">Instance name</div><div class="fm-field" style="margin-bottom:8px">Repo / license key</div><div class="rail"><b>Your order</b><p class="meta">Workbench · 1 instance</p><p class="meta" style="margin-top:8px">HELP / REQUIREMENTS</p></div>'],
    ['hub','Hub · alarms','<div class="fm-kpis" style="margin-bottom:10px"><div class="fm-kpi"><i>Drop-off</i><b>22</b></div><div class="fm-kpi"><i>Pending</i><b>3</b></div><div class="fm-kpi"><i>Live</i><b>11</b></div></div><div class="row"><span class="fm-chip on">Alarms</span><span class="fm-chip">Catalog</span><span class="fm-chip">Workbench</span></div><table class="fm-table"><thead><tr><th>Area</th><th>Signal</th></tr></thead><tbody><tr><td>Checkout step 2</td><td><span class="fm-tag bad">Drop-off</span></td></tr></tbody></table>'],
    ['publisher','Publisher · workspace','<div class="row"><button class="fm-btn" type="button">Publish new item</button><span class="fm-tag warn">Corrections</span><span class="fm-tag ok">AI approved</span></div><div class="fm-tiles" style="margin-top:10px"><div class="fm-tile"><b>Service</b><span>Offering</span></div><div class="fm-tile"><b>License</b><span>Keys</span></div><div class="fm-tile"><b>Artifact</b><span>File</span></div></div>'],
    ['guidance','Guidance + onboarding','<div class="fm-notice">Tooltip on long fields. Onboarding builder optional.</div>']
  ];

  var DC = [
    ['type','Tipografía DollarCity','Ant stack. Primary #0B7A3C + blanco.'],
    ['buttons','Buttons','<div class="row"><button class="fm-btn" type="button">Comprar</button><button class="fm-btn secondary" type="button">Ver más</button></div>'],
    ['fields','Search','<div class="fm-field">Buscar productos</div>'],
    ['tags','Estados','<div class="row"><span class="fm-chip on">Ofertas</span><span class="fm-chip">Hogar</span></div>']
  ];

  var CHEK = [
    ['type','Tipografía Chek / Ripley','Inter proxy. Primary #543379. Oro #FFB81C + ink #202124.'],
    ['buttons','Buttons','<div class="row"><button class="fm-btn" type="button">Pagar</button><button class="fm-btn secondary" type="button">Límite</button></div>'],
    ['kpis','Hub móvil','<div class="fm-kpis"><div class="fm-kpi"><i>Saldo</i><b>$ 2.840</b></div><div class="fm-kpi"><i>Cupo</i><b>Ok</b></div></div>']
  ];

  var CUS = [
    ['type','Tipografía Aduanas','Inter. Primary #1071E5. PrimeNG.'],
    ['buttons','Button','<div class="row"><button class="fm-btn" type="button">Continuar</button><button class="fm-btn secondary" type="button">Volver</button></div>'],
    ['fields','InputText','<div class="fm-field">ARIVU-715912</div>'],
    ['stepper','Stepper','<div class="fm-stepper"><b>1</b> Selección &nbsp;<b>2</b> Info &nbsp;<b>3</b> Revisión &nbsp;<b>4</b> Listo</div>'],
    ['tags','Tag','<div class="row"><span class="fm-tag ok">Aprobado</span><span class="fm-tag warn">Revisión</span><span class="fm-tag bad">Rechazado</span></div>'],
    ['pass','Boarding pass','<div class="fm-banner"><b>Mazda CX-5</b><span>BP · SV-240821-0068</span></div>']
  ];

  var BC = [
    ['type','Tipografía Blockchain','IBM Plex. Teal #22D4C8 + ink #04221F.'],
    ['buttons','Buttons','<div class="row"><button class="fm-btn" type="button">Open map</button><button class="fm-btn ghost" type="button">Layers</button></div>']
  ];

  var MAP={ey:EY,dc:DC,chek:CHEK,cus:CUS,bc:BC};
  var list=MAP[skin]||EY;
  var root=document.getElementById('root');
  list.forEach(function(item){
    var s=document.createElement('section');
    s.className='sec'; s.id=item[0];
    s.innerHTML='<h2>'+item[1]+'</h2>'+(item[2].charAt(0)==='<'?item[2]:'<p>'+item[2]+'</p>');
    root.appendChild(s);
  });
})();
</script>
</body></html>
