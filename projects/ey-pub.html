<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Publisher</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f3f4f8;font-family:'IBM Plex Sans',system-ui,sans-serif}
:root{--bg:#12141c;--card:#1c1e28;--line:rgba(255,255,255,.08);--or:#e8943a;--ok:#7dcea0;--muted:#9aa0b0;--faint:#6d7384;--spring:cubic-bezier(.34,1.32,.64,1)}
.stage{position:relative;min-height:360px}
.br{height:360px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0b0c10}
.bb{height:20px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#14151c;border-bottom:1px solid var(--line);font-size:8px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.d{display:flex;gap:4px}.d i{width:6px;height:6px;border-radius:50%;display:block}
.d .r{background:#ff5f57}.d .y{background:#febc2e}.d .g{background:#28c840}
.app{flex:1;display:grid;grid-template-columns:96px 1fr;min-height:0;background:var(--bg)}
.side{padding:8px 6px;border-right:1px solid var(--line);font-size:8px;color:var(--muted);background:#101218}
.side .sh{color:#fff;font-weight:700;margin-bottom:6px;font-size:10px}
.side a{display:block;padding:4px 6px;border-radius:5px;margin-bottom:2px}
.side a.on{background:rgba(255,255,255,.07);color:#fff}
.main{padding:8px 10px;min-width:0;overflow:hidden}
.prog{font-family:'IBM Plex Mono',monospace;font-size:7px;color:var(--faint);margin-bottom:5px}.prog b{color:#fff}
h3{margin:0 0 6px;font-size:13px}
.btn{display:inline-block;background:#fff;color:#111;font-size:8px;font-weight:650;padding:4px 8px;border-radius:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:7px}
.kpi{border:1px solid var(--line);padding:6px;font-size:7px;color:var(--faint)}
.kpi b{display:block;color:#fff;font-size:12px;margin-top:1px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 7px;margin-bottom:4px;font-size:9px}
.row .m{font-size:7px;color:var(--faint)}
.pill{font-size:7px;padding:1px 5px;border:1px solid var(--line);border-radius:100px;color:var(--muted)}
.pill.warn{color:#f0de5a}.pill.ok{color:var(--ok)}.pill.bad{color:#e0857f}
.types{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.type{border:1px solid var(--line);background:var(--card);padding:7px;border-radius:6px;font-size:9px}
.type.sel{border-color:rgba(232,148,58,.55);background:#241c14}
.type .s{font-size:7px;color:var(--faint);margin-top:2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.box{border:1px solid var(--line);background:var(--card);padding:7px;border-radius:6px;font-size:8px;color:var(--muted)}
.box b{color:#fff;display:block;margin-bottom:4px}
.item{font-size:9px;color:var(--muted);padding:3px 0;border-bottom:1px solid var(--line)}
.item.on{color:#f0de5a}
.tip{font-size:7px;padding:1px 5px;border:1px solid rgba(232,148,58,.4);color:var(--or);border-radius:100px;margin-left:4px}
.guide{border:1px dashed rgba(232,148,58,.35);padding:7px;font-size:8px;color:var(--muted);margin-top:5px}
.ai{border:1px solid rgba(125,206,160,.35);padding:7px;font-size:8px;color:var(--muted);margin-top:5px}
.ai b{color:var(--ok)}
.cursor{position:absolute;z-index:20;width:16px;height:16px;pointer-events:none;opacity:0;transition:left .8s var(--spring),top .8s var(--spring),opacity .2s}
.cursor.show{opacity:1}.cursor.click{transform:scale(.88)}
</style></head>
<body>
<div class="stage" id="stage"></div>
<div class="cursor" id="c1"><svg viewBox="0 0 18 18"><path d="M2 2 L2 14 L6.2 10.4 L9.6 16.2 L11.4 15.3 L8 9.4 L14 9.4 Z" fill="#fff"/></svg></div>
<script>
(function(){
  var stage=document.getElementById('stage'),c1=document.getElementById('c1'),timers=[],i=0;
  function after(ms,fn){var t=setTimeout(fn,ms);timers.push(t)}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop')timers.forEach(clearTimeout)});
  function place(t){if(!t)return;var r=t.getBoundingClientRect(),s=stage.getBoundingClientRect();c1.style.left=(r.left-s.left+6)+'px';c1.style.top=(r.top-s.top+5)+'px';c1.classList.add('show')}
  function click(cb){after(480,function(){c1.classList.add('click');after(260,function(){c1.classList.remove('click');if(cb)cb()})})}
  function show(addr,on,html){
    stage.innerHTML='<div class="br"><div class="bb"><div class="d"><i class="r"></i><i class="y"></i><i class="g"></i></div>'+addr+'</div><div class="app"><div class="side"><div class="sh">Publish</div><a class="'+(on==='q'?'on':'')+'" href="#">Queue</a><a href="#">Teams</a><a href="#">Licenses</a><a href="#">Artifacts</a><a href="#">Reviews</a><a class="'+(on==='n'?'on':'')+'" href="#">New item</a></div><div class="main">'+html+'</div></div></div>';
    c1.classList.remove('show');
  }
  function playWorkspace(){
    var pages=[
      function(){show('workspace / home','q','<h3>Workspace</h3><div class="kpis"><div class="kpi">Pending<b>3</b></div><div class="kpi">Corrections<b>2</b></div><div class="kpi">AI pass<b>4</b></div><div class="kpi">Live<b>11</b></div></div><div class="row"><div><div>Cluster service</div><div class="m">Legal line missing</div></div><span class="pill warn">Pending</span></div><div class="row"><div><div>Starter kit</div><div class="m">Required label unclear</div></div><span class="pill bad">Correction</span></div><div class="row"><div><div>Automation seat</div><div class="m">AI approved · human next</div></div><span class="pill ok">AI pass</span></div><span class="btn" id="hit">Publish new item</span>')},
      function(){show('workspace / type','n','<div class="prog">New item · type</div><h3>What are you publishing?</h3><div class="types"><div class="type sel" id="hit"><div>Service</div><div class="s">Requestable offering</div></div><div class="type"><div>License</div><div class="s">Seat or key</div></div><div class="type"><div>Artifact</div><div class="s">Package</div></div></div>')}
    ];
    i=0; (function go(){ if(i>=pages.length) return; pages[i](); after(400,function(){ place(document.getElementById('hit')); click(function(){ i++; after(700,go); }); }); })();
  }
  function playArmar(){
    var pages=[
      function(){show('offering / fields','n','<div class="prog">Step <b>1 of 4</b> · Requirements</div><h3>Load or type</h3><div class="split"><div class="box" id="hit"><b>From product file</b>offering.yml — name, service, billing id, region</div><div class="box"><b>Add by hand</b>Workspace name · required service · owner</div></div>')},
      function(){show('offering / guidance','n','<div class="prog">Step <b>2 of 4</b> · Guidance</div><h3>Which fields need help?</h3><div class="item">Workspace name</div><div class="item on" id="hit">Billing account <span class="tip">What is this?</span></div><div class="item on">License key <span class="tip">What is this?</span></div><div class="guide"><b style="color:#e8943a">From prior list</b> — Billing account: tenant cost center, 8–12 chars. License key: issued after approve.</div>')},
      function(){show('offering / onboard','n','<div class="prog">Step <b>3 of 4</b> · Onboarding</div><h3>Add a guide?</h3><div class="split"><div class="box">No — card + chat only</div><div class="box" id="hit" style="border-color:rgba(232,148,58,.5)"><b>Yes — builder</b>1 Workspace · 2 Team · 3 Billing</div></div><div class="guide">Same tour the requester will see beside the form.</div>')},
      function(){show('offering / review','n','<div class="prog">Step <b>4 of 4</b> · Review</div><h3>AI passed. Human next.</h3><div class="ai"><b>AI review</b> Fields labeled. Tooltips short. Onboarding is a tour, not a tooltip.</div><div class="row" style="margin-top:6px" id="hit"><div><div>Workbench workspace</div><div class="m">Service · Shared delivery</div></div><span class="pill warn">Human review</span></div>')}
    ];
    i=0; (function go(){ if(i>=pages.length) return; pages[i](); after(400,function(){ place(document.getElementById('hit')); click(function(){ i++; after(750,go); }); }); })();
  }
  var scene=new URLSearchParams(location.search).get('scene');
  if(scene==='armar') playArmar(); else playWorkspace();
})();
</script>
</body></html>
