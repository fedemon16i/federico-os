<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Publisher studio</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f3f4f8;font-family:'IBM Plex Sans',system-ui,sans-serif}
:root{--bg:#12141c;--nav:#0b0c10;--card:#1c1e28;--side:#101218;--muted:#9aa0b0;--faint:#6d7384;--line:rgba(255,255,255,.08);--or:#e8943a;--gold:#f0de5a;--ok:#7dcea0;--bad:#e0857f;--spring:cubic-bezier(.34,1.32,.64,1)}
.stage{position:relative;min-height:360px}
.browser{height:360px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--nav);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.bbar{height:24px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#14151c;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;display:block}
.dots .r{background:#ff5f57}.dots .y{background:#febc2e}.dots .g{background:#28c840}
.addr{flex:1;height:14px;border-radius:4px;background:rgba(255,255,255,.05);font-size:8px;color:var(--muted);display:flex;align-items:center;padding:0 8px}
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.nav{height:26px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--nav);border-bottom:1px solid var(--line);font-size:9px;color:var(--muted)}
.nav .mark{font-weight:800;color:#fff}.nav .on{color:#fff}.nav .right{margin-left:auto}
.shell{display:grid;grid-template-columns:118px 1fr;height:100%;min-height:0}
.side{background:var(--side);border-right:1px solid var(--line);padding:10px 8px;font-size:9px}
.side .sh{font-weight:700;color:#fff;margin-bottom:8px;padding:0 6px}
.side a{display:block;padding:5px 7px;border-radius:6px;color:var(--muted);margin-bottom:2px}
.side a.on{background:rgba(255,255,255,.07);color:#fff}
.main{padding:10px 12px;overflow:hidden}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hrow h3{margin:0;font-size:13px}.crumb{font-size:8px;color:var(--faint);margin-bottom:4px}
.btn{border:0;border-radius:5px;padding:5px 10px;font-size:9.5px;font-weight:650}
.btn-w{background:#fff;color:#111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;opacity:0;transform:translateY(8px);transition:.35s var(--spring)}
.card.on{opacity:1;transform:none}
.card .t{font-size:10.5px;font-weight:650}.card .m{font-size:8px;color:var(--faint);margin:2px 0 6px}
.pill{font-size:7.5px;padding:2px 6px;border-radius:100px;border:1px solid var(--line);color:var(--muted);margin-right:3px}
.pill.ok{color:var(--ok);border-color:rgba(125,206,160,.35)}.pill.warn{color:var(--gold);border-color:rgba(240,222,90,.3)}.pill.bad{color:var(--bad);border-color:rgba(224,133,127,.35)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.type{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;opacity:0;transform:translateY(6px);transition:.35s}
.type.on{opacity:1;transform:none}.type.sel{border-color:rgba(232,148,58,.6);background:#241c14}
.type .k{font-size:8px;color:var(--or);margin-bottom:3px}.type .t{font-size:11px;font-weight:650}.type .s{font-size:8px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:4px;margin:6px 0 8px}
.tab{font-size:8.5px;padding:4px 8px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.tab.on{color:#fff;background:rgba(255,255,255,.08)}
.chk{display:flex;gap:6px;align-items:flex-start;font-size:9px;color:var(--muted);margin:4px 0;opacity:0;transform:translateX(-6px);transition:.3s}
.chk.on{opacity:1;transform:none}
.chk i{width:10px;height:10px;border-radius:3px;border:1px solid var(--line);margin-top:1px;flex-shrink:0}
.chk i.on{background:var(--ok);border-color:var(--ok)}
.ai{border:1px solid rgba(232,148,58,.3);background:#1a1612;border-radius:8px;padding:8px;font-size:9px;opacity:0;transition:.4s}
.ai.on{opacity:1}
.ai .lab{color:var(--or);font-size:8px;font-weight:700;margin-bottom:4px}
.ai li{margin:3px 0 3px 12px;color:var(--muted);opacity:0}.ai li.on{opacity:1}
.cursor{position:absolute;z-index:50;pointer-events:none;opacity:0;width:16px;height:16px;transition:left .8s var(--spring),top .8s var(--spring),opacity .2s}
.cursor.show{opacity:1}.cursor.click{transform:scale(.88)}
</style></head>
<body>
<div class="stage" id="stage"></div>
<div class="cursor" id="c1"><svg viewBox="0 0 18 18"><path d="M2 2 L2 14 L6.2 10.4 L9.6 16.2 L11.4 15.3 L8 9.4 L14 9.4 Z" fill="#fff"/></svg></div>
<script>
(function(){
  var stage=document.getElementById('stage'),c1=document.getElementById('c1'),timers=[];
  function after(ms,fn){var t=setTimeout(fn,ms);timers.push(t)}
  function el(id){return document.getElementById(id)}
  function hideCur(){c1.classList.remove('show','click')}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop'){timers.forEach(clearTimeout);hideCur()}});
  function place(t,ox,oy){if(!t)return;var r=t.getBoundingClientRect(),s=stage.getBoundingClientRect();c1.style.left=(r.left-s.left+(ox||8))+'px';c1.style.top=(r.top-s.top+(oy||8))+'px';c1.classList.add('show')}
  function clickCur(cb){after(420,function(){c1.classList.add('click');after(220,function(){c1.classList.remove('click');if(cb)cb()})})}
  function show(html,url){stage.innerHTML='<div class="browser"><div class="bbar"><div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="addr">'+url+'</div></div>'+html+'</div>';hideCur()}
  var NAV='<div class="nav"><span class="mark">◆</span><span>Overview</span><span>Marketplace</span><span class="on">Publish</span><div class="right">Help</div></div>';
  var SIDE='<div class="side"><div class="sh">Studio</div><a class="on" href="#">Listings</a><a href="#">Onboarding</a><a href="#">Checklists</a><a href="#">Help docs</a><a href="#">AI review</a></div>';
  var library='<div class="app">'+NAV+'<div class="shell">'+SIDE+'<div class="main"><div class="crumb">Publish › Listings</div><div class="hrow"><h3>Your offerings</h3><button class="btn btn-w" id="newOff" type="button">New offering</button></div><div class="grid"><div class="card" id="c0"><div class="t">Workbench workspace</div><div class="m">Service · Shared delivery</div><span class="pill ok">Live</span><span class="pill warn">Checklist 2/5</span></div><div class="card" id="c1"><div class="t">Cluster service</div><div class="m">Service · Compute</div><span class="pill ok">Onboarding on</span><span class="pill warn">AI: tighten copy</span></div><div class="card" id="c2"><div class="t">Starter kit · Data</div><div class="m">Kit · Enablement</div><span class="pill">Draft</span><span class="pill bad">No requirements</span></div><div class="card" id="c3"><div class="t">Automation seat</div><div class="m">License · Delivery rights</div><span class="pill ok">Ready for review</span></div></div></div></div></div>';
  var compose='<div class="app">'+NAV+'<div class="shell">'+SIDE+'<div class="main"><div class="crumb">Publish › New offering</div><h3 style="margin:0 0 8px;font-size:13px">What are you listing?</h3><div class="types"><div class="type" id="t0"><div class="k">Item type</div><div class="t">Service</div><div class="s">Requestable offering with a form and cost.</div></div><div class="type" id="t1"><div class="k">Item type</div><div class="t">License</div><div class="s">Seat or right attached to a line.</div></div><div class="type" id="t2"><div class="k">Line</div><div class="t">Shared delivery</div><div class="s">Platform, workspaces, intake.</div></div><div class="type" id="t3"><div class="k">Line</div><div class="t">Enablement</div><div class="s">Kits, training, starter paths.</div></div></div><div style="margin-top:10px;display:flex;justify-content:flex-end"><button class="btn btn-w" id="toStudio" type="button">Continue to studio</button></div></div></div></div>';
  var studio='<div class="app">'+NAV+'<div class="shell">'+SIDE+'<div class="main"><div class="crumb">Publish › Workbench workspace</div><div class="hrow"><h3>Offering studio</h3><span class="pill warn" id="st">AI review running</span></div><div class="tabs"><span class="tab">Details</span><span class="tab on">Requirements</span><span class="tab">Checklist</span><span class="tab">Onboarding</span><span class="tab">Help</span><span class="tab">AI</span></div><div class="grid"><div class="card on"><div class="t">Explain before they request</div><div class="m">Requesters see this next to the form.</div><div class="chk" id="k0"><i></i><span>Need a workspace name and a region.</span></div><div class="chk" id="k1"><i></i><span>Pick at least one required service.</span></div><div class="chk" id="k2"><i></i><span>Admin users optional on first request.</span></div></div><div class="ai" id="aiBox"><div class="lab">AI pass · writing + completeness</div><ul><li id="a0">Split the requirements paragraph into 3 checks.</li><li id="a1">Link a help article to required service.</li><li id="a2">Onboarding is only a tooltip — add a walkthrough.</li></ul></div></div></div></div></div>';
  var scene=new URLSearchParams(location.search).get('scene')||'library';
  function playLibrary(){
    show(library,'publisher / listings');
    ['c0','c1','c2','c3'].forEach(function(id,i){after(120+i*120,function(){el(id).classList.add('on')})});
    after(700,function(){place(el('newOff'),8,6);clickCur(function(){})});
  }
  function playCompose(){
    show(compose,'publisher / new');
    ['t0','t1','t2','t3'].forEach(function(id,i){after(100+i*110,function(){el(id).classList.add('on')})});
    after(600,function(){place(el('t0'),8,8);clickCur(function(){el('t0').classList.add('sel');after(280,function(){place(el('t2'),8,8);clickCur(function(){el('t2').classList.add('sel')})})})});
  }
  function playStudio(){
    show(studio,'publisher / studio');
    ['k0','k1','k2'].forEach(function(id,i){after(200+i*180,function(){el(id).classList.add('on'); el(id).querySelector('i').classList.add('on')})});
    after(800,function(){el('aiBox').classList.add('on'); place(el('aiBox'),8,8)});
    ['a0','a1','a2'].forEach(function(id,i){after(1000+i*220,function(){el(id).classList.add('on')})});
    after(1700,function(){el('st').textContent='AI review ready'; hideCur()});
  }
  ({library:playLibrary,compose:playCompose,studio:playStudio}[scene]||playLibrary)();
})();
</script>
</body></html>
