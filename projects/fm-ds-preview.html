<!DOCTYPE html>
<html lang="en" data-skin="ey" data-device="desktop" data-mode="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DS preview</title>
<link rel="stylesheet" href="fm-ds.css"/>
<style>
html,body,.stage{background:transparent}
.fm-unit{overflow:visible}
.slot{position:absolute;inset:0}
.slot iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.phone-slot{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
[data-device="phone"] .slot{display:none}
[data-device="phone"] .phone-slot{display:flex}
.iphone .body{padding:0;background:#0b0c10}
.iphone .body iframe{width:100%;height:100%;border:0}
</style></head>
<body>
<div class="stage">
  <div class="fm-unit" id="unit">
    <div class="slot"><iframe id="frame" title="Beat"></iframe></div>
    <div class="phone-slot">
      <div class="iphone">
        <div class="sb"><div class="t">9:41</div><div class="island"></div><div class="sys"></div></div>
        <div class="body"><iframe id="phoneFrame" title="Beat mobile"></iframe></div>
        <div class="home"></div>
      </div>
    </div>
  </div>
</div>
<script src="fm-engine.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var skin=q.get('skin')||'ey';
  var mode=q.get('mode')||'light';
  var device=q.get('device')||'desktop';
  var REF={ey:'ey-02-analyze.html',dc:'dollarcity-player.html',chek:'chek-player.html',cus:'customs.html',bc:'blockchain-player.html'};
  FM.skin(skin); FM.mode(mode);
  document.documentElement.setAttribute('data-device', device);
  var src=(REF[skin]||REF.ey)+'?mode='+mode;
  document.getElementById('frame').src=src;
  document.getElementById('phoneFrame').src=src;
})();
</script>
</body></html>
