<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Measure</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f5f4ef;font-family:'IBM Plex Sans',system-ui,sans-serif}
:root{--y:#FFE600;--ink:#0b0b0b;--line:rgba(255,255,255,.12)}
.board{padding:22px 20px 16px}
.k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--y);margin:0 0 16px}
.tree{display:flex;flex-direction:column;align-items:center}
.node{display:inline-flex;padding:7px 12px;font-size:11px;font-weight:700;opacity:0;transform:translateY(6px);transition:.35s}
.node.on{opacity:1;transform:none}
.node.root{background:var(--y);color:var(--ink)}
.node.arm{background:#171717;color:#fff;border:1px solid var(--line)}
.node.leaf{background:transparent;color:#b8b4ac;border:1px solid var(--line);font-weight:500;font-size:10px}
.line{width:1px;height:10px;background:var(--y);opacity:0}.line.on{opacity:1}
.row{display:flex;gap:12px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.box{border:1px solid var(--line);padding:12px 14px}
.mh{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--y);margin-bottom:8px}
.row2{display:flex;align-items:center;gap:8px;font-size:12px;color:#c8c4bc;padding:4px 0;opacity:0;transform:translateX(-6px);transition:.3s}
.row2.on{opacity:1;transform:none}
.mark{width:6px;height:6px;background:var(--y);flex-shrink:0}
</style></head>
<body>
<div class="board">
  <div class="k">Information architecture</div>
  <div class="tree">
    <div class="node root" id="nHome">Catalog home</div>
    <div class="line" id="ln0"></div>
    <div class="row">
      <div class="col"><div class="node arm" id="nSvc">Services</div><div class="line" id="lnS"></div><div class="node leaf" id="nItem">Item detail</div></div>
      <div class="col"><div class="node arm" id="nForm">Request form</div><div class="line" id="lnF"></div><div class="node leaf" id="nRev">Review</div></div>
      <div class="col"><div class="node arm" id="nWb">Workbench</div><div class="line" id="lnW"></div><div class="node leaf" id="nLic">Licenses</div></div>
      <div class="col"><div class="node arm" id="nRep">Reports</div><div class="line" id="lnR"></div><div class="node leaf" id="nFun">Funnels</div></div>
    </div>
  </div>
  <div class="lists">
    <div class="box"><div class="mh">Features tagged</div>
      <div class="row2" id="ft0"><i class="mark"></i>Explore catalog CTA</div>
      <div class="row2" id="ft1"><i class="mark"></i>Service card</div>
      <div class="row2" id="ft2"><i class="mark"></i>Required field</div>
      <div class="row2" id="ft3"><i class="mark"></i>Submit request</div>
    </div>
    <div class="box"><div class="mh">Events</div>
      <div class="row2" id="ev0"><i class="mark"></i>catalog_view</div>
      <div class="row2" id="ev1"><i class="mark"></i>item_open</div>
      <div class="row2" id="ev2"><i class="mark"></i>form_start</div>
      <div class="row2" id="ev3"><i class="mark"></i>form_dropoff</div>
    </div>
  </div>
</div>
<script>
(function(){
  var t=[]; function after(ms,fn){var x=setTimeout(fn,ms);t.push(x)}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop')t.forEach(clearTimeout)});
  function on(id){var n=document.getElementById(id); if(n) n.classList.add('on')}
  ['nHome','ln0','nSvc','nForm','nWb','nRep','lnS','lnF','lnW','lnR','nItem','nRev','nLic','nFun'].forEach(function(id,i){after(80+i*80,function(){on(id)})});
  after(1400,function(){[0,1,2,3].forEach(function(i){after(i*130,function(){on('ft'+i);on('ev'+i)})})});
})();
</script>
</body></html>
