<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Measure</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
html,body{background:transparent;overflow:hidden}
.ey-unit.board{overflow:visible}
.pad{padding:36px 40px;height:100%;box-sizing:border-box}
.k{font-family:var(--ey-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ey-yellow);margin:0 0 18px}
.tree{display:flex;flex-direction:column;align-items:center}
.node{display:inline-flex;padding:8px 14px;font-size:13px;font-weight:700;opacity:0;transform:translateY(6px);transition:.35s}
.node.on{opacity:1;transform:none}
.node.root{background:var(--ey-yellow);color:#0b0b0b}
.node.arm{background:#171717;color:#fff;border:1px solid var(--ey-line)}
.node.leaf{color:#b8b4ac;border:1px solid var(--ey-line);font-weight:500;font-size:12px}
.line{width:1px;height:12px;background:var(--ey-yellow);opacity:0}.line.on{opacity:1}
.row{display:flex;gap:16px;justify-content:center;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.box{padding:4px 0}
.mh{font-family:var(--ey-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ey-yellow);margin-bottom:8px}
.row2{display:flex;gap:8px;align-items:center;font-size:13px;color:#c8c4bc;margin:6px 0;opacity:0;transition:.3s}
.row2.on{opacity:1}.mark{width:7px;height:7px;background:var(--ey-yellow);flex-shrink:0}
</style></head>
<body>
<div class="stage">
  <div class="ey-unit board">
    <div class="pad">
      <div class="k">Information architecture</div>
      <div class="tree">
        <div class="node root" id="nHome">Catalog home</div>
        <div class="line" id="ln0"></div>
        <div class="row">
          <div class="col"><div class="node arm" id="nSvc">Services</div><div class="line" id="lnS"></div><div class="node leaf" id="nItem">Item detail</div></div>
          <div class="col"><div class="node arm" id="nForm">Request form</div><div class="line" id="lnF"></div><div class="node leaf" id="nRev">Review</div></div>
          <div class="col"><div class="node arm" id="nWb">Workbench</div><div class="line" id="lnW"></div><div class="node leaf" id="nDone">Instance</div></div>
        </div>
      </div>
      <div class="lists">
        <div class="box"><div class="mh">Features tagged</div>
          <div class="row2" id="f0"><i class="mark"></i>Catalog tiles</div>
          <div class="row2" id="f1"><i class="mark"></i>Required service field</div>
          <div class="row2" id="f2"><i class="mark"></i>Order rail</div>
        </div>
        <div class="box"><div class="mh">Events</div>
          <div class="row2" id="e0"><i class="mark"></i>catalog_view</div>
          <div class="row2" id="e1"><i class="mark"></i>item_open</div>
          <div class="row2" id="e2"><i class="mark"></i>form_dropoff</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="ey-engine.js"></script>
<script>
['nHome','ln0','nSvc','nForm','nWb','lnS','lnF','lnW','nItem','nRev','nDone','f0','e0','f1','e1','f2','e2'].forEach(function(id,i){
  EY.after(80+i*90, function(){ var n=document.getElementById(id); if(n) n.classList.add('on'); });
});
</script>
</body></html>
