<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Funnel</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
html,body{background:transparent}
.pad{padding:40px 48px;height:100%;box-sizing:border-box}
.k{font-family:var(--ey-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ey-yellow);margin:0 0 10px}
.note{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:0 0 22px;opacity:0;transform:translateY(8px);transition:.4s;color:var(--ey-text)}
.note.on{opacity:1;transform:none}.note em{color:var(--ey-yellow);font-style:normal}
.row{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;margin:0 0 10px;opacity:0;transform:translateX(-8px);transition:.4s}
.row.on{opacity:1;transform:none}
.lbl{font-size:13px;color:var(--ey-muted)}
.bar{height:32px;background:var(--ey-plate);color:var(--ey-text);border:1px solid var(--ey-line);display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;width:16%;min-width:80px;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.bar span{margin-left:auto;font-family:var(--ey-mono);font-size:11px;color:var(--ey-faint)}
.row.dead .bar{background:var(--ey-yellow);color:#0b0b0b;border-color:transparent}
.row.dead .bar span{color:#0b0b0b}
.stack{margin-top:16px;display:flex;gap:6px}
</style></head>
<body>
<div class="stage">
  <div class="ey-unit board">
    <div class="pad">
      <div class="k">Drop-off</div>
      <p class="note" id="note">The path holds until <em>required service</em>.</p>
      <div class="row" id="r0"><div class="lbl">Home</div><div class="bar" data-w="100%">Home <span>100</span></div></div>
      <div class="row" id="r1"><div class="lbl">Catalog</div><div class="bar" data-w="88%">Catalog <span>88</span></div></div>
      <div class="row" id="r2"><div class="lbl">Services</div><div class="bar" data-w="72%">Services <span>72</span></div></div>
      <div class="row" id="r3"><div class="lbl">Workbench</div><div class="bar" data-w="54%">Workbench <span>54</span></div></div>
      <div class="row dead" id="r4"><div class="lbl">Required</div><div class="bar" data-w="22%">Required <span>22</span></div></div>
      <div class="stack" id="stack"></div>
    </div>
  </div>
</div>
<script src="ey-engine.js"></script>
<script src="ey-market.js"></script>
<script>
document.getElementById('stack').innerHTML=EYMarket.chip('pendo')+EYMarket.chip('ga4');
EY.after(60, function(){ document.getElementById('note').classList.add('on'); });
[0,1,2,3,4].forEach(function(i){
  EY.after(240+i*360, function(){
    var row=document.getElementById('r'+i); row.classList.add('on');
    var b=row.querySelector('.bar'); b.style.width=b.getAttribute('data-w');
  });
});
</script>
</body></html>
