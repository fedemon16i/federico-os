<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Design</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f3f4f8;font-family:'IBM Plex Sans',system-ui,sans-serif}
.stage{min-height:360px;position:relative}
.browser{height:360px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#0b0c10}
.bbar{height:24px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#14151c;border-bottom:1px solid rgba(255,255,255,.08);font-size:8px;color:#9aa0b0}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;display:block}
.dots .r{background:#ff5f57}.dots .y{background:#febc2e}.dots .g{background:#28c840}
.app{flex:1;display:grid;grid-template-columns:1fr 1fr;background:#12141c}
.pane{padding:12px;border-right:1px solid rgba(255,255,255,.07)}
.pane:last-child{border:0}
.k{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#8a8580;margin-bottom:8px}
.h{font-size:13px;font-weight:700;margin:0 0 6px}
.s{font-size:9px;color:#9aa0b0;line-height:1.4}
.chip{display:inline-block;margin-top:8px;font-size:8px;padding:3px 7px;border-radius:100px;border:1px solid rgba(255,255,255,.1);color:#c8c4bc}
.merge{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);background:#e8943a;color:#1a1508;font-size:9px;font-weight:700;padding:5px 10px;border-radius:100px}
</style></head>
<body>
<div class="stage">
<div class="browser"><div class="bbar"><div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>figma + factory · merge</div>
<div class="app"><div class="pane"><div class="k">By hand</div><div class="h">Figma frames</div><div class="s">Checklist before the form. Required service gets a name and a help note.</div><span class="chip">Figma</span></div>
<div class="pane"><div class="k">With AI</div><div class="h">Factory pass</div><div class="s">Same constraint, generated walkthrough + field order.</div><span class="chip">Factory</span></div></div></div>
<div class="merge">merge → one proposal</div>
</div>
</body></html>
