<!DOCTYPE html>
<html lang="en" data-skin="ey" data-mode="light" data-device="desktop">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FM kit</title>
<link rel="stylesheet" href="fm-ds.css"/>
<link rel="stylesheet" href="fm-ds-fintech.css"/>
<link rel="stylesheet" href="fm-ds-eyui.css"/>
<link rel="stylesheet" href="fm-ds-layout.css"/>
<link rel="stylesheet" href="fm-ds-annot.css"/>
<style>
body{overflow:auto;background:var(--fm-bg);padding:16px}
.kit-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stage-host{height:70vh;min-height:360px;position:relative;background:transparent}
html.embed,html.embed body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent}
html.embed .kit-bar,html.embed #kit{display:none!important}
html.embed .stage-host{height:100vh;min-height:100%}
</style>
</head>
<body>
<div class="kit-bar">
  <select id="skin"><option>ey</option><option>dc</option><option>chek</option><option>cus</option><option>bc</option></select>
  <select id="mode"><option>light</option><option>dark</option></select>
  <select id="beat"><option>kit</option><optgroup label="EY"><option>measure</option><option>analyze</option><option>funnel</option><option>research</option><option>understand</option><option>design</option><option>hub</option><option>requester</option><option>publisher</option></optgroup><optgroup label="Chek"><option>chek-hub</option><option>chek-pay</option><option>chek-credit</option><option>chek-moves</option><option>chek-security</option><option>chek-onboard</option></optgroup></select>
  <button class="fm-btn" type="button" id="replay">Replay</button>
</div>
<div id="kit"></div>
<div class="stage-host" id="player" hidden><div class="stage"><div class="fm-unit" id="unit"></div></div></div>
<script src="fm-engine.js"></script>
<script src="fm-tip-stable.js"></script>
<script src="ey-screens.js"></script>
<script src="ey-boards.js"></script>
<script src="ey-fabric-ui.js"></script>
<script src="ey-pub-ui.js"></script>
<script src="ey-hub-ui.js"></script>
<script src="ey-fix.js"></script>
<script src="ey-beats.js"></script>
<script src="ey-beats-hub.js"></script>
<script src="chek-screens.js"></script>
<script src="chek-beats.js"></script>
<script>
(function(){
  var skin=document.getElementById('skin'), mode=document.getElementById('mode'), beat=document.getElementById('beat');
  var CHEK=/^chek-/, BOARD=/^(measure|funnel|research|understand|design)$/;
  function applyChrome(){ document.documentElement.setAttribute('data-skin', skin.value); document.documentElement.setAttribute('data-mode', mode.value); }
  function mount(phone, board){
    var unit=document.getElementById('unit');
    if(phone){ document.documentElement.setAttribute('data-device','phone'); unit.innerHTML='<div class="phone-slot"><div class="iphone"><div class="sb"><span>9:41</span><span class="island"></span><span>5G</span></div><div class="body" id="slot"></div></div></div>'; }
    else if(board){ document.documentElement.setAttribute('data-device','desktop'); unit.innerHTML='<div class="fm-diag-free" id="slot"></div>'; }
    else { document.documentElement.setAttribute('data-device','desktop'); unit.innerHTML='<div class="fm-shell"><div class="fm-bbar"><div class="fm-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="fm-addr" id="addr"></div></div><div id="slot" class="fm-app"></div></div>'; }
  }
  function play(){
    var name=beat.value, isChek=CHEK.test(name), embed=name!=='kit';
    document.documentElement.classList.toggle('embed', embed);
    document.getElementById('kit').hidden = embed;
    document.getElementById('player').hidden = !embed;
    if(isChek) skin.value='chek';
    applyChrome();
    if(!embed) return;
    mount(isChek, BOARD.test(name));
    FM.fit();
    if(isChek) ChekBeats.run(name); else EYBeats.run(name);
  }
  skin.onchange=applyChrome; mode.onchange=applyChrome; beat.onchange=play;
  document.getElementById('replay').onclick=play;
  var q=new URLSearchParams(location.search);
  if(q.get('skin')) skin.value=q.get('skin');
  if(q.get('mode')) mode.value=q.get('mode');
  if(q.get('beat')) beat.value=q.get('beat');
  applyChrome(); play();
})();
</script>
</body>
</html>
