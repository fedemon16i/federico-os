<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Analyze</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0c10;color:#f3f4f8;font-family:'IBM Plex Sans',system-ui,sans-serif}
:root{--bg:#12141c;--nav:#0b0c10;--card:#1c1e28;--line:rgba(255,255,255,.08);--or:#e8943a;--gold:#f0de5a;--bad:#e0857f;--spring:cubic-bezier(.34,1.32,.64,1)}
.stage{position:relative;height:100%}
.br{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--nav)}
.bb{height:22px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#14151c;border-bottom:1px solid var(--line);font-size:8px;color:#9aa0b0;font-family:ui-monospace,monospace;flex-shrink:0}
.d{display:flex;gap:4px}.d i{width:6px;height:6px;border-radius:50%;display:block}
.d .r{background:#ff5f57}.d .y{background:#febc2e}.d .g{background:#28c840}
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.nav{height:24px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--nav);border-bottom:1px solid var(--line);font-size:9px;color:#9aa0b0;flex-shrink:0}
.nav .on{color:#fff}
.hero{padding:16px;background:radial-gradient(ellipse at 88% 40%,rgba(255,170,40,.5),transparent 36%),#07070a}
.hero h2{margin:0 0 8px;font-size:18px}.btn{background:#fff;color:#111;border:0;border-radius:5px;padding:6px 12px;font-size:10px;font-weight:650}
.cat{display:grid;grid-template-columns:110px 1fr;flex:1;min-height:0}
.side{background:#101218;padding:10px 8px;font-size:9px;color:#9aa0b0}
.main{padding:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tile{height:64px;border-radius:7px;padding:8px;display:flex;align-items:flex-end;font-size:11px;font-weight:650;background:linear-gradient(160deg,rgba(0,0,0,.3),rgba(0,0,0,.6)),#3a1a6a}
.svcs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px}
.svc button{margin-top:6px;font-size:8px;padding:3px 7px;background:rgba(255,255,255,.08);color:#fff;border:0;border-radius:4px}
.wb{display:grid;grid-template-columns:1.15fr .85fr;flex:1;min-height:0}
.wb-l{padding:10px 12px}.wb-r{padding:10px;background:#101218;border-left:1px solid var(--line)}
.fld label{display:block;font-size:8px;color:#9aa0b0;margin:6px 0 2px}
.box{height:22px;border:1px solid var(--line);background:#161821;padding:0 8px;display:flex;align-items:center;font-size:10px}
.box.bad{border-color:var(--bad)}
.order{border:1px solid var(--line);background:var(--card);padding:10px;border-radius:8px;font-size:10px}
.order b{color:var(--gold)}
.uc{position:absolute;z-index:30;pointer-events:none;opacity:0;transition:left .8s var(--spring),top .8s var(--spring),opacity .2s}
.uc.on{opacity:1}
.uc em{display:block;font-style:normal;font-size:8px;font-weight:700;padding:2px 5px;margin-bottom:2px;white-space:nowrap}
.u1 em{background:#FFE600;color:#111}
.u2 em{background:#7dc4ff;color:#111}
.u3 em{background:#e8943a;color:#111}
.uc i{display:block;width:0;height:0;border:6px solid transparent;border-top-color:#fff;margin-left:3px}
</style></head>
<body>
<div class="stage" id="stage"></div>
<div class="uc u1" id="u1"><em>user 1</em><i></i></div>
<div class="uc u2" id="u2"><em>user 2</em><i></i></div>
<div class="uc u3" id="u3"><em>user 3</em><i></i></div>
<script>
(function(){
  var stage=document.getElementById('stage'), timers=[];
  function after(ms,fn){timers.push(setTimeout(fn,ms))}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop')timers.forEach(clearTimeout)});
  function hide(){['u1','u2','u3'].forEach(function(id){document.getElementById(id).classList.remove('on')})}
  function put(id,el,ox,oy){
    var n=document.getElementById(id); if(!el) return;
    var r=el.getBoundingClientRect(), s=stage.getBoundingClientRect();
    n.style.left=(r.left-s.left+(ox||0))+'px'; n.style.top=(r.top-s.top+(oy||0))+'px'; n.classList.add('on');
  }
  function show(html,url){
    hide();
    stage.innerHTML='<div class="br"><div class="bb"><div class="d"><i class="r"></i><i class="y"></i><i class="g"></i></div>'+url+'</div>'+html+'</div>';
  }
  var NAV='<div class="nav"><span>Overview</span><span class="on">Marketplace</span><span>Tools</span></div>';
  var home='<div class="app">'+NAV+'<div class="hero"><h2>Unlock technology at speed and scale</h2><button class="btn" id="go" type="button">Explore Catalog</button></div></div>';
  var cat='<div class="app">'+NAV+'<div class="cat"><div class="side">Catalog</div><div class="main"><div class="tiles"><div class="tile" id="go">Services</div><div class="tile">Licenses</div><div class="tile">Kits</div></div></div></div></div>';
  var svc='<div class="app">'+NAV+'<div class="cat"><div class="side">Services</div><div class="main"><div class="svcs"><div class="svc">Cluster</div><div class="svc">Workbench<br><button type="button" id="go">Get started</button></div></div></div></div></div>';
  var form='<div class="app">'+NAV+'<div class="wb"><div class="wb-l"><h3 style="margin:0 0 6px">Workbench</h3><div class="fld"><label>Instance name</label><div class="box" id="name">Enter a name…</div></div><div class="fld"><label>Required service</label><div class="box" id="req">Select a service…</div></div></div><div class="wb-r"><div class="order" id="ord">Your order<br><b>$0 / mo</b></div></div></div></div>';
  function play(){
    show(home,'platform / overview');
    after(400,function(){
      put('u1',document.getElementById('go'),8,6);
      after(700,function(){
        show(cat,'platform / catalog');
        after(350,function(){
          put('u1',document.getElementById('go'),6,6);
          after(700,function(){
            show(svc,'platform / services');
            after(350,function(){
              put('u1',document.getElementById('go'),4,4);
              after(700,function(){
                show(form,'platform / workbench');
                after(300,function(){
                  var n=document.getElementById('name'), r=document.getElementById('req'), o=document.getElementById('ord');
                  put('u1',n,10,4); put('u2',r,-10,8); put('u3',o,4,8);
                  after(900,function(){
                    n.textContent='Team workspace';
                    put('u1',r,20,4); put('u2',n,40,6); put('u3',r,-20,10);
                  });
                  after(1800,function(){
                    r.classList.add('bad');
                    put('u1',r,30,-18); put('u2',r,8,16); put('u3',o,10,4);
                  });
                });
              });
            });
          });
        });
      });
    });
  }
  play();
})();
</script>
</body></html>
