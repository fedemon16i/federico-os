<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Analyze</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
.nav .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav .search{width:188px;height:22px;border-radius:6px;border:1px solid var(--ey-line);background:var(--ey-card);font-size:11px;color:var(--ey-muted);display:flex;align-items:center;padding:0 10px}
.hero{padding:16px;background:var(--ey-hero);color:#fff}
.hero h2{margin:0 0 6px;font-size:18px}
.band{margin:10px 14px;padding:10px;border:1px solid var(--ey-line);border-radius:8px;background:var(--ey-card)}
.cat{display:grid;grid-template-columns:120px 1fr;flex:1;min-height:0}
.side{background:var(--ey-side);padding:10px 8px;font-size:9px;border-right:1px solid var(--ey-line)}
.main{padding:10px 12px;overflow:hidden}
.banner{padding:8px 10px;border-radius:7px;margin-bottom:7px;background:linear-gradient(110deg,#6b2bb8,#2a1048);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tile{height:64px;border-radius:7px;padding:8px;color:#fff;display:flex;align-items:flex-end}
.t1{background:#6b2bb8}.t2{background:#2a4a8a}.t3{background:#1a4a6a}.t4{background:#1a3a4a}.t5{background:#3a2a6a}.t6{background:#5a1a5a}
.wb{display:grid;grid-template-columns:1.15fr .85fr;flex:1;min-height:0}
.wb-l{padding:10px}.wb-r{padding:10px;background:var(--ey-side);border-left:1px solid var(--ey-line)}
.fld label{display:flex;gap:6px;align-items:center;font-size:8px;color:var(--ey-muted);margin-bottom:2px}
.qtip{width:14px;height:14px;border-radius:50%;border:1px solid var(--ey-line);display:grid;place-items:center;font-size:9px}
.hint{display:none;font-size:9px;color:var(--ey-muted);margin-top:3px;padding:4px 6px;border:1px solid var(--ey-line);border-radius:4px}
.hint.on{display:block}
.box{height:22px;border:1px solid var(--ey-line);border-radius:5px;background:var(--ey-surface);padding:0 8px;display:flex;align-items:center;font-size:9px}
.box.drop{border-color:var(--ey-bad)}
.flag{opacity:0;margin-top:4px}.flag.on{opacity:1}
.svc .t{font-size:10px;font-weight:650}.svc .desc{font-size:8px;color:var(--ey-muted)}.svc .meta{font-size:7.5px;color:var(--ey-faint)}
#slot{flex:1;min-height:0;display:flex;flex-direction:column}
</style></head>
<body>
<div class="stage"><div class="ey-unit window" id="unit"><div class="ey-bbar"><div class="ey-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="ey-addr" id="addr"></div></div><div id="slot"></div></div></div>
<script src="ey-engine.js"></script>
<script src="ey-market.js"></script>
<script>
(function(){
  var slot=document.getElementById('slot');
  var scene=new URLSearchParams(location.search).get('scene');
  EY.cursors(document.getElementById('unit'),3); EY.fit();
  function pack(el){ if(!el) return; EY.move('u1',el,8,4); EY.after(120,function(){ EY.move('u2',el,26,18); }); EY.after(240,function(){ EY.move('u3',el,-8,22); }); }
  var NAV='<div class="nav"><span class="mark">◆</span><span class="on">Marketplace</span><span>Tools</span><div class="right"><div class="search">Search</div><span class="ai">AI</span></div></div>';
  var SIDE='<div class="side"><div class="sh">Catalog</div><a class="on" href="#">All</a><a href="#">Services</a></div>';
  var home='<div class="app">'+NAV+'<div class="hero"><h2>Unlock technology at speed and scale</h2><p>Reusable components and a request path that should be obvious.</p><button class="ey-btn btn-w" id="go" type="button">Explore Catalog</button></div><div class="band"><b>Developer workflow</b></div></div>';
  var catalog='<div class="app">'+NAV+'<div class="cat">'+SIDE+'<div class="main"><div class="tiles"><div class="tile t1" id="go">Services</div><div class="tile t2">Licenses</div><div class="tile t3">Kits</div><div class="tile t4">Packages</div><div class="tile t5">APIs</div><div class="tile t6">Explore</div></div></div></div></div>';
  var services='<div class="app">'+NAV+'<div class="cat">'+SIDE+'<div class="main"><div class="banner">Services · shared infrastructure</div>'+EYMarket.grid()+'</div></div></div>';
  var form='<div class="app">'+NAV+'<div class="wb"><div class="wb-l"><h3>Workbench</h3><div class="fld"><label>Instance name <i class="qtip" id="t1">?</i></label><div class="box" id="f1">Enter a name…</div><div class="hint" id="h1">Need a unique name.<br>2–40 characters.</div><div class="flag" id="d1">user 1 · drop-off</div></div><div class="fld"><label>Location <i class="qtip" id="t2">?</i></label><div class="ey-radio" id="f2"><i></i> West 2</div><div class="ey-radio"><i></i> East 1</div><div class="hint" id="h2">Region cannot change later.<br>Pick the closest one.</div><div class="flag" id="d2">user 2 · drop-off</div></div><div class="fld"><label>Required service <i class="qtip" id="t3">?</i></label><div class="ey-radio" id="f3"><i></i> Cluster</div><div class="ey-radio"><i></i> Workbench</div><div class="hint" id="h3">At least one service.<br>No default is selected.</div><div class="flag" id="d3">user 3 · drop-off</div></div></div><div class="wb-r"><div class="order"><h4>Your order</h4>$0 / mo</div></div></div></div>';
  function set(html,url){ document.getElementById('addr').textContent=url; slot.innerHTML=html; }
  function playForm(){
    set(form,'workbench');
    EY.after(80,function(){
      EY.move('u1', document.getElementById('t1'));
      EY.after(500,function(){ document.getElementById('h1').classList.add('on'); });
      EY.after(1100,function(){ document.getElementById('f1').classList.add('drop'); document.getElementById('d1').classList.add('on'); EY.move('u2', document.getElementById('t2')); });
      EY.after(1600,function(){ document.getElementById('h2').classList.add('on'); });
      EY.after(2200,function(){ document.getElementById('f2').classList.add('drop'); document.getElementById('d2').classList.add('on'); EY.move('u3', document.getElementById('t3')); });
      EY.after(2700,function(){ document.getElementById('h3').classList.add('on'); });
      EY.after(3300,function(){ document.getElementById('f3').classList.add('drop'); document.getElementById('d3').classList.add('on'); });
    });
  }
  if(scene==='form'){ playForm(); return; }
  set(home,'overview');
  EY.after(300,function(){ pack(document.getElementById('go')); });
  EY.after(1600,function(){ set(catalog,'catalog'); EY.after(80,function(){ pack(document.getElementById('go')); }); });
  EY.after(3200,function(){ set(services,'services'); EY.after(80,function(){ pack(document.getElementById('go')); }); });
  EY.after(4800, playForm);
})();
</script>
</body></html>
