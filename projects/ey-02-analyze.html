<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Analyze</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
.hero{padding:24px;background:radial-gradient(ellipse at 88% 40%,rgba(255,170,40,.45),transparent 36%),radial-gradient(ellipse at 78% 70%,rgba(70,90,255,.35),transparent 42%),#07070a;color:#fff}
.hero .k{font-size:11px;opacity:.8;margin:0 0 6px}.hero h2{margin:0 0 8px;font-size:22px}.hero p{margin:0 0 12px;font-size:13px;max-width:52ch;opacity:.86}
.hero .row-btns{display:flex;gap:8px}
.band{margin:16px;padding:12px 16px;border:1px solid var(--ey-line);border-radius:8px;background:var(--ey-card)}
.banner{padding:12px;border-radius:8px;margin-bottom:12px;background:linear-gradient(110deg,#3a1a6a,#120820);color:#fff}
.banner b{display:block;font-size:14px}.banner span{font-size:11px;opacity:.8}
.qtip{width:14px;height:14px;border-radius:50%;border:1px solid var(--ey-line);display:grid;place-items:center;font-size:9px}
#slot{flex:1;min-height:0;display:flex;flex-direction:column}
</style></head>
<body>
<div class="stage"><div class="ey-unit window" id="unit"><div class="ey-bbar"><div class="ey-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="ey-addr" id="addr"></div></div><div id="slot"></div></div></div>
<script src="ey-engine.js"></script>
<script src="ey-market.js"></script>
<script src="ey-shell.js"></script>
<script>
(function(){
  var slot=document.getElementById('slot');
  var scene=new URLSearchParams(location.search).get('scene');
  EY.cursors(document.getElementById('unit'),3); EY.fit();
  function pack(el){ if(!el) return; EY.move('u1',el,8,4); EY.after(120,function(){ EY.move('u2',el,26,18); }); EY.after(240,function(){ EY.move('u3',el,-8,22); }); }
  function set(html,url){ document.getElementById('addr').textContent=url; slot.innerHTML=html; document.querySelectorAll('.ey-drop,.ey-tip').forEach(function(n){ n.remove(); }); }
  function playForm(){
    set(EYShell.form(),'workbench');
    EY.after(80,function(){
      EY.move('u1', document.getElementById('t1'));
      EY.after(400,function(){ EY.tip(document.getElementById('t1'),'Instance name','Need a unique name. 2–40 characters.'); });
      EY.after(1200,function(){ EY.drop(document.getElementById('f1'),'user 1 · drop-off'); EY.move('u2', document.getElementById('t2')); });
      EY.after(1700,function(){ EY.tip(document.getElementById('t2'),'Location','Region cannot change later.'); });
      EY.after(2500,function(){ EY.drop(document.getElementById('f2'),'user 2 · drop-off'); EY.move('u3', document.getElementById('t3')); });
      EY.after(3000,function(){ EY.tip(document.getElementById('t3'),'Required service','At least one service. No default.'); });
      EY.after(3800,function(){ EY.drop(document.getElementById('f3'),'user 3 · drop-off'); });
    });
  }
  if(scene==='form'){ playForm(); return; }
  set(EYShell.home(),'overview');
  EY.after(300,function(){ pack(document.getElementById('go')); });
  EY.after(1600,function(){ set(EYShell.catalog(),'catalog'); EY.after(80,function(){ pack(document.getElementById('go')); }); });
  EY.after(3200,function(){ set(EYShell.services(),'services'); EY.after(80,function(){ pack(document.getElementById('go')); }); });
  EY.after(5000, playForm);
})();
</script>
</body></html>
