<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Analyze</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
.hero{padding:16px;background:radial-gradient(ellipse at 88% 40%,rgba(255,170,40,.5),transparent 36%),#07070a}
.hero h2{margin:0 0 8px;font-size:18px}
.btn{background:#fff;color:#111;border:0;border-radius:5px;padding:6px 12px;font-size:10px;font-weight:650}
.cat{display:grid;grid-template-columns:110px 1fr;flex:1;min-height:0}
.side{background:var(--ey-side);padding:10px 8px;font-size:9px;color:var(--ey-muted)}
.main{padding:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tile{height:64px;border-radius:7px;padding:8px;display:flex;align-items:flex-end;font-size:11px;font-weight:650;background:linear-gradient(160deg,rgba(0,0,0,.3),rgba(0,0,0,.6)),#3a1a6a}
.svcs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.svc{background:var(--ey-card);border:1px solid var(--ey-line);border-radius:8px;padding:8px;font-size:11px}
.svc button{margin-top:6px;font-size:8px;padding:3px 7px;background:rgba(255,255,255,.08);color:#fff;border:0;border-radius:4px}
.wb{display:grid;grid-template-columns:1.15fr .85fr;flex:1;min-height:0}
.wb-l{padding:10px 12px}.wb-r{padding:10px;background:var(--ey-side);border-left:1px solid var(--ey-line)}
.fld{margin-bottom:8px}.fld label{display:block;font-size:8px;color:var(--ey-muted);margin-bottom:2px}
.box{height:22px;border:1px solid var(--ey-line);background:var(--ey-surface);padding:0 8px;display:flex;align-items:center;font-size:10px}
.box.drop{border-color:var(--ey-bad)}
.flag{display:inline-block;margin-top:4px;font-size:8px;font-weight:700;color:#111;background:#FFE600;padding:2px 6px;border-radius:100px;opacity:0}
.flag.on{opacity:1}
.order{border:1px solid var(--ey-line);background:var(--ey-card);padding:10px;border-radius:8px;font-size:10px}
.order b{color:var(--ey-gold)}
.cursor{position:absolute;z-index:20;pointer-events:none;opacity:0;transition:left .8s cubic-bezier(.34,1.32,.64,1),top .8s cubic-bezier(.34,1.32,.64,1),opacity .2s}
.cursor.on{opacity:1}
.cursor em{display:block;font-style:normal;font-size:8px;font-weight:700;background:#FFE600;color:#111;padding:2px 6px;margin-bottom:2px;white-space:nowrap}
.cursor i{display:block;width:0;height:0;border:6px solid transparent;border-top-color:#fff;margin-left:3px}
</style></head>
<body>
<div class="stage" id="stage"></div>
<div class="cursor" id="c1"><em id="lab">user 1</em><i></i></div>
<script>
(function(){
  var stage=document.getElementById('stage'),c1=document.getElementById('c1'),lab=document.getElementById('lab'),timers=[];
  function after(ms,fn){timers.push(setTimeout(fn,ms))}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop')timers.forEach(clearTimeout)});
  function place(el,name){
    if(!el) return;
    if(name) lab.textContent=name;
    var r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
    c1.style.left=(r.left-s.left+8)+'px'; c1.style.top=(r.top-s.top-18)+'px'; c1.classList.add('on');
  }
  function show(html,url){
    c1.classList.remove('on');
    stage.innerHTML='<div class="ey-browser"><div class="ey-bbar"><div class="ey-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="ey-addr">'+url+'</div></div>'+html+'</div>';
  }
  var NAV='<div class="nav"><span>Overview</span><span class="on">Marketplace</span><span>Tools</span></div>';
  var home='<div class="app">'+NAV+'<div class="hero"><h2>Unlock technology at speed and scale</h2><button class="btn" id="go" type="button">Explore Catalog</button></div></div>';
  var cat='<div class="app">'+NAV+'<div class="cat"><div class="side">Catalog</div><div class="main"><div class="tiles"><div class="tile" id="go">Services</div><div class="tile">Licenses</div><div class="tile">Kits</div></div></div></div></div>';
  var svc='<div class="app">'+NAV+'<div class="cat"><div class="side">Services</div><div class="main"><div class="svcs"><div class="svc">Cluster</div><div class="svc">Workbench<br><button type="button" id="go">Get started</button></div></div></div></div></div>';
  var form='<div class="app">'+NAV+'<div class="wb"><div class="wb-l"><h3 style="margin:0 0 8px">Workbench</h3><div class="fld"><label>Instance name</label><div class="box" id="f1">Enter a name…</div><div class="flag" id="d1">user 1 · drop-off</div></div><div class="fld"><label>Location</label><div class="box" id="f2">Region West 2</div><div class="flag" id="d2">user 2 · drop-off</div></div><div class="fld"><label>Required service</label><div class="box" id="f3">Select a service…</div><div class="flag" id="d3">user 3 · drop-off</div></div></div><div class="wb-r"><div class="order">Your order<br><b>$0 / mo</b></div></div></div></div>';
  function play(){
    show(home,'platform / overview');
    after(400,function(){ place(document.getElementById('go')); after(700,function(){
      show(cat,'platform / catalog');
      after(350,function(){ place(document.getElementById('go')); after(700,function(){
        show(svc,'platform / services');
        after(350,function(){ place(document.getElementById('go')); after(700,function(){
          show(form,'platform / workbench');
          after(400,function(){
            var a=document.getElementById('f1'),b=document.getElementById('f2'),c=document.getElementById('f3');
            place(a,'user 1');
            after(900,function(){ a.classList.add('drop'); document.getElementById('d1').classList.add('on'); place(b,'user 2'); });
            after(1800,function(){ b.classList.add('drop'); document.getElementById('d2').classList.add('on'); place(c,'user 3'); });
            after(2700,function(){ c.classList.add('drop'); document.getElementById('d3').classList.add('on'); });
          });
        }); });
      }); });
    }); });
  }
  play();
})();
</script>
</body></html>
