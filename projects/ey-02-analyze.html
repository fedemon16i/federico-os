<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EY · 02 Analyze</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f2f0ec;font-family:'IBM Plex Sans',system-ui,sans-serif}
:root{--accent:#c9a227;--on-accent:#1a1508;--bad:#e0857f;--spring:cubic-bezier(.34,1.32,.64,1)}
.stage{position:relative;width:100%;min-height:360px;border-radius:10px;overflow:hidden;background:#08080c}
.app{height:360px;display:flex;flex-direction:column;background:#08080c}
.fab-topnav{height:26px;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.08);font-size:9px;color:rgba(255,255,255,.42);background:#0e0e12}
.fab-topnav .brand{color:#fff;font-weight:700}.fab-topnav .ai{margin-left:auto;font-size:8px;padding:2px 6px;border-radius:100px;border:1px solid rgba(255,255,255,.12)}
.fab-hero{padding:12px;background:radial-gradient(ellipse at 85% 30%,rgba(255,120,40,.35),transparent 45%),radial-gradient(ellipse at 70% 80%,rgba(80,120,255,.25),transparent 50%),#050508}
.fab-hero .eyebrow{font-size:9px;color:rgba(255,255,255,.45);margin-bottom:4px}
.fab-hero h2{margin:0 0 4px;font-size:13px;font-weight:700;max-width:78%}
.fab-hero p{margin:0 0 8px;font-size:9px;color:rgba(255,255,255,.45);max-width:78%}
.fab-hero .btns{display:flex;gap:6px}
.btn-pri{background:#fff;color:#111;border:0;border-radius:5px;padding:5px 10px;font-size:10px;font-weight:650}
.btn-sec{background:transparent;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:5px 10px;font-size:10px}
.fab-band{margin:6px 10px;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08);font-size:10px}
.cat-layout{display:grid;grid-template-columns:92px 1fr;height:100%;overflow:hidden}
.cat-side{background:#0c0c10;border-right:1px solid rgba(255,255,255,.07);padding:8px 6px;font-size:9px}
.cat-side a{display:flex;justify-content:space-between;padding:5px 6px;border-radius:5px;color:rgba(255,255,255,.4);text-decoration:none}
.cat-side a.on{background:rgba(201,162,39,.12);color:var(--accent)}
.cat-main{padding:8px}.cat-banner{height:40px;border-radius:7px;margin-bottom:5px;background:linear-gradient(110deg,rgba(120,40,180,.45),rgba(40,80,200,.35)),#1a1028;padding:8px 10px}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.svc-grid.three{grid-template-columns:1fr 1fr 1fr}
.svc-card{background:#14141a;border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:7px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s var(--spring)}
.svc-card.on{opacity:1;transform:none}.svc-card.sel{border-color:rgba(201,162,39,.45);background:rgba(201,162,39,.08)}
.svc-card .t{font-size:10px;font-weight:650}.svc-card .s{font-size:8px;color:rgba(255,255,255,.38)}
.svc-card .acts button{height:20px;border-radius:4px;font-size:8.5px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.55)}
.svc-card .acts button.pri{background:rgba(255,255,255,.08);color:#fff}
.wb-layout{display:grid;grid-template-columns:1.15fr .85fr;height:100%}
.wb-left{padding:8px 10px;border-right:1px solid rgba(255,255,255,.07)}
.wb-right{padding:8px;background:#0c0c10}
.wb-field .box{height:22px;border-radius:5px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.28);padding:0 8px;display:flex;align-items:center;font-size:9.5px}
.wb-field .box.ph{color:rgba(255,255,255,.28)}.wb-field .box.bad{border-color:var(--bad)}
.drop-flag{display:inline-flex;margin-top:4px;font-size:9px;color:var(--bad);background:rgba(224,133,127,.12);border:1px solid rgba(224,133,127,.35);padding:3px 7px;border-radius:100px;opacity:0}.drop-flag.on{opacity:1}
.funnel{display:flex;flex-direction:column;justify-content:center;padding:16px 20px;height:360px}
.funnel-note{font-size:12px;color:#ffb4a8;margin-bottom:12px;opacity:0}
.fstep{display:flex;align-items:center;height:0;margin:0 auto 6px;border-radius:5px;background:rgba(255,255,255,.06);font-size:11px;padding:0 10px;overflow:hidden;opacity:0;transition:height .5s,width .55s,opacity .35s;width:20%}
.fstep.show{height:26px;opacity:1}.fstep.dead{background:rgba(224,85,127,.2);color:#ff8aa3}
.cursor{position:absolute;z-index:50;pointer-events:none;opacity:0;width:16px;height:16px;transition:left .9s var(--spring),top .9s var(--spring),opacity .2s}
.cursor.show{opacity:1}.cursor.click{transform:scale(.88)}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="cursor" id="c1"><svg viewBox="0 0 18 18"><path d="M2 2 L2 14 L6.2 10.4 L9.6 16.2 L11.4 15.3 L8 9.4 L14 9.4 Z" fill="#fff"/></svg></div>
<script>
(function(){
  var stage=document.getElementById('stage'), c1=document.getElementById('c1');
  function after(ms,fn){ return setTimeout(fn,ms); }
  function el(id){ return document.getElementById(id); }
  function hideCur(){ c1.classList.remove('show','click'); }
  function place(target,ox,oy){
    if(!target) return;
    var r=target.getBoundingClientRect(), s=stage.getBoundingClientRect();
    c1.style.left=(r.left-s.left+(ox||8))+'px';
    c1.style.top=(r.top-s.top+(oy||8))+'px';
    c1.classList.add('show');
  }
  function clickCur(cb){ after(500, function(){ c1.classList.add('click'); after(280, function(){ c1.classList.remove('click'); if(cb) cb(); }); }); }
  function show(html){ stage.innerHTML=html; hideCur(); }
  var home='<div class="app"><div class="fab-topnav"><span class="brand">◆ Platform</span><span>Overview</span><span>Marketplace</span><span class="ai">Search</span></div><div class="fab-hero"><div class="eyebrow">Unlock technology at speed and scale</div><h2>Platform catalog for shared delivery</h2><p>Reusable components and a shared catalog for teams and clients.</p><div class="btns"><button class="btn-pri" id="exploreCta" type="button">Explore Catalog</button><button class="btn-sec" type="button">Contact</button></div></div><div class="fab-band"><h4>Developer workflow</h4><p>Build and deploy into the shared container platform.</p></div></div>';
  var catalog='<div class="app" style="background:#0a0a0e"><div class="fab-topnav"><span class="brand">◆ Platform</span><span>Marketplace</span><span class="ai">Search</span></div><div class="cat-layout"><div class="cat-side"><div class="sh">Catalog</div><a class="on" href="#"><span>All</span><span>320</span></a><a href="#"><span>Services</span><span>150</span></a><a href="#"><span>Licenses</span><span>20</span></a></div><div class="cat-main"><div style="font-size:11px;font-weight:700">Explore the catalog</div><div class="svc-grid three"><div class="svc-card on" id="catSvc"><div class="t">Services</div><div class="s">Compute, networking</div></div><div class="svc-card on"><div class="t">Licenses</div><div class="s">Delivery rights</div></div><div class="svc-card on"><div class="t">Starter Kits</div><div class="s">Start faster</div></div><div class="svc-card on"><div class="t">Packages</div><div class="s">Reusable code</div></div><div class="svc-card on"><div class="t">APIs</div><div class="s">Platform blocks</div></div><div class="svc-card on"><div class="t">Explore</div><div class="s">All layers</div></div></div></div></div></div>';
  var services='<div class="app" style="background:#0a0a0e"><div class="fab-topnav"><span class="brand">◆ Platform</span><span>Marketplace</span><span class="ai">Services</span></div><div class="cat-layout"><div class="cat-side"><a href="#"><span>All</span></a><a class="on" href="#"><span>Services</span></a></div><div class="cat-main"><div class="cat-banner"><div class="t">Services</div><div class="s">Shared infrastructure offerings</div></div><div class="svc-grid"><div class="svc-card" id="sv0"><div class="t">Cluster service</div><div class="acts"><button type="button">View</button><button class="pri" type="button">Start</button></div></div><div class="svc-card" id="sv1"><div class="t">Automation seat</div><div class="acts"><button type="button">View</button><button class="pri" type="button">Start</button></div></div><div class="svc-card" id="sv2"><div class="t">Workflow · Prod</div><div class="acts"><button type="button">View</button><button class="pri" type="button">Start</button></div></div><div class="svc-card" id="sv3"><div class="t">Workbench</div><div class="acts"><button type="button">View</button><button class="pri" id="getStart" type="button">Start</button></div></div></div></div></div></div>';
  var form='<div class="app" style="background:#0a0a0e"><div class="fab-topnav"><span class="brand">◆ Platform</span><span>Marketplace</span><span class="ai">Workbench</span></div><div class="wb-layout"><div class="wb-left"><div class="wb-crumb">Catalog › Services › Workbench</div><h3>Workbench</h3><div class="wb-field"><label>Instance name (required)</label><div class="box ph" id="fName">Enter a name…</div></div><div class="wb-field"><label>Location (required)</label><div class="box" id="fLoc">Region West 2</div></div><div class="wb-field"><label>Required service (required)</label><div class="box ph" id="reqFld">Select a service…</div><div class="drop-flag" id="drop">Drop-off · service unclear</div></div></div><div class="wb-right"><div class="wb-disc">Costs are estimates.</div></div></div></div>';
  var funnel='<div class="funnel"><div class="funnel-note" id="funnelNote">Drop-off at <em>Required service</em>.</div><div class="fstep" id="fs0" data-w="100%">Home <span>100%</span></div><div class="fstep" id="fs1" data-w="90%">Catalog <span>90%</span></div><div class="fstep" id="fs2" data-w="74%">Services <span>74%</span></div><div class="fstep" id="fs3" data-w="58%">Workbench <span>58%</span></div><div class="fstep" id="fs4" data-w="22%">Form · required <span>22%</span></div></div>';
  var scene=new URLSearchParams(location.search).get('scene')||'path';
  function playPath(){
    show(home);
    after(400, function(){ place(el('exploreCta'),8,6); clickCur(function(){
      show(catalog);
      after(400, function(){ place(el('catSvc'),8,8); clickCur(function(){
        var c=el('catSvc'); if(c) c.classList.add('sel');
        after(280, function(){
          show(services);
          [0,1,2,3].forEach(function(i){ after(i*55, function(){ var n=el('sv'+i); if(n) n.classList.add('on'); }); });
          after(600, function(){ place(el('getStart'),4,3); clickCur(function(){
            var w=el('sv3'); if(w) w.classList.add('sel');
            after(280, function(){
              show(form);
              after(400, function(){ place(el('fName'),6,5); after(500, function(){
                var n=el('fName'); if(n){ n.textContent='Team workspace'; n.classList.remove('ph'); }
                place(el('reqFld'),6,5);
                after(700, function(){ var f=el('reqFld'); if(f) f.classList.add('bad'); var d=el('drop'); if(d) d.classList.add('on'); hideCur(); });
              }); });
            });
          }); });
        });
      }); });
    }); });
  }
  function playFunnel(){
    show(funnel);
    var note=el('funnelNote'); if(note) after(80, function(){ note.style.opacity='1'; });
    var si=0; (function grow(){ if(si>4) return; var n=el('fs'+si); if(n){ n.classList.add('show'); n.style.width=n.getAttribute('data-w'); if(si===4) n.classList.add('dead'); } si++; after(540, grow); })();
  }
  if(scene==='funnel') playFunnel(); else playPath();
})();
</script>
</body>
</html>
