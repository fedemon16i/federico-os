<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Requester</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
.banner{padding:12px;border-radius:8px;margin-bottom:12px;background:linear-gradient(110deg,#3a1a6a,#120820);color:#fff}
.ov{position:absolute;inset:0;background:rgba(8,10,16,.72);display:flex;align-items:center;justify-content:center;z-index:5}
.sheet{width:72%;background:var(--ey-card);border:1px solid var(--ey-line);border-radius:8px;padding:16px}
.sheet h4{margin:0 0 8px;font-size:16px}.sheet p{margin:0 0 12px;color:var(--ey-muted);font-size:13px}
.dots{display:flex;gap:6px;margin:10px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ey-line);display:block}.dots i.on{background:var(--ey-text)}
.qtip{width:14px;height:14px;border-radius:50%;border:1px solid var(--ey-line);display:grid;place-items:center;font-size:9px}
.onboard{position:absolute;right:16px;bottom:16px;z-index:6}
.winok{position:absolute;inset:0;background:rgba(12,14,20,.92);display:flex;align-items:center;justify-content:center;opacity:0;z-index:8;font-size:18px}.winok.on{opacity:1}
#slot{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
</style></head>
<body>
<div class="stage"><div class="ey-unit window" id="unit"><div class="ey-bbar"><div class="ey-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="ey-addr" id="addr"></div></div><div id="slot"></div></div></div>
<script src="ey-engine.js"></script>
<script src="ey-market.js"></script>
<script src="ey-shell.js"></script>
<script>
(function(){
  var slot=document.getElementById('slot');
  EY.cursors(document.getElementById('unit'),1); EY.fit();
  var STEPS=[
    ['Workspace','Do you already have a workspace for this team?'],
    ['Team','Who owns the request after it is live?'],
    ['Billing','A cost center is required before submit.']
  ];
  function walk(n){
    return '<div class="ov"><div class="sheet"><h4>'+STEPS[n][0]+'</h4><p>'+STEPS[n][1]+'</p><div class="dots"><i class="'+(n===0?'on':'')+'"></i><i class="'+(n===1?'on':'')+'"></i><i class="'+(n===2?'on':'')+'"></i></div><button class="ey-btn" id="wgo" type="button">'+(n<2?'Next':'Start the form')+'</button></div></div>';
  }
  function play(){
    document.getElementById('addr').textContent='marketplace / services';
    slot.innerHTML=EYShell.services({infoFirst:true});
    EY.after(400,function(){ EY.note(document.getElementById('info'),'See details first'); });
    EY.after(1600,function(){
      document.getElementById('main').insertAdjacentHTML('beforeend','<div class="ov"><div class="sheet"><h4>Workbench</h4><p>Description, resources, requirements.</p><button class="ey-btn" id="go" type="button">Get started</button></div></div>');
      EY.note(document.getElementById('go'),'Enter');
    });
    EY.after(3000,function(){
      var tip=document.querySelector('.fm-note'); if(tip) tip.style.display='none';
      slot.innerHTML='<div style="position:relative;flex:1;display:flex;flex-direction:column">'+EYShell.form({helper:true})+walk(0)+'<button class="ey-btn ghost onboard" id="ob" type="button">Onboarding</button></div>';
      EY.note(document.getElementById('wgo'),'Onboarding after the product');
    });
    EY.after(4200,function(){ var ov=slot.querySelector('.ov'); if(ov) ov.outerHTML=walk(1); EY.note(document.getElementById('wgo'),'Team'); });
    EY.after(5400,function(){ var ov=slot.querySelector('.ov'); if(ov) ov.outerHTML=walk(2); EY.note(document.getElementById('wgo'),'Billing'); });
    EY.after(6600,function(){
      var ov=slot.querySelector('.ov'); if(ov) ov.remove();
      var tip=document.querySelector('.fm-note'); if(tip) tip.style.display='none';
      EY.move('u1', document.getElementById('f1'));
    });
    EY.after(8200,function(){
      document.getElementById('addr').textContent='workbench / billing';
      slot.innerHTML=EYShell.billing();
      EY.move('u1', document.getElementById('f1'));
    });
    EY.after(9800,function(){
      document.getElementById('addr').textContent='workbench / confirm';
      slot.innerHTML=EYShell.confirm();
      EY.move('u1', document.getElementById('f1'));
    });
    EY.after(11200,function(){
      slot.insertAdjacentHTML('beforeend','<div class="winok on">Ready</div>');
    });
  }
  play();
})();
</script>
</body></html>
