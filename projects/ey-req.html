<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Requester</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0c10;color:#f3f4f8;font-family:'IBM Plex Sans',system-ui,sans-serif}
:root{--card:#1c1e28;--line:rgba(255,255,255,.08);--or:#e8943a;--gold:#f0de5a;--ok:#7dcea0;--spring:cubic-bezier(.34,1.32,.64,1)}
.stage{position:relative;height:100%}
.br{height:100%;display:flex;flex-direction:column;background:#0b0c10}
.bb{height:20px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#14151c;border-bottom:1px solid var(--line);font-size:8px;color:#9aa0b0;font-family:'IBM Plex Mono',monospace}
.d{display:flex;gap:4px}.d i{width:6px;height:6px;border-radius:50%;display:block}
.d .r{background:#ff5f57}.d .y{background:#febc2e}.d .g{background:#28c840}
.app{flex:1;display:flex;flex-direction:column;background:#12141c;min-height:0}
.nav{height:22px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:8px;color:#9aa0b0;background:#0b0c10;border-bottom:1px solid var(--line)}
.nav .on{color:#fff}
.body{flex:1;padding:8px 10px;position:relative;overflow:hidden}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 8px}
.card .t{font-size:11px;font-weight:650}.reqs{font-size:8px;color:#9aa0b0;margin-top:4px}.reqs b{color:var(--gold)}
.chip{display:inline-block;margin-top:5px;font-size:7px;padding:2px 6px;border:1px solid rgba(232,148,58,.5);color:var(--gold);border-radius:100px}
.ring{outline:2px solid #FFE600;outline-offset:3px;animation:pulse 1.1s ease 3}
@keyframes pulse{50%{outline-color:transparent}}
.call{position:absolute;z-index:6;background:#FFE600;color:#111;font-size:8px;font-weight:700;padding:3px 7px;border-radius:3px;opacity:0;transition:.25s}
.call.on{opacity:1}
.lay{display:grid;grid-template-columns:1fr 112px 100px;gap:7px;height:100%}
.prog{font-family:'IBM Plex Mono',monospace;font-size:7px;color:#6d7384;margin-bottom:5px}.prog b{color:#fff}
h3{margin:0 0 6px;font-size:13px}
.fld label{display:block;font-size:7px;color:#9aa0b0;margin:4px 0 2px}
.box{height:18px;border:1px solid var(--line);background:#161821;padding:0 6px;display:flex;align-items:center;font-size:9px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px;font-size:8px}
.panel h4{margin:0 0 5px;font-size:9px}
.ln{display:flex;justify-content:space-between;margin:3px 0;color:#9aa0b0}
.bub{background:#161821;padding:5px;border-radius:5px;margin:4px 0;color:#9aa0b0}
.bub.me{background:#241c14;color:#f3e6d0}
.win{position:absolute;inset:0;background:rgba(12,14,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s;z-index:8}
.win.on{opacity:1}.win .mk{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:6px}
.cursor{position:absolute;z-index:20;width:14px;height:14px;pointer-events:none;opacity:0;transition:left .75s var(--spring),top .75s var(--spring),opacity .2s}
.cursor.on{opacity:1}
</style></head>
<body>
<div class="stage" id="stage"></div>
<div class="cursor" id="c1"><svg viewBox="0 0 18 18"><path d="M2 2 L2 14 L6.2 10.4 L9.6 16.2 L11.4 15.3 L8 9.4 L14 9.4 Z" fill="#fff"/></svg></div>
<script>
(function(){
  var stage=document.getElementById('stage'),c1=document.getElementById('c1'),timers=[];
  function after(ms,fn){timers.push(setTimeout(fn,ms))}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop')timers.forEach(clearTimeout)});
  function place(t){if(!t)return;var r=t.getBoundingClientRect(),s=stage.getBoundingClientRect();c1.style.left=(r.left-s.left+6)+'px';c1.style.top=(r.top-s.top+4)+'px';c1.classList.add('on')}
  function chrome(addr,html){stage.innerHTML='<div class="br"><div class="bb"><div class="d"><i class="r"></i><i class="y"></i><i class="g"></i></div>'+addr+'</div><div class="app"><div class="nav"><span>Overview</span><span class="on">Marketplace</span></div><div class="body" id="bd">'+html+'</div></div></div>';c1.classList.remove('on')}
  function mark(sel,label,x,y){
    var el=document.querySelector(sel); if(!el) return;
    el.classList.add('ring');
    var c=document.createElement('div'); c.className='call on'; c.textContent=label;
    c.style.left=(x||16)+'px'; c.style.top=(y||70)+'px';
    document.getElementById('bd').appendChild(c);
    place(el);
  }
  function playEnter(){
    chrome('marketplace','<div class="grid"><div class="card" id="hit"><div class="t">Workbench workspace</div><div class="reqs"><b>Requires</b> name · service · billing</div><span class="chip">Requirements</span></div><div class="card"><div class="t">Cluster service</div><div class="reqs"><b>Requires</b> quota</div><span class="chip">Requirements</span></div><div class="card"><div class="t">Automation seat</div><div class="reqs"><b>Requires</b> owner</div><span class="chip">Requirements</span></div><div class="card"><div class="t">Starter kit</div><div class="reqs"><b>Requires</b> team</div><span class="chip">Requirements</span></div></div>');
    after(400,function(){ mark('#hit','NEW · requirements on the card',16,62); });
    after(2000,function(){
      chrome('product','<div class="lay"><div><h3>Workbench workspace</h3><div class="reqs">Same lines as the card. Chat and guide stay on this screen.</div></div><div class="panel" id="ord"><h4>Your order</h4><div class="ln"><span>Item</span><span>Workbench</span></div></div><div><div class="panel" id="ob"><h4>Onboarding</h4>Workspace → Team → Billing</div><div class="panel" id="ch" style="margin-top:6px"><h4>Ask</h4><div class="bub">What is required?</div></div></div></div>');
      after(300,function(){ mark('#ord','NEW · order rail',200,40); });
      after(1400,function(){ mark('#ob','NEW · guide',320,40); });
      after(2400,function(){ mark('#ch','NEW · chat',320,120); });
    });
  }
  function playPedir(){
    chrome('customize','<div class="lay"><div><div class="prog">Step <b>1</b> · Customize</div><h3>Customize</h3><div class="fld"><label>Name</label><div class="box">North studio</div></div><div class="fld"><label>Purpose</label><div class="box">Shared delivery</div></div><div class="fld"><label>Owner</label><div class="box" id="hit">a.rivas</div></div></div><div class="panel"><h4>Your order</h4><div class="ln"><span>Item</span><span>Workbench</span></div></div><div><div class="panel ring"><h4>Onboarding</h4>Still on Customize</div><div class="panel" style="margin-top:6px"><h4>Ask</h4><div class="bub me">Service attaches on Configure.</div></div></div></div><div class="win" id="win"><div class="mk">✓</div><div>Configure unlocked</div></div>');
    after(400,function(){ mark('#hit','Fill Customize first',18,120); });
    after(1800,function(){
      document.getElementById('win').classList.add('on');
      after(1100,function(){
        document.getElementById('win').classList.remove('on');
        chrome('configure','<div class="lay"><div><div class="prog">Step <b>2</b> · Configure · the win</div><h3>Configure</h3><div class="fld"><label>Bots</label><div class="box">4</div></div><div class="fld"><label>Environments</label><div class="box">dev + prod</div></div><div class="fld"><label>Workspace</label><div class="box" id="hit">Create North studio</div></div></div><div class="panel"><h4>Your order</h4><div class="ln"><span>Bots</span><span>4</span></div></div><div class="panel ring"><h4>Onboarding</h4>Workspace is created on this step</div></div>');
        after(300,function(){ mark('#hit','NEW · workspace lives here',18,130); });
      });
    });
  }
  var scene=new URLSearchParams(location.search).get('scene');
  if(scene==='pedir') playPedir(); else playEnter();
})();
</script>
</body></html>
