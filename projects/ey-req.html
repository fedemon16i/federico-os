<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Requester</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
.nav .right{margin-left:auto;display:flex;gap:8px}
.nav .search{width:160px;height:22px;border:1px solid var(--ey-line);border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;color:var(--ey-muted)}
.cat{display:grid;grid-template-columns:110px 1fr;flex:1;min-height:0}
.side{background:var(--ey-side);padding:10px 8px;font-size:9px;border-right:1px solid var(--ey-line)}
.main{padding:10px;position:relative;overflow:hidden}
.banner{padding:8px 10px;border-radius:7px;margin-bottom:7px;background:linear-gradient(110deg,#6b2bb8,#2a1048);color:#fff}
.svc .t{font-size:10px;font-weight:650}.svc .desc{font-size:8px;color:var(--ey-muted)}.svc .meta{font-size:7.5px;color:var(--ey-faint)}
.ov,.walk{position:absolute;inset:0;background:rgba(8,10,16,.72);display:flex;align-items:center;justify-content:center;z-index:5}
.sheet{width:82%;background:var(--ey-card);border:1px solid var(--ey-line);border-radius:8px;padding:12px}
.go{margin-top:10px;background:var(--ey-btn);color:var(--ey-btn-ink);border:0;border-radius:4px;padding:6px 10px}
.wb{display:grid;grid-template-columns:1fr 220px;flex:1}
.wb-r{padding:8px;background:var(--ey-side);border-left:1px solid var(--ey-line)}
.panel{border:1px solid var(--ey-line);background:var(--ey-card);border-radius:8px;padding:7px;font-size:8px;color:var(--ey-muted);margin-bottom:6px}
.panel h4{margin:0 0 4px;color:var(--ey-text)}
.box{height:20px;border:1px solid var(--ey-line);background:var(--ey-surface);padding:0 8px;display:flex;align-items:center;font-size:9px;margin-bottom:6px}
.winok{position:absolute;inset:0;background:rgba(12,14,20,.92);display:flex;align-items:center;justify-content:center;opacity:0;z-index:8}
.winok.on{opacity:1}
#slot{flex:1;min-height:0;display:flex;flex-direction:column}
</style></head>
<body>
<div class="stage"><div class="ey-unit window" id="unit"><div class="ey-bbar"><div class="ey-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="ey-addr" id="addr"></div></div><div id="slot"></div></div></div>
<script src="ey-engine.js"></script>
<script src="ey-market.js"></script>
<script>
(function(){
  var slot=document.getElementById('slot'), timers=[];
  EY.cursors(document.getElementById('unit'),1); EY.fit();
  function after(ms,fn){timers.push(setTimeout(fn,ms))}
  function mark(el,label){ if(EY.note) EY.note(el,label); }
  var NAV='<div class="nav"><span class="on">Marketplace</span><span>Tools</span><div class="right"><div class="search">Search</div><span class="ai">AI</span></div></div>';
  function market(){
    return '<div class="app">'+NAV+'<div class="cat"><div class="side"><div class="sh">Catalog</div><div>All 284</div><div>Services 118</div></div><div class="main" id="main"><div class="banner">Services · shared infrastructure</div>'+EYMarket.grid({infoFirst:true})+'</div></div></div>';
  }
  function playEnter(){
    document.getElementById('addr').textContent='marketplace';
    slot.innerHTML='<div class="app" style="position:relative">'+NAV+'<div class="walk"><div class="sheet"><h4>Before you request</h4><p>Requirements live on the card. Help stays open once you start.</p><button class="go" id="wgo" type="button">Continue</button></div></div></div>';
    after(300,function(){ mark(document.getElementById('wgo'),'Walkthrough first'); });
    after(1600,function(){
      slot.innerHTML=market();
      after(300,function(){ mark(document.getElementById('info'),'Details + brand on the card'); });
      after(1600,function(){
        document.getElementById('main').insertAdjacentHTML('beforeend','<div class="ov"><div class="sheet"><h4>Workbench workspace</h4><p>Requirements: name, one service, billing.</p><button class="go" id="go" type="button">Get started</button></div></div>');
        mark(document.getElementById('go'),'Then they enter the product');
        after(1600, runForm);
      });
    });
  }
  function rail(){
    return '<div class="panel"><h4>Your order</h4>Workbench · Copilot · $0</div><div class="panel"><h4>Helper</h4>Billing account is the cost center. Always here.</div><div class="panel"><h4>Onboarding</h4>Requirements seen.</div>';
  }
  function runForm(){
    var tip=document.querySelector('.fm-note'); if(tip) tip.style.display='none';
    slot.innerHTML='<div class="app" style="position:relative">'+NAV+'<div class="wb"><div class="wb-l"><h3>Configure</h3><div class="box" id="hit">North studio</div><div class="ey-radio on"><i></i> Workbench</div><div class="ey-radio"><i></i> Cluster</div></div><div class="wb-r">'+rail()+'</div></div><div class="winok" id="winok">Ready</div></div>';
    after(200,function(){ EY.move('u1', document.getElementById('hit')); });
    after(2800,function(){ var o=document.getElementById('winok'); if(o) o.classList.add('on'); });
  }
  playEnter();
})();
</script>
</body></html>
