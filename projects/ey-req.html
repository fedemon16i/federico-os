<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Requester</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
.banner{padding:12px;border-radius:8px;margin-bottom:12px;background:linear-gradient(110deg,#3a1a6a,#120820);color:#fff}
.walk,.ov{position:absolute;inset:0;background:rgba(8,10,16,.72);display:flex;align-items:center;justify-content:center;z-index:5}
.sheet{width:70%;background:var(--ey-card);border:1px solid var(--ey-line);border-radius:8px;padding:16px}
.sheet h4{margin:0 0 8px;font-size:16px}
.dots{display:flex;gap:6px;margin:10px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ey-line);display:block}.dots i.on{background:var(--ey-text)}
.qtip{width:14px;height:14px;border-radius:50%;border:1px solid var(--ey-line);display:grid;place-items:center;font-size:9px}
.winok{position:absolute;inset:0;background:rgba(12,14,20,.92);display:flex;align-items:center;justify-content:center;opacity:0;z-index:8;font-size:18px}.winok.on{opacity:1}
#slot{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
</style></head>
<body>
<div class="stage"><div class="ey-unit window" id="unit"><div class="ey-bbar"><div class="ey-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="ey-addr" id="addr"></div></div><div id="slot"></div></div></div>
<script src="ey-engine.js"></script>
<script src="ey-market.js"></script>
<script src="ey-shell.js"></script>
<script>
(function(){
  var slot=document.getElementById('slot');
  EY.cursors(document.getElementById('unit'),1); EY.fit();
  var STEPS=[
    ['1 · Requirements on the card','See details before Get started.'],
    ['2 · Help stays open','Order and helper stay in the rail.'],
    ['3 · Then the form','Same Workbench form. Helper on.']
  ];
  function walk(n){
    return '<div class="app" style="position:relative">'+EYShell.nav()+'<div class="walk"><div class="sheet"><h4>'+STEPS[n][0]+'</h4><p>'+STEPS[n][1]+'</p><div class="dots"><i class="'+(n===0?'on':'')+'"></i><i class="'+(n===1?'on':'')+'"></i><i class="'+(n===2?'on':'')+'"></i></div><button class="ey-btn" id="wgo" type="button">'+(n<2?'Next':'See the catalog')+'</button></div></div></div>';
  }
  function play(){
    document.getElementById('addr').textContent='marketplace';
    slot.innerHTML=walk(0);
    EY.after(200,function(){ EY.note(document.getElementById('wgo'),'Walkthrough'); });
    EY.after(1200,function(){ slot.innerHTML=walk(1); EY.note(document.getElementById('wgo'),'Help stays'); });
    EY.after(2300,function(){ slot.innerHTML=walk(2); EY.note(document.getElementById('wgo'),'Then the form'); });
    EY.after(3600,function(){
      slot.innerHTML=EYShell.services({infoFirst:true});
      EY.after(300,function(){ EY.note(document.getElementById('info'),'Details on the card'); });
      EY.after(1800,function(){
        document.getElementById('main').insertAdjacentHTML('beforeend','<div class="ov"><div class="sheet"><h4>Workbench</h4><p>Same product. Helper stays on the right.</p><button class="ey-btn" id="go" type="button">Get started</button></div></div>');
        EY.note(document.getElementById('go'),'Enter');
        EY.after(1600, function(){
          var tip=document.querySelector('.fm-note'); if(tip) tip.style.display='none';
          slot.innerHTML='<div style="position:relative;flex:1;display:flex;flex-direction:column">'+EYShell.form({helper:true})+'<div class="winok" id="winok">Ready</div></div>';
          EY.after(200,function(){ EY.move('u1', document.getElementById('f1')); });
          EY.after(2800,function(){ var o=document.getElementById('winok'); if(o) o.classList.add('on'); });
        });
      });
    });
  }
  play();
})();
</script>
</body></html>
