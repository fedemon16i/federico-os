<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Requester</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
.nav .right{margin-left:auto}
.nav .search{width:120px;height:16px;border-radius:4px;background:rgba(255,255,255,.05);font-size:8px;color:var(--ey-faint);display:flex;align-items:center;padding:0 7px}
.cat{display:grid;grid-template-columns:110px 1fr;flex:1;min-height:0}
.side{background:var(--ey-side);border-right:1px solid var(--ey-line);padding:10px 8px;font-size:9px;color:var(--ey-muted)}
.side .sh{font-weight:700;color:#fff;margin-bottom:8px}
.main{padding:10px 12px;position:relative;overflow:hidden}
.tools .q{height:20px;border:1px solid var(--ey-line);background:var(--ey-surface);border-radius:5px;font-size:8px;color:var(--ey-faint);display:flex;align-items:center;padding:0 8px;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{background:var(--ey-card);border:1px solid var(--ey-line);border-radius:8px;padding:8px}
.card .t{font-size:11px;font-weight:650}.card .m{font-size:8px;color:var(--ey-faint);margin:3px 0 6px}
.acts{display:flex;gap:5px}
.acts button{flex:1;height:18px;border-radius:4px;font-size:7.5px;border:1px solid var(--ey-line);background:transparent;color:#d8dbe4}
.acts button.pri{background:rgba(255,255,255,.08);color:#fff}
.acts button.info{border-color:var(--ey-new);color:#ffb4b4}
.ov{position:absolute;inset:0;background:rgba(8,10,16,.72);display:flex;align-items:center;justify-content:center;z-index:5}
.sheet{width:82%;background:var(--ey-card);border:1px solid var(--ey-line);border-radius:8px;padding:12px;position:relative}
.x{position:absolute;top:8px;right:10px;font-size:11px;color:var(--ey-muted)}
.sheet h4{margin:0 0 8px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs i{font-style:normal;font-size:8px;padding:3px 8px;border:1px solid var(--ey-line);border-radius:100px;color:var(--ey-muted)}
.tabs i.on{color:#fff;border-color:#e8943a}
.sec{font-size:9px;color:var(--ey-muted);line-height:1.45;min-height:48px}.sec b{color:#fff;display:block;margin:6px 0 2px}
.sheet .go{margin-top:10px;background:#fff;color:#111;border:0;border-radius:4px;padding:6px 10px;font-size:9px;font-weight:650}
.wb{display:grid;grid-template-columns:1.1fr .9fr;flex:1;min-height:0}
.wb-l{padding:10px 12px}.wb-r{padding:10px;background:var(--ey-side);border-left:1px solid var(--ey-line);display:flex;flex-direction:column;gap:7px}
.fld label{display:block;font-size:8px;color:var(--ey-muted);margin:5px 0 2px}
.box{height:20px;border:1px solid var(--ey-line);background:var(--ey-surface);padding:0 8px;display:flex;align-items:center;font-size:9px}
.order,.help,.ob{border:1px solid var(--ey-line);background:var(--ey-card);border-radius:8px;padding:8px;font-size:8px}
.order h4,.help h4,.ob h4{margin:0 0 5px;font-size:10px}
.ln{display:flex;justify-content:space-between;margin:3px 0;color:var(--ey-muted)}
.chat{position:absolute;right:18px;bottom:16px;width:22px;height:22px;border-radius:50%;background:#e8943a;color:#111;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:6}
.winok{position:absolute;inset:0;background:rgba(12,14,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s;z-index:8}
.winok.on{opacity:1}.winok .mk{width:30px;height:30px;border-radius:50%;background:var(--ey-ok);color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:6px}
#slot{flex:1;min-height:0;display:flex;flex-direction:column}
.uc img{width:18px;height:18px;display:block}
</style></head>
<body>
<div class="stage" id="stage">
  <div class="ey-browser" id="win">
    <div class="ey-bbar"><div class="ey-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="ey-addr" id="addr"></div></div>
    <div id="slot"></div>
    <div class="uc" id="c1"><img src="ey-cursor.svg" width="18" height="18" alt=""></div>
  </div>
  <div class="callout left" id="co" style="display:none"></div>
</div>
<script>
(function(){
  var slot=document.getElementById('slot'), win=document.getElementById('win'), co=document.getElementById('co'), timers=[];
  function after(ms,fn){timers.push(setTimeout(fn,ms))}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop')timers.forEach(clearTimeout)});
  function move(el){
    var n=document.getElementById('c1'); if(!n||!el) return;
    var r=el.getBoundingClientRect(), b=win.getBoundingClientRect();
    n.style.left=Math.max(8,Math.min(b.width-18,r.left-b.left+6))+'px';
    n.style.top=Math.max(22,Math.min(b.height-18,r.top-b.top+4))+'px';
  }
  function mark(el,label,side){
    if(el) el.classList.add('ring');
    var st=document.getElementById('stage').getBoundingClientRect();
    co.style.display='block'; co.textContent=label;
    if(side==='left'){ co.className='callout left'; co.style.left='4px'; }
    else { co.className='callout right'; co.style.right='4px'; co.style.left='auto'; }
    if(el){ var r=el.getBoundingClientRect(); co.style.top=Math.max(4,r.top-st.top-2)+'px'; }
    move(el);
  }
  var NAV='<div class="nav"><span>Overview</span><span class="on">Marketplace</span><span>Tools</span><div class="right"><div class="search">Search products…</div></div></div>';
  var SIDE='<div class="side"><div class="sh">Catalog</div><div>All</div><div>Services</div><div>Licenses</div><div>Kits</div></div>';
  function market(){
    return '<div class="app">'+NAV+'<div class="cat">'+SIDE+'<div class="main" id="main"><div class="tools"><div class="q">Filter by layer…</div></div><div class="grid"><div class="card"><div class="t">Workbench workspace</div><div class="m">Shared delivery</div><div class="acts"><button class="pri" type="button">Get started</button><button class="info" id="info" type="button">See details</button></div></div><div class="card"><div class="t">Cluster service</div><div class="m">Compute</div><div class="acts"><button class="pri" type="button">Get started</button><button class="info" type="button">See details</button></div></div><div class="card"><div class="t">Automation seat</div><div class="m">License</div><div class="acts"><button class="pri" type="button">Get started</button><button class="info" type="button">See details</button></div></div><div class="card"><div class="t">Starter kit</div><div class="m">Enablement</div><div class="acts"><button class="pri" type="button">Get started</button><button class="info" type="button">See details</button></div></div></div></div></div></div>';
  }
  function overlay(){
    var main=document.getElementById('main'); if(!main) return;
    main.insertAdjacentHTML('beforeend','<div class="ov" id="ov"><div class="sheet"><div class="x" id="x">×</div><h4>Workbench workspace</h4><div class="tabs"><i>Description</i><i>Resources</i><i id="tabR">Requirements</i></div><div class="sec" id="sec"><b>Description</b>Shared delivery workspace for a team.</div><button class="go" id="go" type="button">Get started</button></div></div>');
  }
  function playEnter(){
    document.getElementById('addr').textContent='marketplace';
    slot.innerHTML=market();
    after(400,function(){ mark(document.getElementById('info'),'NEW · details + requirements','left'); });
    after(1600,function(){
      overlay();
      after(200,function(){ mark(document.getElementById('tabR'),'Tabs: Description · Resources · Requirements','left'); });
      after(1400,function(){
        document.getElementById('tabR').classList.add('on');
        document.getElementById('sec').innerHTML='<b>Requirements</b>Workspace name. One required service. Billing account.<b>Links</b>Setup guide · Field glossary';
        mark(document.getElementById('go'),'NEW · Get started from here','right');
      });
    });
  }
  function playPedir(){
    document.getElementById('addr').textContent='marketplace / details';
    slot.innerHTML=market();
    overlay();
    document.getElementById('tabR').classList.add('on');
    document.getElementById('sec').innerHTML='<b>Requirements</b>Workspace name. One required service. Billing account.';
    after(300,function(){ mark(document.getElementById('go'),'Get started · opens the form','right'); });
    after(1400,function(){ runForm(); });
  }
  function runForm(){
    co.style.display='none';
    function form(step,left){
      slot.innerHTML='<div class="app" style="position:relative">'+NAV+'<div class="wb"><div class="wb-l"><div style="font-size:8px;color:#6d7384;margin-bottom:6px">Step <b style="color:#fff">'+step+'</b></div>'+left+'</div><div class="wb-r"><div class="order"><h4>Your order</h4><div class="ln"><span>Item</span><span>Workbench</span></div></div><div class="help ring"><h4>Help / Requirements</h4>Name · required service · billing</div><div class="ob"><h4>Onboarding</h4>Requirements seen</div></div></div><div class="chat ring" id="chat">…</div><div class="winok" id="winok"><div class="mk">✓</div><div>Ready for workspace</div></div></div>';
    }
    form('Onboarding','<h3 style="margin:0 0 8px;font-size:14px">Before the form</h3><div class="box" id="q1">Did you read the requirements?</div>');
    after(200,function(){ mark(document.getElementById('q1'),'Onboard check','left'); });
    after(1400,function(){
      form('1 · Identify','<h3 style="margin:0 0 8px;font-size:14px">Name the instance</h3><div class="fld"><label>Display name</label><div class="box" id="hit">North studio</div></div><div class="fld"><label>Purpose</label><div class="box">Shared delivery</div></div><div class="fld"><label>Owner</label><div class="box">a.rivas</div></div>');
      after(80,function(){ move(document.getElementById('hit')); co.style.display='none'; });
    });
    after(2800,function(){
      form('2 · Technical','<h3 style="margin:0 0 8px;font-size:14px">Customize technically</h3><div class="fld"><label>Repo</label><div class="box" id="hit">platform/north</div></div><div class="fld"><label>License</label><div class="box">Shared compute</div></div><div class="fld"><label>Region</label><div class="box">West 2</div></div>');
      after(80,function(){ move(document.getElementById('hit')); });
    });
    after(4200,function(){
      document.getElementById('winok').classList.add('on');
      after(1100,function(){
        document.getElementById('winok').classList.remove('on');
        form('3 · Workspace','<h3 style="margin:0 0 8px;font-size:14px">Workspace and terms</h3><div class="fld"><label>Workspace</label><div class="box">Create North studio</div></div><div class="fld"><label>Team</label><div class="box">Platform</div></div><div class="fld"><label>Billing</label><div class="box">AC-4412</div></div><div class="box">Accept terms</div>');
      });
    });
  }
  var scene=new URLSearchParams(location.search).get('scene');
  if(scene==='pedir') playPedir(); else playEnter();
})();
</script>
</body></html>
