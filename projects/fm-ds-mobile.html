<!DOCTYPE html>
<html lang="en" data-skin="chek"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DS Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="fm-ds.css"/>
<style>
.stage-pad{height:100%;display:flex;align-items:center;justify-content:center}
.iphone .body h2{margin:4px 0 6px;font-size:20px}
.iphone .body p{margin:0 0 12px;font-size:12px;color:var(--fm-muted);line-height:1.4}
.stack{display:flex;flex-direction:column;gap:8px}
</style></head>
<body>
<div class="stage">
  <div class="fm-unit" id="unit">
    <div class="stage-pad">
      <div class="iphone" id="ph">
        <div class="sb">
          <div class="t">9:41</div>
          <div class="island"></div>
          <div class="sys">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="4.5" y="5" width="3" height="7" rx="0.6"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.6"/><rect x="13.5" y="0" width="3" height="12" rx="0.6" opacity=".35"/></svg>
            <svg width="15" height="12" viewBox="0 0 15 12" fill="#fff"><path d="M7.5 2.2c2.1 0 4 0.8 5.4 2.2l-1.1 1.1A5.6 5.6 0 0 0 7.5 4.1 5.6 5.6 0 0 0 3.2 5.5L2.1 4.4A7.6 7.6 0 0 1 7.5 2.2zm0 3.2c1.2 0 2.3.5 3.1 1.3L9.5 7.8A2.7 2.7 0 0 0 7.5 7a2.7 2.7 0 0 0-2 .8L4.4 6.7A4.5 4.5 0 0 1 7.5 5.4zM7.5 9.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.6" y="2" width="21" height="8" rx="2" stroke="#fff" fill="none" stroke-width="1.2"/><rect x="2" y="3.4" width="16" height="5.2" rx="1" fill="#fff"/><rect x="22.2" y="4.2" width="1.6" height="3.6" rx="0.6" fill="#fff"/></svg>
          </div>
        </div>
        <div class="body">
          <div class="fm-filters" style="margin-bottom:10px">
            <span class="fm-chip on">Hub</span><span class="fm-chip">Pay</span><span class="fm-chip">Moves</span>
          </div>
          <h2>Cards</h2>
          <p>Same kit as web. Touch stays inside the phone.</p>
          <div class="fm-banner" id="ban" style="margin-bottom:10px"><b>Limit ready</b><span>Protected this month.</span></div>
          <div class="stack">
            <button class="fm-btn" id="hit" type="button">Pay</button>
            <button class="fm-btn ghost" type="button">Limit</button>
          </div>
        </div>
        <div class="home"></div>
      </div>
    </div>
  </div>
</div>
<script src="fm-engine.js"></script>
<script>
(function(){
  var unit=document.getElementById('unit');
  FM.skin('chek');
  FM.cursors(unit, 1, 'touch');
  FM.after(400, function(){
    FM.move('u1', document.getElementById('hit'));
    FM.ring(document.getElementById('hit'), true);
    FM.tip(document.getElementById('hit'), 'Figma touch');
  });
  ['dc','bc','cus','ey','chek'].forEach(function(sk,i){
    FM.after(1400+i*800, function(){ FM.skin(sk); });
  });
})();
</script>
</body></html>
