<!DOCTYPE html>
<html lang="en" data-skin="cus" data-mode="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DS Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="fm-ds.css"/>
<style>
.stage-pad{height:100%;display:flex;align-items:center;justify-content:center}
.iphone .body h2{margin:4px 0 8px;font-size:20px}
.iphone .body p{margin:0 0 12px;font-size:12px;color:var(--fm-muted);line-height:1.4}
.stack{display:flex;flex-direction:column;gap:8px}
.panel{display:none}.panel.on{display:block}
</style></head>
<body>
<div class="stage">
  <div class="fm-unit" id="unit">
    <div class="stage-pad">
      <div class="iphone">
        <div class="sb">
          <div class="t">9:41</div>
          <div class="island"></div>
          <div class="sys"></div>
        </div>
        <div class="body">
          <section class="panel on" data-comp="overview">
            <h2>Mobile kit</h2>
            <p>Toque Figma. Elegí un tipo en el catálogo.</p>
            <button class="fm-btn" id="hit" type="button" style="width:100%">Primary</button>
          </section>
          <section class="panel" data-comp="buttons">
            <h2>Buttons</h2>
            <div class="stack">
              <button class="fm-btn" id="hit" type="button">Primary</button>
              <button class="fm-btn secondary" type="button">Secondary</button>
              <button class="fm-btn ghost" type="button">Ghost</button>
            </div>
          </section>
          <section class="panel" data-comp="fields">
            <h2>Fields</h2>
            <div class="stack">
              <div class="fm-field">Buscar pase</div>
              <div class="fm-field">San Bartolo</div>
            </div>
          </section>
          <section class="panel" data-comp="pass">
            <p style="font-size:11px;letter-spacing:.08em;color:var(--fm-faint)">VEHÍCULOS / INGRESO</p>
            <h2>Boarding pass</h2>
            <div class="fm-banner" style="margin:10px 0"><b>Mazda CX-5</b><span>BP · SV-240821-0068</span></div>
            <span class="fm-tag ok">Habilitado</span>
          </section>
          <section class="panel" data-comp="scan">
            <h2>Escaneo</h2>
            <div class="fm-notice" style="margin:10px 0">Listo para escanear</div>
            <button class="fm-btn" type="button" style="width:100%">Simular escaneo</button>
          </section>
        </div>
        <div class="home"></div>
      </div>
    </div>
  </div>
</div>
<script src="fm-engine.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  FM.skin(q.get('skin')||'cus');
  FM.mode(q.get('mode')||'light');
  var comp=q.get('comp')||'overview';
  document.querySelectorAll('.panel').forEach(function(p){
    p.classList.toggle('on', p.getAttribute('data-comp')===comp);
  });
  FM.cursors(document.getElementById('unit'), 1, 'touch');
})();
</script>
</body></html>
