<!DOCTYPE html>
<html lang="en" data-skin="ey" data-device="desktop" data-mode="light"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DS Web</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="fm-ds.css"/>
<style>
.pad{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;height:100%;box-sizing:border-box;overflow:hidden}
.lab{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--fm-faint);margin-bottom:6px}
.span{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head>
<body>
<div class="stage">
  <div class="fm-unit" id="unit">
    <div class="fm-shell">
      <div class="fm-bbar"><div class="fm-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="fm-addr" id="addr">ds / web</div></div>
      <div class="fm-app">
        <div class="fm-nav"><span class="on">Catalog</span><span>Workbench</span><span>Hub</span></div>
        <div class="pad">
          <div class="span">
            <div class="lab">Search + buttons</div>
            <div class="row">
              <div class="fm-field" id="search" style="flex:1;min-width:160px">Search</div>
              <button class="fm-btn" id="b1" type="button">Primary</button>
              <button class="fm-btn secondary" type="button">Secondary</button>
              <button class="fm-btn ghost" type="button">Ghost</button>
            </div>
          </div>
          <div class="span">
            <div class="lab">Tags + filters</div>
            <div class="row">
              <span class="fm-tag ok">Aprobado</span><span class="fm-tag warn">Revisión</span><span class="fm-tag bad">Rechazado</span>
              <span class="fm-chip on">All</span><span class="fm-chip">Pending</span>
            </div>
          </div>
          <div class="span">
            <div class="lab">Banner / notice</div>
            <div class="fm-notice" id="ban">Los campos con * son obligatorios.</div>
          </div>
          <div>
            <div class="lab">Stepper</div>
            <div class="fm-stepper"><b>1</b> Selección · 2 Info · 3 Revisión</div>
          </div>
          <div>
            <div class="lab">KPIs</div>
            <div class="fm-kpis" style="grid-template-columns:1fr 1fr">
              <div class="fm-kpi"><i>Pending</i><b>3</b></div>
              <div class="fm-kpi"><i>Live</i><b>11</b></div>
            </div>
          </div>
          <div class="span">
            <div class="lab">Table</div>
            <table class="fm-table" id="tbl">
              <thead><tr><th>Item</th><th>Estado</th></tr></thead>
              <tbody>
                <tr><td>ARIVU-715912</td><td><span class="fm-tag ok">Aprobado</span></td></tr>
                <tr><td>Workbench</td><td><span class="fm-tag warn">Revisión</span></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="phone-slot">
      <div class="iphone">
        <div class="sb"><div class="t">9:41</div><div class="island"></div><div class="sys"></div></div>
        <div class="body">
          <div class="fm-notice">Boarding pass</div>
          <button class="fm-btn" style="margin-top:10px;width:100%" type="button">Escanear</button>
        </div>
        <div class="home"></div>
      </div>
    </div>
  </div>
</div>
<script src="fm-engine.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var skin=q.get('skin')||'ey';
  var device=q.get('device')||'desktop';
  var mode=q.get('mode')||'light';
  FM.skin(skin); FM.mode(mode);
  document.documentElement.setAttribute('data-device', device);
  document.getElementById('addr').textContent='ds / '+device+' / '+skin+' / '+mode;
  var unit=document.getElementById('unit');
  if(device!=='phone'){
    FM.cursors(unit,1);
    FM.after(400, function(){ FM.move('u1', document.getElementById('b1')); });
  }
})();
</script>
</body></html>
