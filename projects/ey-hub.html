<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hub</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f3f4f8;font-family:'IBM Plex Sans',system-ui,sans-serif}
.stage{position:relative;min-height:360px}
.br{height:360px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#0b0c10}
.bb{height:24px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#14151c;border-bottom:1px solid rgba(255,255,255,.08);font-size:8px;color:#9aa0b0;font-family:'IBM Plex Mono',monospace}
.d{display:flex;gap:5px}.d i{width:7px;height:7px;border-radius:50%;display:block}
.d .r{background:#ff5f57}.d .y{background:#febc2e}.d .g{background:#28c840}
.app{flex:1;display:grid;grid-template-columns:128px 1fr;min-height:0;background:#12141c}
.side{padding:12px 8px;border-right:1px solid rgba(255,255,255,.08);font-size:10px}
.sh{font-size:11px;font-weight:700;margin-bottom:10px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;margin-bottom:3px;color:#9aa0b0}
.side a.on{background:rgba(255,255,255,.07);color:#fff}
.badge{background:#e24b4b;color:#fff;font-size:8px;padding:1px 6px;border-radius:100px;font-family:'IBM Plex Mono',monospace}
.main{padding:12px 14px}
h3{margin:0 0 8px;font-size:14px}
.filters{display:flex;gap:6px;margin-bottom:10px}
.filters i{font-style:normal;font-size:8px;padding:3px 7px;border:1px solid rgba(255,255,255,.1);border-radius:100px;color:#8a8580}
.filters i.on{color:#fff;border-color:#e8943a;color:#f0de5a}
table{width:100%;border-collapse:collapse;font-size:10px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
th{color:#8a8580;font-size:8px;font-family:'IBM Plex Mono',monospace}td{color:#c8c4bc}tr.hot td{color:#ff8a8a}
.cursor{position:absolute;z-index:20;width:16px;height:16px;pointer-events:none;opacity:0;transition:left .8s cubic-bezier(.34,1.32,.64,1),top .8s cubic-bezier(.34,1.32,.64,1),opacity .2s}
.cursor.show{opacity:1}.cursor.click{transform:scale(.88)}
</style></head>
<body>
<div class="stage" id="stage">
<div class="br">
  <div class="bb"><div class="d"><i class="r"></i><i class="y"></i><i class="g"></i></div>hub / signals</div>
  <div class="app">
    <div class="side">
      <div class="sh">Hub</div>
      <a href="#">Overview</a>
      <a href="#" id="al">Alarms <span class="badge">3</span></a>
      <a href="#">Paths</a>
      <a href="#">Guides <span class="badge">1</span></a>
    </div>
    <div class="main" id="main">
      <h3>Signals</h3>
      <p style="font-size:10px;color:#9aa0b0">The product is live. Alarms sit on the areas that moved.</p>
    </div>
  </div>
</div>
<div class="cursor" id="c1"><svg viewBox="0 0 18 18"><path d="M2 2 L2 14 L6.2 10.4 L9.6 16.2 L11.4 15.3 L8 9.4 L14 9.4 Z" fill="#fff"/></svg></div>
</div>
<script>
(function(){
  var stage=document.getElementById('stage'), c1=document.getElementById('c1'), main=document.getElementById('main'), timers=[];
  function after(ms,fn){var t=setTimeout(fn,ms);timers.push(t)}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop')timers.forEach(clearTimeout)});
  function place(t){var r=t.getBoundingClientRect(),s=stage.getBoundingClientRect();c1.style.left=(r.left-s.left+8)+'px';c1.style.top=(r.top-s.top+6)+'px';c1.classList.add('show')}
  function click(cb){after(480,function(){c1.classList.add('click');after(260,function(){c1.classList.remove('click');if(cb)cb()})})}
  after(500,function(){
    var al=document.getElementById('al'); place(al); click(function(){
      al.classList.add('on');
      main.innerHTML='<h3>Alarms</h3><div class="filters"><i>All</i><i id="f1">Catalog</i><i id="f2">Workbench</i><i>Reports</i></div><table><tr><th>Area</th><th>Signal</th></tr><tr><td>Catalog</td><td>held</td></tr><tr id="rw"><td>Workbench · required</td><td>drop growing</td></tr></table>';
      after(600,function(){
        var f=document.getElementById('f2'); place(f); click(function(){
          f.classList.add('on');
          document.getElementById('rw').className='hot';
          after(400,function(){c1.classList.remove('show')});
        });
      });
    });
  });
})();
</script>
</body></html>
