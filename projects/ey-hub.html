<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hub</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ey-ds.css"/>
<style>
.app{display:grid;grid-template-columns:118px 1fr;flex:1;min-height:0}
.side{padding:12px 8px;border-right:1px solid var(--ey-line);font-size:10px;background:var(--ey-side)}
.sh{font-size:11px;font-weight:700;margin-bottom:10px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;margin-bottom:3px;color:var(--ey-muted);text-decoration:none}
.side a.on{background:rgba(255,255,255,.07);color:#fff}
.badge{background:#e24b4b;color:#fff;font-size:8px;padding:1px 6px;border-radius:100px;font-family:'IBM Plex Mono',monospace}
.main{padding:12px 14px;overflow:hidden}
h3{margin:0 0 8px;font-size:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.kpi{border:1px solid var(--ey-line);padding:8px;font-size:8px;color:var(--ey-faint)}
.kpi b{display:block;color:#fff;font-size:14px;margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--ey-card);border:1px solid var(--ey-line);border-radius:7px;padding:7px 8px;margin-bottom:5px;font-size:10px}
.filters{display:flex;gap:6px;margin-bottom:10px}
.filters i{font-style:normal;font-size:8px;padding:3px 7px;border:1px solid var(--ey-line);border-radius:100px;color:#8a8580}
.filters i.on{color:#f0de5a;border-color:#e8943a}
.funs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fn{border:1px solid var(--ey-line);padding:8px}
.fn .l{font-size:8px;font-family:'IBM Plex Mono',monospace;color:#8a8580;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.bars{display:flex;align-items:flex-end;gap:3px;height:28px}
.bars b{flex:1;background:#2a2c36;display:block}
.bars.hot b:last-child{background:#e24b4b}
.feat .l{font-size:8px;font-family:'IBM Plex Mono',monospace;color:#8a8580;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 6px}
.feat div{font-size:10px;color:#c8c4bc;padding:3px 0;border-bottom:1px solid var(--ey-line)}
.feat em{color:#f0de5a;font-style:normal}
.uc{position:absolute;z-index:8;pointer-events:none;opacity:0;transition:left .8s cubic-bezier(.34,1.32,.64,1),top .8s cubic-bezier(.34,1.32,.64,1),opacity .2s}
.uc.on{opacity:1}
.uc i{display:block;width:0;height:0;border:6px solid transparent;border-top-color:#fff}
.ey-browser{position:relative}
</style></head>
<body>
<div class="stage" id="stage"></div>
<script>
(function(){
  var stage=document.getElementById('stage'), timers=[];
  function after(ms,fn){timers.push(setTimeout(fn,ms))}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop')timers.forEach(clearTimeout)});
  function paint(url,side,main){
    var win=document.getElementById('win');
    if(!win){
      stage.innerHTML='<div class="ey-browser" id="win"><div class="ey-bbar"><div class="ey-dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="ey-addr" id="addr"></div></div><div class="app" id="app"></div><div class="uc on" id="c1"><i></i></div></div>';
    }
    document.getElementById('addr').textContent=url;
    document.getElementById('app').innerHTML='<div class="side"><div class="sh">Hub</div>'+side+'</div><div class="main">'+main+'</div>';
  }
  function move(el,ox,oy){
    var n=document.getElementById('c1'), w=document.getElementById('win');
    if(!n||!el||!w) return;
    var r=el.getBoundingClientRect(), b=w.getBoundingClientRect();
    n.style.left=Math.max(8,Math.min(b.width-24,r.left-b.left+(ox||8)))+'px';
    n.style.top=Math.max(8,Math.min(b.height-24,r.top-b.top+(oy||8)))+'px';
    n.classList.add('on');
  }
  var dashSide='<a class="on" href="#">Overview</a><a href="#" id="al">Alarms <span class="badge">3</span></a><a href="#">Paths</a><a href="#">Guides</a>';
  var dashMain='<h3>Signals</h3><div class="kpis"><div class="kpi">Request drop<b>78%</b></div><div class="kpi">Onboard stall<b>41%</b></div><div class="kpi">Help unused<b>12%</b></div></div><div class="row">Workbench required field<div class="badge">hot</div></div><div class="row">Catalog → form path<div class="badge">3</div></div>';
  var alarmSide='<a href="#">Overview</a><a class="on" href="#" id="al">Alarms <span class="badge">3</span></a><a href="#">Paths</a><a href="#">Guides</a>';
  var alarmMain='<h3>Alarms</h3><div class="filters"><i>All</i><i>Catalog</i><i id="f2">Workbench</i><i>Reports</i></div><div class="row">Workbench required field</div><div class="row">Help unused on request</div>';
  var wbMain='<h3>Workbench</h3><div class="filters"><i>All</i><i>Catalog</i><i class="on">Workbench</i></div><div class="funs"><div class="fn"><div class="l">Request funnel</div><div class="bars hot"><b style="height:100%"></b><b style="height:88%"></b><b style="height:54%"></b><b style="height:22%"></b></div></div><div class="fn"><div class="l">Onboard funnel</div><div class="bars"><b style="height:90%"></b><b style="height:70%"></b><b style="height:62%"></b><b style="height:58%"></b></div></div></div><div class="feat"><div class="l">Features in this area</div><div>Required service <em>field</em></div><div>Order rail</div><div>Onboarding guide</div></div>';
  paint('hub / overview',dashSide,dashMain);
  after(400,function(){ move(document.getElementById('al')); });
  after(1400,function(){
    paint('hub / alarms',alarmSide,alarmMain);
    after(200,function(){ move(document.getElementById('f2')); });
  });
  after(2800,function(){
    paint('hub / workbench',alarmSide,wbMain);
    var c=document.getElementById('c1'); if(c) c.classList.remove('on');
  });
})();
</script>
</body></html>
