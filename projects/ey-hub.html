<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hub</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f3f4f8;font-family:'IBM Plex Sans',system-ui,sans-serif}
.stage{position:relative;min-height:360px}
.br{height:360px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#0b0c10}
.bb{height:24px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#14151c;border-bottom:1px solid rgba(255,255,255,.08);font-size:8px;color:#9aa0b0;flex-shrink:0}
.d{display:flex;gap:5px}.d i{width:7px;height:7px;border-radius:50%;display:block}
.d .r{background:#ff5f57}.d .y{background:#febc2e}.d .g{background:#28c840}
.app{flex:1;display:grid;grid-template-columns:120px 1fr;min-height:0;background:#12141c}
.side{padding:12px 10px;border-right:1px solid rgba(255,255,255,.08);font-size:9px;color:#9aa0b0}
.side .brand{color:#fff;font-weight:700;margin-bottom:10px;font-size:11px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;margin-bottom:3px}
.side a.on{background:rgba(255,255,255,.06);color:#fff}
.bell{background:#e24b4b;color:#fff;font-size:8px;padding:1px 6px;border-radius:100px;opacity:0;transform:scale(.8);transition:.3s}
.bell.on{opacity:1;transform:none}
.main{padding:12px 14px}
.h{font-size:14px;font-weight:700;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{border:1px solid rgba(255,255,255,.08);padding:10px}
.kpi .l{font-size:8px;color:#8a8580;letter-spacing:.08em;text-transform:uppercase}
.kpi .v{font-size:16px;font-weight:700;margin-top:4px}
.kpi.hot .v{color:#ff6b6b}
table{width:100%;border-collapse:collapse;font-size:10px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
th{color:#8a8580;font-weight:500;font-size:8px}
td{color:#c8c4bc}
tr.hot td{color:#ff8a8a;background:rgba(226,75,75,.08)}
.toast{position:absolute;right:16px;top:36px;width:200px;background:#2a1416;border:1px solid rgba(226,75,75,.45);padding:10px 12px;font-size:10px;border-radius:8px;opacity:0;transform:translateY(-8px);transition:.4s;z-index:5}
.toast.on{opacity:1;transform:none}
.toast b{display:block;color:#ff8a8a;margin-bottom:4px}
</style></head>
<body>
<div class="stage">
<div class="br">
  <div class="bb"><div class="d"><i class="r"></i><i class="y"></i><i class="g"></i></div>hub.platform / signals</div>
  <div class="app">
    <div class="side">
      <div class="brand">Hub</div>
      <a class="on" href="#">Signals <span class="bell" id="bell">1</span></a>
      <a href="#">Paths</a>
      <a href="#">Guides</a>
      <a href="#">Events</a>
    </div>
    <div class="main">
      <div class="h">Signals</div>
      <div class="kpis">
        <div class="kpi"><div class="l">Form starts</div><div class="v" id="v0">held</div></div>
        <div class="kpi" id="k1"><div class="l">Required field</div><div class="v" id="v1">stable</div></div>
        <div class="kpi"><div class="l">Guides</div><div class="v">thin</div></div>
      </div>
      <table>
        <thead><tr><th>Step</th><th>Reach</th><th>Drop</th></tr></thead>
        <tbody>
          <tr><td>Home</td><td>100</td><td>—</td></tr>
          <tr><td>Catalog</td><td>88</td><td>12</td></tr>
          <tr><td>Services</td><td>72</td><td>16</td></tr>
          <tr><td>Workbench</td><td>54</td><td>18</td></tr>
          <tr id="hot"><td>Required service</td><td>22</td><td id="drop">18</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div class="toast" id="toast"><b>Drop-off growing</b>Required service — more people leave after naming the workspace.</div>
</div>
<script>
(function(){
  var t=[]; function after(ms,fn){var x=setTimeout(fn,ms);t.push(x)}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='fm-stop')t.forEach(clearTimeout)});
  after(900,function(){
    document.getElementById('toast').classList.add('on');
    document.getElementById('bell').classList.add('on');
  });
  after(1300,function(){
    document.getElementById('k1').classList.add('hot');
    document.getElementById('v1').textContent='rising';
    document.getElementById('hot').className='hot';
    document.getElementById('drop').textContent='32';
  });
})();
</script>
</body></html>
